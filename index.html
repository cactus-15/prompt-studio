<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Prompt Studio</title>
  <!-- CodeMirror 5 for Markdown Emphasis + HTML/JSX Highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/jsx/jsx.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg-sub: #f8fafc;
      --bg-hover: #f1f5f9;
      --bg-active: #eff6ff;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --accent-border: #bfdbfe;
      --success: #16a34a;
      --success-bg: #15803d;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --warn: #d97706;
      --code-bg: #f1f5f9;
      --tag-bg: #f1f5f9;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.1);
      --radius: 8px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sidebar-w: 272px;
      --topbar-h: 50px;
      --statusbar-h: 34px;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --bg-sub: #131c31;
      --bg-hover: #1e293b;
      --bg-active: #172554;
      --surface: #111827;
      --border: #1e293b;
      --border-strong: #334155;
      --text: #f1f5f9;
      --text-sub: #cbd5e1;
      --text-muted: #64748b;
      --accent: #60a5fa;
      --accent-soft: #172554;
      --accent-border: #1d4ed8;
      --success: #22c55e;
      --success-bg: #16a34a;
      --danger: #f87171;
      --danger-soft: #450a0a;
      --warn: #f59e0b;
      --code-bg: #1e293b;
      --tag-bg: #1e293b;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
      overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select {
      font-family: inherit; font-size: inherit; color: inherit;
    }
    button {
      background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* Layout */
    .app { display: flex; flex-direction: column; height: 100%; width: 100%; }

    /* Topbar */
    .topbar {
      height: var(--topbar-h); min-height: var(--topbar-h);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px; gap: 8px; z-index: 30;
    }
    .topbar-left, .topbar-right {
      display: flex; align-items: center; gap: 6px; min-width: 0;
    }
    .topbar-left { flex: 1; overflow-x: auto; scrollbar-width: none; }
    .topbar-left::-webkit-scrollbar { display: none; }

    .btn {
      height: 32px; padding: 0 10px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-size: 13px; font-weight: 500;
      white-space: nowrap; transition: background 0.12s, border-color 0.12s;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .btn-ghost { border-color: transparent; background: transparent; }
    .btn-ghost:hover { background: var(--bg-hover); border-color: transparent; }
    .btn-icon { width: 32px; height: 32px; padding: 0; }
    .btn-primary {
      background: var(--success-bg); border-color: var(--success-bg); color: #ffffff;
    }
    .btn-primary:hover { filter: brightness(1.07); background: var(--success-bg); border-color: var(--success-bg); }
    .btn-accent {
      background: var(--accent); border-color: var(--accent); color: #ffffff;
    }
    .btn-accent:hover { filter: brightness(1.07); }
    .btn-danger { color: var(--danger); border-color: var(--border); }
    .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
    .btn-sm { height: 27px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
    .btn-xs { height: 24px; padding: 0 6px; font-size: 11.5px; border-radius: 5px; }

    .pill-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); display: inline-block;
    }
    .pill-dot.connected { background: var(--success); }
    .pill-dot.dirty { background: var(--warn); }

    /* Workspace */
    .workspace {
      flex: 1; display: flex; min-height: 0; position: relative; overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      border-right: 1px solid var(--border);
      background: var(--bg-sub);
      display: flex; flex-direction: column;
      transition: margin-left 0.18s ease, transform 0.18s ease;
      z-index: 20;
    }
    .sidebar.collapsed { margin-left: calc(var(--sidebar-w) * -1); }
    .sidebar-backdrop {
      display: none; position: fixed; inset: var(--topbar-h) 0 0 0;
      background: rgba(15, 23, 42, 0.35); z-index: 19;
    }
    .sidebar-head {
      padding: 10px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .search-box {
      position: relative; display: flex; align-items: center;
    }
    .search-box svg {
      position: absolute; left: 9px; color: var(--text-muted); width: 14px; height: 14px;
    }
    .search-input {
      width: 100%; height: 32px; padding: 0 10px 0 30px;
      border-radius: 7px; border: 1px solid var(--border);
      background: var(--bg); font-size: 12.5px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .seg-control {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--bg-hover); padding: 2px; border-radius: 7px; gap: 2px;
    }
    .seg-btn {
      height: 25px; border-radius: 5px; font-size: 12px; color: var(--text-sub); font-weight: 500;
    }
    .seg-btn.active {
      background: var(--bg); color: var(--text); box-shadow: var(--shadow-sm);
    }

    .sidebar-tags {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      padding: 0 2px;
    }
    .tag-chip {
      font-size: 11px; padding: 2px 7px; border-radius: 99px;
      background: var(--bg-hover); color: var(--text-sub); border: 1px solid var(--border);
    }

    .sidebar-actions {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; border-bottom: 1px solid var(--border);
      gap: 4px;
    }

    .tree {
      flex: 1; overflow-y: auto; padding: 8px 6px 24px;
    }
    .tree-pinned {
      margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .tree-folder { margin-bottom: 4px; }
    .tree-folder-row {
      display: flex; align-items: center; gap: 5px;
      height: 32px; padding: 0 6px; border-radius: 6px;
      color: var(--text); font-weight: 600; font-size: 13px;
      cursor: pointer; user-select: none;
    }
    .tree-folder-row:hover { background: var(--bg-hover); }
    .tree-folder-row.active-view { background: var(--bg-active); color: var(--accent); }
    .tree-folder-name {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tree-folder-actions {
      display: flex; align-items: center; gap: 2px;
    }
    .tree-mini-btn {
      width: 24px; height: 24px; border-radius: 5px; color: var(--text-sub);
    }
    .tree-mini-btn:hover { background: var(--border); color: var(--text); }
    .tree-mini-btn.active { background: var(--accent-soft); color: var(--accent); }
    .tree-mini-btn svg { width: 14px; height: 14px; }
    .chevron { transition: transform 0.15s; color: var(--text-muted); width: 13px; height: 13px; }
    .chevron.closed { transform: rotate(-90deg); }

    .tree-items { padding-left: 16px; margin-top: 2px; }
    .tree-item {
      display: flex; align-items: center; gap: 6px;
      min-height: 31px; padding: 4px 8px; border-radius: 6px;
      color: var(--text-sub); font-size: 13px; cursor: pointer;
    }
    .tree-item:hover { background: var(--bg-hover); color: var(--text); }
    .tree-item.active { background: var(--bg-active); color: var(--accent); font-weight: 600; }
    .tree-item-title {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tree-item-meta {
      font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums;
    }
    .tree-item-more {
      opacity: 0; width: 22px; height: 22px; border-radius: 4px; color: var(--text-muted);
    }
    .tree-item:hover .tree-item-more, .tree-item.active .tree-item-more { opacity: 1; }
    .tree-item-more:hover { background: var(--border); color: var(--text); }
    .code-badge {
      font-size: 10px; padding: 1px 4px; border-radius: 4px;
      background: var(--bg-hover); color: var(--text-muted); font-weight: 600;
    }

    /* Search results */
    .search-results { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
    .search-hit {
      padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--bg); cursor: pointer;
    }
    .search-hit:hover { border-color: var(--accent); }
    .search-hit-head { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .search-hit-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .search-hit-snippet {
      font-size: 12px; color: var(--text-sub);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Main Content Area */
    .main {
      flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg);
    }
    .main-header {
      min-height: 46px; padding: 6px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .breadcrumb {
      display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13.5px;
    }
    .crumb-folder {
      padding: 2px 8px; border-radius: 5px; background: var(--bg-hover);
      color: var(--text-sub); font-size: 12px; font-weight: 500;
    }
    .crumb-sep { color: var(--text-muted); }
    .crumb-title-input {
      border: 1px solid transparent; background: transparent;
      font-weight: 700; font-size: 14.5px; color: var(--text);
      padding: 2px 6px; border-radius: 5px; min-width: 120px; max-width: 260px;
      outline: none;
    }
    .crumb-title-input:hover { border-color: var(--border); }
    .crumb-title-input:focus { border-color: var(--accent); background: var(--bg-sub); }
    .main-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* Lorebook Keyword Bar */
    .lore-bar {
      padding: 8px 14px; border-bottom: 1px solid var(--border);
      background: var(--bg-sub); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .lore-bar label {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12.5px; font-weight: 600; color: var(--text-sub); white-space: nowrap;
    }
    .lore-input {
      flex: 1; min-width: 180px; height: 31px; padding: 0 10px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
      font-size: 13px; outline: none;
    }
    .lore-input:focus { border-color: var(--accent); }
    .lore-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

    /* Editor & Split Preview */
    .editor-stage {
      flex: 1; min-height: 0; display: flex; overflow: hidden;
    }
    .editor-pane {
      flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    .preview-pane {
      width: 46%; min-width: 300px; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; background: var(--bg-sub);
    }
    .preview-head {
      height: 36px; padding: 0 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600; color: var(--text-sub);
    }
    .preview-iframe {
      flex: 1; width: 100%; border: none; background: #ffffff;
    }

    /* CodeMirror Custom Prompt-Markdown Styling (Matches Reference Image 2) */
    .CodeMirror {
      height: 100% !important; width: 100%;
      font-family: var(--font-sans);
      font-size: 14.5px; line-height: 1.72;
      background: var(--bg); color: var(--text);
    }
    .CodeMirror.cm-code-mode {
      font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6;
    }
    .CodeMirror-gutters {
      background: var(--bg); border-right: 1px solid var(--border);
    }
    .CodeMirror-linenumber { color: var(--text-muted); font-size: 12px; padding: 0 8px 0 6px; }
    .CodeMirror-lines { padding: 14px 0 60px; }
    .CodeMirror pre.CodeMirror-line, .CodeMirror pre.CodeMirror-line-like { padding: 0 18px; }
    .CodeMirror-cursor { border-left: 2px solid var(--accent); }
    .CodeMirror-selected { background: var(--accent-soft) !important; }

    .cm-pm-h1 { font-size: 1.42em; font-weight: 800; color: var(--text); line-height: 1.45; }
    .cm-pm-h2 { font-size: 1.22em; font-weight: 700; color: var(--text); line-height: 1.5; }
    .cm-pm-h3 { font-size: 1.08em; font-weight: 700; color: var(--text); line-height: 1.55; }
    .cm-pm-syntax { color: var(--text-muted); font-weight: 500; }
    .cm-pm-bold { font-weight: 700; color: var(--text); }
    .cm-pm-italic { font-style: italic; color: var(--text-sub); }
    .cm-pm-list { color: var(--accent); font-weight: 600; }
    .cm-pm-var {
      color: var(--accent); background: var(--accent-soft);
      font-family: var(--font-mono); font-size: 0.92em; font-weight: 600;
      padding: 1px 4px; border-radius: 4px;
    }
    .cm-pm-code {
      background: var(--code-bg); color: var(--text);
      font-family: var(--font-mono); font-size: 0.92em;
      padding: 1px 5px; border-radius: 4px;
    }
    .cm-pm-tag {
      color: var(--text-sub); background: var(--code-bg);
      font-family: var(--font-mono); font-size: 0.92em;
      padding: 1px 4px; border-radius: 4px;
    }
    .cm-pm-bracket {
      color: var(--text); background: var(--code-bg);
      font-weight: 600; padding: 1px 4px; border-radius: 4px;
    }
    .cm-pm-hr {
      color: var(--text-muted);
      display: inline-block; width: 100%;
      border-bottom: 1px solid var(--border-strong);
      line-height: 1;
    }

    /* Fallback textarea */
    .fallback-textarea {
      width: 100%; height: 100%; border: none; outline: none; resize: none;
      padding: 16px 20px; background: var(--bg); color: var(--text);
      font-size: 14.5px; line-height: 1.7;
    }

    /* Character Info Page (Matches Reference Image 1) */
    .char-info-page {
      flex: 1; overflow-y: auto; background: var(--bg);
    }
    .char-info-top {
      padding: 18px 24px 14px; border-bottom: 1px solid var(--border);
    }
    .char-info-kicker {
      font-size: 12.5px; font-weight: 600; color: var(--accent); margin-bottom: 4px;
    }
    .char-info-heading {
      font-size: 19px; font-weight: 700; color: var(--text);
    }
    .char-info-section {
      padding: 18px 24px; border-bottom: 1px solid var(--border);
    }
    .char-profile-row {
      display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap;
    }
    .profile-box {
      width: 164px; height: 210px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg-sub);
      overflow: hidden; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-muted); flex-shrink: 0;
    }
    .profile-box img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .profile-controls {
      display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 220px; padding-top: 4px;
    }
    .profile-asset-note {
      font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);
      background: var(--bg-sub); padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--border); word-break: break-all;
    }
    .field-label-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .field-label { font-size: 13px; font-weight: 600; color: var(--text-sub); }
    .field-counter { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .field-counter.over { color: var(--danger); font-weight: 600; }
    .field-input {
      width: 100%; height: 42px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 14.5px; outline: none;
    }
    .field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* Card Views (Lorebook Grid + Text Folder Stacked Cards) */
    .cards-scroll {
      flex: 1; overflow-y: auto; padding: 16px 20px 40px; background: var(--bg-sub);
    }
    .lore-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px; align-items: start;
    }
    .text-stack {
      display: flex; flex-direction: column; gap: 14px; max-width: 1040px; margin: 0 auto;
    }
    .item-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: var(--shadow-sm); transition: border-color 0.14s;
    }
    .item-card:hover { border-color: var(--border-strong); }
    .card-head {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      background: var(--bg); display: flex; flex-direction: column; gap: 6px;
    }
    .card-head-top {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .card-title {
      font-weight: 700; font-size: 14px; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .card-actions { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
    .card-kw-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .kw-pill {
      font-size: 11px; padding: 2px 7px; border-radius: 5px;
      background: var(--accent-soft); color: var(--accent);
      border: 1px solid var(--accent-border); font-weight: 500;
    }
    .kw-pill.empty {
      background: var(--bg-hover); color: var(--text-muted); border-color: var(--border);
    }
    .card-body {
      padding: 12px 14px; font-size: 13.5px; line-height: 1.68;
      color: var(--text); word-break: break-word;
    }
    .lore-grid .card-body { max-height: 360px; overflow-y: auto; }
    .card-edit-box {
      padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg-sub);
    }
    .card-edit-textarea {
      width: 100%; min-height: 180px; padding: 10px;
      border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg); color: var(--text); font-size: 13.5px; line-height: 1.6;
      resize: vertical; outline: none;
    }
    .card-edit-textarea:focus { border-color: var(--accent); }

    /* Rendered Markdown Emphasis inside Cards */
    .md-h1 { font-size: 1.32em; font-weight: 800; margin: 8px 0 4px; color: var(--text); }
    .md-h2 { font-size: 1.15em; font-weight: 700; margin: 6px 0 3px; color: var(--text); }
    .md-h3 { font-size: 1.04em; font-weight: 700; margin: 5px 0 2px; color: var(--text); }
    .md-line { min-height: 1.4em; }
    .md-blank { height: 0.7em; }
    .md-hr { height: 1px; background: var(--border-strong); margin: 10px 0; }
    .md-syn { color: var(--text-muted); font-weight: 400; }
    .md-bold { font-weight: 700; color: var(--text); }
    .md-italic { font-style: italic; color: var(--text-sub); }
    .md-list { color: var(--accent); font-weight: 600; }
    .md-var {
      color: var(--accent); background: var(--accent-soft);
      font-family: var(--font-mono); font-size: 0.9em; font-weight: 600;
      padding: 1px 4px; border-radius: 4px;
    }
    .md-code {
      background: var(--code-bg); font-family: var(--font-mono);
      font-size: 0.9em; padding: 1px 4px; border-radius: 4px;
    }
    .md-tag {
      background: var(--code-bg); color: var(--text-sub);
      font-family: var(--font-mono); font-size: 0.9em; padding: 1px 4px; border-radius: 4px;
    }
    .md-bracket {
      background: var(--code-bg); font-weight: 600; padding: 1px 4px; border-radius: 4px;
    }

    /* Bottom Statusbar */
    .statusbar {
      height: var(--statusbar-h); min-height: var(--statusbar-h);
      border-top: 1px solid var(--border); background: var(--bg-sub);
      padding: 0 14px; display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--text-sub); gap: 10px;
      font-variant-numeric: tabular-nums;
    }
    .status-group { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .status-pill {
      padding: 2px 7px; border-radius: 99px; border: 1px solid var(--border);
      background: var(--bg); font-size: 11px; color: var(--text-sub);
    }

    /* Dropdown Menu */
    .dropdown-wrap { position: relative; }
    .dropdown-menu {
      position: fixed; min-width: 220px; max-width: 300px; max-height: 360px; overflow-y: auto;
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
      box-shadow: var(--shadow-md); padding: 5px; z-index: 100;
    }
    .dd-item {
      width: 100%; padding: 7px 10px; border-radius: 6px;
      justify-content: space-between; text-align: left; font-size: 13px; color: var(--text);
    }
    .dd-item:hover { background: var(--bg-hover); }
    .dd-item.active { background: var(--bg-active); color: var(--accent); font-weight: 600; }
    .dd-sep { height: 1px; background: var(--border); margin: 4px 0; }
    .dd-label { font-size: 11px; color: var(--text-muted); padding: 4px 10px; font-weight: 600; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 200;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 560px; max-height: 88vh;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow-md); display: flex; flex-direction: column; overflow: hidden;
    }
    .modal.modal-lg { max-width: 860px; }
    .modal-head {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      font-weight: 700; font-size: 15px;
    }
    .modal-body {
      padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-foot {
      padding: 12px 18px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
    }
    .form-row { display: flex; flex-direction: column; gap: 5px; }
    .form-row label { font-size: 12.5px; font-weight: 600; color: var(--text-sub); }
    .form-input, .form-select {
      height: 36px; padding: 0 11px; border: 1px solid var(--border);
      border-radius: 7px; background: var(--bg); color: var(--text); outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--accent); }
    .form-check {
      display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sub); cursor: pointer;
    }

    /* Diff Viewer */
    .history-layout { display: grid; grid-template-columns: 240px 1fr; gap: 14px; min-height: 360px; }
    .history-list {
      border: 1px solid var(--border); border-radius: 8px; overflow-y: auto; max-height: 460px;
    }
    .history-item {
      padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .history-item:hover { background: var(--bg-hover); }
    .history-item.active { background: var(--bg-active); }
    .diff-box {
      border: 1px solid var(--border); border-radius: 8px; padding: 10px;
      overflow-y: auto; max-height: 460px; font-family: var(--font-mono); font-size: 12px;
      background: var(--bg-sub); white-space: pre-wrap; word-break: break-all;
    }
    .diff-add { background: rgba(22, 163, 74, 0.16); color: var(--success); display: block; padding: 1px 4px; }
    .diff-del { background: rgba(220, 38, 38, 0.14); color: var(--danger); display: block; padding: 1px 4px; }
    .diff-same { color: var(--text-muted); display: block; padding: 1px 4px; }

    /* Toast */
    .toast-wrap {
      position: fixed; bottom: 46px; right: 16px; z-index: 300;
      display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .toast {
      padding: 9px 14px; border-radius: 8px; background: var(--text); color: var(--bg);
      font-size: 13px; font-weight: 500; box-shadow: var(--shadow-md);
      animation: fadeUp 0.16s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive (Tablet 60% / Mobile 30% / PC 10%) */
    @media (max-width: 900px) {
      .sidebar {
        position: fixed; top: var(--topbar-h); bottom: 0; left: 0;
        margin-left: 0 !important; box-shadow: var(--shadow-md);
      }
      .sidebar.collapsed { transform: translateX(-100%); }
      .sidebar:not(.collapsed) + .sidebar-backdrop { display: block; }
      .editor-stage { flex-direction: column; }
      .preview-pane {
        width: 100%; min-width: 0; height: 45%;
        border-left: none; border-top: 1px solid var(--border);
      }
      .history-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .hide-xs { display: none !important; }
      .char-info-top, .char-info-section { padding: 14px 16px; }
      .cards-scroll { padding: 12px; }
      .lore-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<div class="app" id="app">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn btn-ghost btn-icon" id="btnToggleSidebar" title="사이드바 접기/열기"></button>
      <div class="dropdown-wrap">
        <button class="btn" id="btnWorkMenu"></button>
      </div>
      <div class="dropdown-wrap">
        <button class="btn" id="btnBranchMenu"></button>
      </div>
      <button class="btn btn-ghost" id="btnHistory" title="이전 작업내역"></button>
    </div>
    <div class="topbar-right">
      <button class="btn" id="btnEncryptToggle" title="작품 단위 암호화 저장 토글"></button>
      <button class="btn btn-ghost" id="btnSettings" title="GitHub 연동 및 설정"></button>
      <button class="btn btn-ghost btn-icon" id="btnTheme" title="라이트/다크 모드"></button>
      <button class="btn btn-primary" id="btnGitSave" title="GitHub에 저장"></button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="workspace">
    <aside class="sidebar" id="sidebar">

          <span id="searchIconSlot"></span>

        <div class="seg-control">
          <button class="seg-btn active" id="segCurrent">현재 작품</button>
          <button class="seg-btn" id="segAll">전체 작품</button>
        </div>
        <div class="sidebar-tags" id="sidebarTags"></div>
      </div>
      <div class="sidebar-actions">
        <button class="btn btn-ghost btn-sm" id="btnAddFolder"></button>
        <div style="display:flex; gap:2px;">

          <button class="btn btn-ghost btn-sm" id="btnExportTxt" title="작품 전체 TXT 내보내기"></button>
        </div>
      </div>
      <div class="tree" id="treeContainer"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="main" id="mainPane"></main>
  </div>

  <!-- Bottom Status Bar -->
  <footer class="statusbar">
    <div class="status-group" id="statusLeft"></div>
    <div class="status-group" id="statusRight"></div>
  </footer>
</div>

<!-- Dynamic Dropdown Container -->
<div id="dropdownRoot"></div>

<!-- Settings Modal -->
<div class="modal-backdrop" id="modalSettings">

      <button class="btn btn-ghost btn-icon" data-close-modal="modalSettings" id="closeSettingsIcon"></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>GitHub 아이디 (Owner)</label>
        <input class="form-input" id="cfgOwner" placeholder="예: my-github-id" />
      </div>
      <div class="form-row">
        <label>비공개 데이터 레포 이름 (Repository)</label>
        <input class="form-input" id="cfgRepo" placeholder="예: my-prompt-vault" />
      </div>
      <div class="form-row">
        <label>브랜치 (Branch)</label>
        <input class="form-input" id="cfgBranch" placeholder="main" />
      </div>
      <div class="form-row">
        <label>Fine-grained PAT 토큰 (Contents: Read & Write)</label>
        <input class="form-input" id="cfgToken" type="password" placeholder="github_pat_..." />
      </div>
      <div class="form-row">
        <label>암호화 마스터 비밀번호 (암호화 저장 ON 작품에 사용)</label>
        <input class="form-input" id="cfgPass" type="password" placeholder="암호화/복호화에 사용할 비밀번호" />

    </div>
    <div class="modal-foot">
      <button class="btn" id="btnPullAll">GitHub에서 전체 불러오기</button>

    </div>
  </div>
</div>

<!-- History & Diff Modal -->
<div class="modal-backdrop" id="modalHistory">
  <div class="modal modal-lg">
    <div class="modal-head">
      <span>이전 작업내역 & 버전 비교</span>

        </div>
      </div>
    </div>
  </div>
</div>

</div>

  const escHtml = (s = '') => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const fmtNum = (n) => Number(n || 0).toLocaleString('ko-KR');

  function estimateTokens(text = '') {
    if (!text) return 0;
    let hangul = 0, other = 0;
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      if ((c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3131 && c <= 0x318E)) hangul++;
      else other++;
    }
    return Math.ceil(hangul * 0.65 + other * 0.28);
  }

  function toast(msg) {
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.2s'; }, 2200);
    setTimeout(() => el.remove(), 2500);
  }

  async function copyText(text, label = '복사되었습니다.') {
    try {
      await navigator.clipboard.writeText(text);
      toast(label);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      toast(label);
    }
  }

  function downloadFile(filename, content, mime = 'text/plain;charset=utf-8') {
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 300);
  }

  /* ================= INDEXEDDB STORAGE (Works + Assets + Snapshots) ================= */
  const DB_NAME = 'PromptStudioVaultDB_v2';
  const DB_VER = 1;
  let dbInstance = null;

  function openDB() {
    if (dbInstance) return Promise.resolve(dbInstance);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('works')) db.createObjectStore('works', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('assets')) db.createObjectStore('assets', { keyPath: 'path' });
        if (!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots', { keyPath: 'id' });
      };
      req.onsuccess = () => { dbInstance = req.result; resolve(dbInstance); };
      req.onerror = () => reject(req.error);
    });
  }

  async function idbGetAll(storeName) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbGet(storeName, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbPut(storeName, val) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(val);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function idbDel(storeName, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  /* ================= WEB CRYPTO (AES-GCM + PBKDF2) ================= */
  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' },
      keyMat,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  const b64FromBytes = (bytes) => {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  };
  const bytesFromB64 = (b64) => {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };

  async function encryptObj(obj, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const plain = new TextEncoder().encode(JSON.stringify(obj));
    const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain));
    return {
      __encrypted: true,
      v: 1,
      id: obj.id,
      titleHint: 'Encrypted Work',
      updatedAt: obj.updatedAt || Date.now(),
      salt: b64FromBytes(salt),
      iv: b64FromBytes(iv),
      data: b64FromBytes(cipher)
    };
  }

  async function decryptObj(payload, password) {
    const salt = bytesFromB64(payload.salt);
    const iv = bytesFromB64(payload.iv);
    const data = bytesFromB64(payload.data);
    const key = await deriveKey(password, salt);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return JSON.parse(new TextDecoder().decode(plainBuf));
  }

  /* ================= GITHUB PRIVATE REPO API ================= */
  function utf8ToB64(str) {
    return b64FromBytes(new TextEncoder().encode(str));
  }
  function b64ToUtf8(b64) {
    return new TextDecoder().decode(bytesFromB64(b64.replace(/\n/g, '')));
  }

  async function ghRequest(path, options = {}) {
    const { owner, repo, token } = state.config;
    if (!owner || !repo || !token) throw new Error('GitHub 연동 설정을 먼저 입력해주세요.');
    const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${path}`;
    const res = await fetch(url, {
      ...options,
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        ...(options.headers || {})
      }
    });
    if (!res.ok) {
      let msg = `GitHub API 오류 (${res.status})`;
      try { const j = await res.json(); if (j.message) msg += `: ${j.message}`; } catch {}
      throw new Error(msg);
    }
    return res.json();
  }

  async function ghGetFile(filePath, ref) {
    const q = ref ? `?ref=${encodeURIComponent(ref)}` : '';
    try {
      return await ghRequest(`contents/${filePath}${q}`);
    } catch (e) {
      if (String(e.message).includes('(404)')) return null;
      throw e;
    }
  }

  async function ghPutFile(filePath, base64Content, message) {
    const branch = state.config.branch || 'main';
    const existing = await ghGetFile(filePath, branch);
    const body = { message, content: base64Content, branch };
    if (existing && existing.sha) body.sha = existing.sha;
    return ghRequest(`contents/${filePath}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  function findFolderAndItem(work, branch, itemId) {
    if (!branch) return { folder: null, item: null };
    for (const f of branch.folders) {
      const it = f.items.find(i => i.id === itemId);
      if (it) return { folder: f, item: it };
    }
    return { folder: null, item: null };
  }

  /* ================= STATS (EXCLUDING CODE FOLDERS) ================= */
  function isCodeFolderOrItem(folder, item) {
    if (folder && folder.kind === 'code') return true;
    if (item && (item.type === 'html' || item.type === 'jsx')) return true;
    return false;
  }

  function calcWorkPromptStats(work, branch = getActiveBranch(work)) {
    let chars = 0, tokens = 0, counted = 0, excluded = 0;
    if (!branch) return { chars, tokens, counted, excluded };
    for (const f of branch.folders) {
      for (const it of f.items) {
        if (isCodeFolderOrItem(f, it)) {
          excluded++;
          continue;
        }
        const txt = it.content || '';
        chars += txt.length;
        tokens += estimateTokens(txt);
        counted++;
      }
    }
    return { chars, tokens, counted, excluded };
  }

  async function saveLocalSnapshot(work, note = '로컬 자동 저장') {
    const snaps = (await idbGetAll('snapshots')).filter(s => s.workId === work.id)
      .sort((a, b) => b.createdAt - a.createdAt);
    if (snaps[0] && JSON.stringify(snaps[0].data) === JSON.stringify(work)) return;
    await idbPut('snapshots', {
      id: uid('snap'),
      workId: work.id,
      note,
      createdAt: Date.now(),
      data: JSON.parse(JSON.stringify(work))
    });
    // Keep latest 15 snapshots per work
    for (const old of snaps.slice(14)) await idbDel('snapshots', old.id);
  }

  /* ================= CODEMIRROR CUSTOM PROMPT-MARKDOWN MODE ================= */
  if (window.CodeMirror) {
    CodeMirror.defineMode('prompt-markdown', () => ({
      startState: () => ({ header: 0, bold: false, italic: false }),
      token(stream, st) {
        if (stream.sol()) {
          st.header = 0;
          st.bold = false;
          st.italic = false;
          if (stream.match(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/)) {
            return 'pm-hr';
          }
          const hm = stream.match(/^(#{1,3})(?=\s)/);
          if (hm) {
            st.header = hm[1].length;
            return `pm-syntax pm-h${st.header}`;
          }
          if (stream.match(/^\s*([-*+]|\d+\.)(?=\s)/)) {
            return 'pm-list';
          }
        }

        const hCls = st.header ? ` pm-h${st.header}` : '';
        const bCls = st.bold ? ' pm-bold' : '';
        const iCls = st.italic ? ' pm-italic' : '';
        const base = (hCls + bCls + iCls).trim();

        // {{user}}, {{char}}, {{...}}
        if (stream.match(/^\{\{[^}\n]+\}\}/)) {
          return ('pm-var ' + hCls).trim();
        }
        // Inline code `...`
        if (stream.match(/^`[^`\n]+`/)) {
          return ('pm-code ' + hCls).trim();
        }
        // Angle tags <System ...>
        if (stream.match(/^<\/?[A-Za-z][^>\n]*>/)) {
          return ('pm-tag ' + hCls).trim();
        }
        // Square brackets [필수 규칙], [시스템]
        if (stream.match(/^\[[^\]\n]+\]/)) {
          return ('pm-bracket ' + base).trim();
        }
        // Bold **...**
        if (stream.peek() === '*' && stream.match(/^\*\*/)) {
          if (st.bold) {
            st.bold = false;
            return ('pm-syntax ' + hCls).trim();
          }
          const rest = stream.string.slice(stream.pos);
          if (rest.includes('**')) {
            st.bold = true;
            return ('pm-syntax ' + hCls).trim();
          }
          return base || null;
        }
        // Italic *...*
        if (stream.peek() === '*' && !stream.match(/^\*\*/, false)) {
          stream.next();
          if (st.italic) {
            st.italic = false;
            return ('pm-syntax ' + hCls).trim();
          }
          const rest = stream.string.slice(stream.pos);
          if (/^[^*\n]+\*/.test(rest)) {
            st.italic = true;
            return ('pm-syntax ' + hCls).trim();
          }
          return base || null;
        }

        stream.next();
        while (!stream.eol()) {
          const ch = stream.peek();
          if (ch === '{' || ch === '`' || ch === '<' || ch === '[' || ch === '*') break;
          stream.next();
        }
        return base || null;
      }
    }));
  }

  /* ================= HTML MARKDOWN EMPHASIS RENDERER (For Cards) ================= */
  function highlightInlineMd(escapedLine) {
    let s = escapedLine;
    // Inline code
    s = s.replace(/`([^`]+)`/g, '<span class="md-code">`$1`</span>');
    // {{user}}, {{char}}, etc.
    s = s.replace(/(\{\{[^}]+\}\})/g, '<span class="md-var">$1</span>');
    // Angle tags (already escaped as &lt;...&gt;)
    s = s.replace(/(&lt;\/?[A-Za-z][^&]*?&gt;)/g, '<span class="md-tag">$1</span>');
    // Bold **...**
    s = s.replace(/\*\*([^*]+)\*\*/g, '<span class="md-syn">**</span><strong class="md-bold">$1</strong><span class="md-syn">**</span>');
    // Italic *...*
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<span class="md-syn">*</span><em class="md-italic">$2</em><span class="md-syn">*</span>');
    // Brackets [...]
    s = s.replace(/(\[[^\]<]+\])/g, '<span class="md-bracket">$1</span>');
    return s;
  }

  function renderMarkdownHighlightHtml(text = '') {
    if (!text.trim()) {
      return '<div style="color:var(--text-muted);font-size:12.5px;">내용이 비어 있습니다.</div>';
    }
    return text.split('\n').map(rawLine => {
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(rawLine)) {
        return '<div class="md-hr"></div>';
      }
      if (!rawLine.trim()) return '<div class="md-blank"></div>';
      const esc = escHtml(rawLine);
      const hm = esc.match(/^(#{1,3})(\s+)(.*)$/);
      if (hm) {
        const lv = hm[1].length;
        return `<div class="md-h${lv}"><span class="md-syn">${hm[1]}</span>${hm[2]}${highlightInlineMd(hm[3])}</div>`;
      }
      const lm = esc.match(/^(\s*)([-*+]|\d+\.)(\s+)(.*)$/);
      if (lm) {
        return `<div class="md-line">${lm[1]}<span class="md-list">${lm[2]}</span>${lm[3]}${highlightInlineMd(lm[4])}</div>`;
      }
      return `<div class="md-line">${highlightInlineMd(esc)}</div>`;
    }).join('');
  }

  async function compressImageFile(file, maxSize = 840) {

      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxSize || height > maxSize) {
            const r = Math.min(maxSize / width, maxSize / height);
            width = Math.round(width * r);
            height = Math.round(height * r);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/webp', 0.86));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function getAssetDataUrl(assetPath) {
    if (!assetPath) return '';
    if (state.assetCache.has(assetPath)) return state.assetCache.get(assetPath);
    const local = await idbGet('assets', assetPath);
    if (local && local.dataUrl) {
      state.assetCache.set(assetPath, local.dataUrl);
      return local.dataUrl;
    }
    // Try fetching from GitHub if connected
    if (state.config.owner && state.config.repo && state.config.token) {
      try {
        const file = await ghGetFile(assetPath, state.config.branch || 'main');
        if (file && file.content) {
          const mime = assetPath.endsWith('.png') ? 'image/png' : assetPath.endsWith('.jpg') ? 'image/jpeg' : 'image/webp';
          const dataUrl = `data:${mime};base64,${file.content.replace(/\n/g, '')}`;
          await idbPut('assets', { path: assetPath, dataUrl, dirty: false, updatedAt: Date.now() });
          state.assetCache.set(assetPath, dataUrl);
          return dataUrl;
        }
      } catch {}
    }
    return '';
  }

  async function saveProfileAsset(work, file) {
    const dataUrl = await compressImageFile(file);
    const assetPath = `assets/${work.id}_profile.webp`;
    await idbPut('assets', { path: assetPath, dataUrl, dirty: true, updatedAt: Date.now() });
    state.assetCache.set(assetPath, dataUrl);
    work.profile = { assetPath, externalUrl: '' };
    scheduleWorkSave(work);
    renderMain();
    toast('프로필 이미지가 에셋 폴더에 저장되었습니다.');
  }

  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed', state.sidebarCollapsed);

    document.getElementById('searchIconSlot').innerHTML = ICONS.search;
    document.getElementById('btnAddFolder').innerHTML = `${ICONS.plus}<span>폴더 추가</span>`;
    document.getElementById('btnExportCsv').innerHTML = `${ICONS.table}<span>CSV</span>`;
    document.getElementById('btnExportTxt').innerHTML = `${ICONS.download}<span>TXT</span>`;
    document.getElementById('segCurrent').classList.toggle('active', state.searchScope === 'current');
    document.getElementById('segAll').classList.toggle('active', state.searchScope === 'all');

    const work = getActiveWork();
    const branch = getActiveBranch(work);

    // Tags
    const tagBox = document.getElementById('sidebarTags');
    if (work && work.tags && work.tags.length) {
      tagBox.innerHTML = work.tags.map(t => `<span class="tag-chip">#${escHtml(t)}</span>`).join('');
    } else {
      tagBox.innerHTML = '<span class="tag-chip" style="color:var(--text-muted);">#태그 없음</span>';
    }

    const container = document.getElementById('treeContainer');

    // Search Mode
    if (state.searchQuery.trim()) {
      const q = state.searchQuery.trim().toLowerCase();
      const hits = [];
      const targetWorks = state.searchScope === 'all' ? state.works : (work ? [work] : []);
      for (const w of targetWorks) {
        const br = getActiveBranch(w);
        if (!br) continue;
        for (const f of br.folders) {
          for (const it of f.items) {
            const hay = `${it.title}\n${it.keywords || ''}\n${it.content || ''}`.toLowerCase();
            const idx = hay.indexOf(q);
            if (idx !== -1) {
              const raw = `${it.keywords ? `[${it.keywords}] ` : ''}${it.content || ''}`;
              const pos = raw.toLowerCase().indexOf(q);
              const start = Math.max(0, pos - 24);
              const snippet = raw.slice(start, start + 110);
              hits.push({ work: w, folder: f, item: it, snippet });
            }
          }
        }
      }
      if (!hits.length) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;">검색 결과가 없습니다.</div>';
        return;
      }
      container.innerHTML = `<div class="search-results">${hits.map(h => `
        <div class="search-hit" data-hit-work="${h.work.id}" data-hit-folder="${h.folder.id}" data-hit-item="${h.item.id}">
          <div class="search-hit-head">${escHtml(h.item.title)}</div>
          <div class="search-hit-sub">${escHtml(h.work.title || '제목 없음')} · ${escHtml(h.folder.name)}</div>
          <div class="search-hit-snippet">${escHtml(h.snippet || '(제목 일치)')}</div>
        </div>`).join('')}</div>`;
      container.querySelectorAll('.search-hit').forEach(el => {
        el.onclick = () => {
          state.activeWorkId = el.dataset.hitWork;
          state.activeFolderId = el.dataset.hitFolder;
          state.activeItemId = el.dataset.hitItem;
          state.viewMode = 'editor';
          if (window.innerWidth <= 900) state.sidebarCollapsed = true;
          renderAll();
        };
      });
      return;
    }

    if (!work || !branch) {
      container.innerHTML = '';
      return;
    }

    // Pinned Character Info Page (1 fixed per work)
    let html = `
      <div class="tree-pinned">
        <div class="tree-item ${state.viewMode === 'charInfo' ? 'active' : ''}" id="navCharInfo">
          ${ICONS.user}
          <span class="tree-item-title">캐릭터 정보</span>
          <span class="tree-item-meta">고정</span>
        </div>
      </div>
    `;

    // Folders & Items
    for (const f of branch.folders) {
      const fIcon = f.kind === 'lorebook' ? ICONS.book : (f.kind === 'code' ? ICONS.code : ICONS.folder);
      const isCardActive = (state.viewMode === 'loreCards' || state.viewMode === 'textCards') && state.activeFolderId === f.id;
      const cardBtnHtml = f.kind === 'lorebook'
        ? `<button class="tree-mini-btn ${isCardActive ? 'active' : ''}" data-folder-cards="${f.id}" data-card-type="loreCards" title="로어북 그리드 카드 보기">${ICONS.grid}</button>`
        : (f.kind === 'text'
          ? `<button class="tree-mini-btn ${isCardActive ? 'active' : ''}" data-folder-cards="${f.id}" data-card-type="textCards" title="텍스트 한 줄 카드 보기">${ICONS.rows}</button>`
          : '');

      html += `
        <div class="tree-folder">
          <div class="tree-folder-row ${isCardActive ? 'active-view' : ''}" data-folder-toggle="${f.id}">
            <span class="chevron ${f.collapsed ? 'closed' : ''}">${ICONS.chevDown}</span>
            ${fIcon}
            <span class="tree-folder-name">${escHtml(f.name)}</span>
            ${f.kind === 'code' ? '<span class="code-badge">제외</span>' : ''}
            <div class="tree-folder-actions">
              ${cardBtnHtml}
              <button class="tree-mini-btn" data-folder-add="${f.id}" title="항목 추가">${ICONS.plus}</button>
              <button class="tree-mini-btn" data-folder-menu="${f.id}" title="폴더 메뉴">${ICONS.more}</button>
            </div>
          </div>
          ${f.collapsed ? '' : `<div class="tree-items">
            ${f.items.map(it => {
              const active = state.viewMode === 'editor' && state.activeItemId === it.id;
              const itIcon = it.type === 'lorebook' ? ICONS.book : ((it.type === 'html' || it.type === 'jsx') ? ICONS.code : ICONS.file);
              const len = (it.content || '').length;
              return `
                <div class="tree-item ${active ? 'active' : ''}" data-item-select="${it.id}" data-folder-id="${f.id}">
                  ${itIcon}
                  <span class="tree-item-title">${escHtml(it.title)}</span>
                  ${len ? `<span class="tree-item-meta">${fmtNum(len)}</span>` : ''}
                  <button class="tree-item-more" data-item-menu="${it.id}" data-folder-id="${f.id}" title="항목 메뉴">${ICONS.more}</button>
                </div>`;
            }).join('')}
          </div>`}
        </div>
      `;
    }

    container.innerHTML = html;

    // Bind tree events
    document.getElementById('navCharInfo').onclick = () => {
      state.viewMode = 'charInfo';
      if (window.innerWidth <= 900) state.sidebarCollapsed = true;
      renderAll();
    };

    container.querySelectorAll('[data-folder-toggle]').forEach(el => {
      el.onclick = (e) => {
        if (e.target.closest('button')) return;
        const f = branch.folders.find(x => x.id === el.dataset.folderToggle);
        if (f) { f.collapsed = !f.collapsed; scheduleWorkSave(work); renderSidebar(); }
      };
    });

    container.querySelectorAll('[data-folder-cards]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        state.activeFolderId = btn.dataset.folderCards;
        state.viewMode = btn.dataset.cardType;
        state.editingCardIds.clear();
        if (window.innerWidth <= 900) state.sidebarCollapsed = true;
        renderAll();
      };
    });

    container.querySelectorAll('[data-folder-add]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const f = branch.folders.find(x => x.id === btn.dataset.folderAdd);
        if (!f) return;
        const defaultType = f.kind === 'lorebook' ? 'lorebook' : (f.kind === 'code' ? (f.name.toLowerCase().includes('jsx') ? 'jsx' : 'html') : 'text');
        const newItem = { id: uid('itm'), title: `새 항목 ${f.items.length + 1}`, type: defaultType, keywords: '', content: '' };
        f.items.push(newItem);
        f.collapsed = false;
        state.activeFolderId = f.id;
        state.activeItemId = newItem.id;
        state.viewMode = 'editor';
        scheduleWorkSave(work);
        renderAll();
      };
    });

    container.querySelectorAll('[data-folder-menu]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        openFolderMenu(btn, branch.folders.find(x => x.id === btn.dataset.folderMenu));
      };
    });

    container.querySelectorAll('[data-item-select]').forEach(el => {
      el.onclick = (e) => {
        if (e.target.closest('button')) return;
        state.activeFolderId = el.dataset.folderId;
        state.activeItemId = el.dataset.itemSelect;
        state.viewMode = 'editor';
        if (window.innerWidth <= 900) state.sidebarCollapsed = true;
        renderAll();
      };
    });

    container.querySelectorAll('[data-item-menu]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const f = branch.folders.find(x => x.id === btn.dataset.folderId);
        const it = f?.items.find(x => x.id === btn.dataset.itemMenu);
        if (f && it) openItemMenu(btn, f, it);
      };
    });
  }

  /* ================= MAIN VIEW DISPATCHER ================= */
  function destroyCm() {
    if (cmEditor) { cmEditor = null; }
  }

  function renderMain() {
    destroyCm();
    const work = getActiveWork();
    const branch = getActiveBranch(work);
    const main = document.getElementById('mainPane');
    if (!work || !branch) {
      main.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">작품이 없습니다.</div>';
      return;
    }

    if (state.viewMode === 'charInfo') {
      renderCharInfoView(main, work);
    } else if (state.viewMode === 'loreCards') {
      const folder = branch.folders.find(f => f.id === state.activeFolderId);
      if (!folder) { state.viewMode = 'charInfo'; renderCharInfoView(main, work); }
      else renderLoreCardsView(main, work, folder);
    } else if (state.viewMode === 'textCards') {
      const folder = branch.folders.find(f => f.id === state.activeFolderId);
      if (!folder) { state.viewMode = 'charInfo'; renderCharInfoView(main, work); }
      else renderTextCardsView(main, work, folder);
    } else {
      const { folder, item } = findFolderAndItem(work, branch, state.activeItemId);
      if (!item) { state.viewMode = 'charInfo'; renderCharInfoView(main, work); }
      else renderItemEditorView(main, work, folder, item);
    }
    renderStatusbar();
  }

  function bindCardEvents(container, work, folder, rerender) {
    container.querySelectorAll('[data-card-copy]').forEach(b => {
      b.onclick = () => {
        const it = folder.items.find(x => x.id === b.dataset.cardCopy);
        if (it) copyText(it.content || '', `'${it.title}' 복사 완료`);
      };
    });
    container.querySelectorAll('[data-card-edit]').forEach(b => {
      b.onclick = () => { state.editingCardIds.add(b.dataset.cardEdit); rerender(); };
    });
    container.querySelectorAll('[data-card-done]').forEach(b => {
      b.onclick = () => {
        state.editingCardIds.delete(b.dataset.cardDone);
        renderSidebar();
        renderStatusbar();
        rerender();
      };
    });
    container.querySelectorAll('[data-card-open]').forEach(b => {
      b.onclick = () => {
        state.activeFolderId = folder.id;
        state.activeItemId = b.dataset.cardOpen;
        state.viewMode = 'editor';
        renderAll();
      };
    });
    container.querySelectorAll('[data-card-del]').forEach(b => {
      b.onclick = () => {
        const it = folder.items.find(x => x.id === b.dataset.cardDel);
        if (!it || !confirm(`'${it.title}' 항목을 삭제할까요?`)) return;
        folder.items = folder.items.filter(x => x.id !== it.id);
        scheduleWorkSave(work);
        renderSidebar();
        renderStatusbar();
        rerender();
      };
    });
    container.querySelectorAll('[data-edit-title]').forEach(inp => {
      inp.oninput = () => {
        const it = folder.items.find(x => x.id === inp.dataset.editTitle);
        if (it) { it.title = inp.value; scheduleWorkSave(work); }
      };
    });
    container.querySelectorAll('[data-edit-kw]').forEach(inp => {
      inp.oninput = () => {
        const it = folder.items.find(x => x.id === inp.dataset.editKw);
        if (it) { it.keywords = inp.value; scheduleWorkSave(work); }
      };
    });
    container.querySelectorAll('[data-edit-body]').forEach(ta => {
      ta.oninput = () => {
        const it = folder.items.find(x => x.id === ta.dataset.editBody);
        if (it) { it.content = ta.value; scheduleWorkSave(work); renderStatusbar(); }
      };
    });
  }

    document.getElementById('btnExportItemTxt').onclick = () => {

    }

    // Mount CodeMirror 5 (or fallback textarea)
    const mount = document.getElementById('editorMount');
    if (window.CodeMirror) {
      const mode = item.type === 'html' ? 'htmlmixed' : (item.type === 'jsx' ? 'jsx' : 'prompt-markdown');
      cmEditor = CodeMirror(mount, {

        }

    if (isCode && state.showPreview) updateCodePreview(item);

  function updateCodePreview(item) {
    const iframe = document.getElementById('codePreviewFrame');
    if (!iframe) return;
    const code = item.content || '';
    if (item.type === 'html') {
      iframe.srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}</style></head><body>${code}</body></html>`;
      return;
    }
    // JSX Live Rendering with React 18 + Babel Standalone
    const safeCode = JSON.stringify(code);
    iframe.srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8">
      <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"><\/script>
      <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"><\/script>
      <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"><\/script>
      <style>body{margin:14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;} .err{color:#dc2626;background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;}</style>
    </head><body><div id="root"></div><script>
      try {
        let src = ${safeCode}.trim();
        let hasExportDefault = /export\\s+default\\s+/.test(src);
        src = src.replace(/import\\s+.*?from\\s+['"][^'"]+['"];?/g, '');
        if (hasExportDefault) {
          src = src.replace(/export\\s+default\\s+function\\s+([A-Za-z0-9_]+)/, 'function $1');
          const m = src.match(/function\\s+([A-Za-z0-9_]+)/);
          if (src.includes('export default')) {
            src = src.replace(/export\\s+default\\s+/, 'const __DefaultExport__ = ');
            src += '\\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(__DefaultExport__));';
          } else if (m) {
            src += '\\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(' + m[1] + '));';
          }
        } else if (src.startsWith('<')) {
          src = 'ReactDOM.createRoot(document.getElementById("root")).render(' + src + ');';
        } else {
          src += '\\nif(typeof App!=="undefined") ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));';
        }
        const compiled = Babel.transform(src, { presets: ['react'] }).code;
        new Function('React', 'ReactDOM', compiled)(React, ReactDOM);
      } catch (err) {
        document.getElementById('root').innerHTML = '<div class="err">' + String(err.message || err).replace(/</g,'&lt;') + '</div>';
      }
    <\/script></body></html>`;
  }

  /* ================= STATUS BAR (Code Folders Excluded from Work Total) ================= */
  function renderStatusbar() {
    const work = getActiveWork();
    const branch = getActiveBranch(work);
    const left = document.getElementById('statusLeft');
    const right = document.getElementById('statusRight');
    if (!work || !branch) { left.innerHTML = ''; right.innerHTML = ''; return; }

    if (state.viewMode === 'charInfo') {
      left.innerHTML = `<span>캐릭터 정보 편집 중</span>`;
    } else if (state.viewMode === 'loreCards' || state.viewMode === 'textCards') {
      const f = branch.folders.find(x => x.id === state.activeFolderId);
      const fChars = (f?.items || []).reduce((a, b) => a + (b.content || '').length, 0);
      const fTok = (f?.items || []).reduce((a, b) => a + estimateTokens(b.content || ''), 0);
      left.innerHTML = `<span>${escHtml(f?.name || '')}: ${fmtNum(fChars)}자 · ${fmtNum(fTok)} 토큰</span>`;
    } else {
      const { folder, item } = findFolderAndItem(work, branch, state.activeItemId);
      const c = (item?.content || '').length;
      const t = estimateTokens(item?.content || '');
      const excluded = isCodeFolderOrItem(folder, item);
      left.innerHTML = `<span>현재 항목: ${fmtNum(c)}자 · ${fmtNum(t)} 토큰${excluded ? ' (합계 제외)' : ''}</span>`;
    }

    const total = calcWorkPromptStats(work, branch);
    right.innerHTML = `
      <span>프롬프트 합계: <strong>${fmtNum(total.chars)}자</strong> · <strong>${fmtNum(total.tokens)} 토큰</strong></span>
      <span class="status-pill hide-xs">코드 폴더 제외</span>
    `;
  }

  /* ================= DROPDOWNS & MENUS ================= */
  function closeDropdown() {
    document.getElementById('dropdownRoot').innerHTML = '';
  }

  function showDropdown(anchorEl, html) {
    closeDropdown();
    const root = document.getElementById('dropdownRoot');
    const menu = document.createElement('div');
    menu.className = 'dropdown-menu';
    menu.innerHTML = html;
    root.appendChild(menu);
    const r = anchorEl.getBoundingClientRect();
    let left = r.left;
    if (left + 250 > window.innerWidth) left = Math.max(8, window.innerWidth - 258);
    menu.style.left = `${left}px`;
    menu.style.top = `${Math.min(r.bottom + 5, window.innerHeight - 240)}px`;
    return menu;
  }

  function openWorkMenu(anchor) {
    const html = `
      <div class="dd-label">내 작품 목록 (${state.works.length})</div>
      ${state.works.map(w => `
        <button class="dd-item ${w.id === state.activeWorkId ? 'active' : ''}" data-pick-work="${w.id}">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(w.title || '제목 없음')}</span>
          ${w.encrypted ? ICONS.lock : ''}
        </button>`).join('')}
      <div class="dd-sep"></div>
      <button class="dd-item" id="ddNewWork" style="color:var(--accent);font-weight:600;">
        <span>새 작품 만들기</span>${ICONS.plus}
      </button>
      <button class="dd-item" id="ddDeleteWork" style="color:var(--danger);">
        <span>현재 작품 삭제</span>${ICONS.trash}
      </button>
    `;
    const menu = showDropdown(anchor, html);
    menu.querySelectorAll('[data-pick-work]').forEach(b => {
      b.onclick = () => {
        state.activeWorkId = b.dataset.pickWork;
        state.viewMode = 'charInfo';
        closeDropdown();
        renderAll();
      };
    });
    // Requirement 1: Clicking "새 작품 만들기" creates new work immediately -> navigates to 캐릭터 정보 page
    menu.querySelector('#ddNewWork').onclick = async () => {
      closeDropdown();
      const nw = createWorkObject({ title: '', summary: '', tags: [], withSample: false });
      nw._justCreated = true;
      state.works.unshift(nw);
      state.activeWorkId = nw.id;
      state.viewMode = 'charInfo';
      await idbPut('works', nw);
      renderAll();
      toast('새 작품이 생성되었습니다. 캐릭터 정보를 입력해 주세요.');
    };
    menu.querySelector('#ddDeleteWork').onclick = async () => {
      closeDropdown();
      const w = getActiveWork();
      if (!w) return;
      if (!confirm(`'${w.title || '제목 없음'}' 작품을 로컬에서 삭제할까요?`)) return;
      await idbDel('works', w.id);
      if (w.profile?.assetPath) await idbDel('assets', w.profile.assetPath);
      state.works = state.works.filter(x => x.id !== w.id);
      if (!state.works.length) {
        const fresh = createWorkObject({ title: '새 작품', withSample: false });
        state.works.push(fresh);
        await idbPut('works', fresh);
      }
      state.activeWorkId = state.works[0].id;
      state.viewMode = 'charInfo';
      renderAll();
      toast('작품을 삭제했습니다.');
    };
  }

        scheduleWorkSave(work);

      const cur = getActiveBranch(work);

        { id: 'name', label: '새 이름', value: cur.name }
      ], (vals) => {
        if (!vals.name.trim()) return;

        renderTopbar();

      work.branches = work.branches.filter(b => b.id !== cur.id);
      work.activeBranchId = work.branches[0].id;
      state.viewMode = 'charInfo';
      scheduleWorkSave(work);
      renderAll();

<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>프롬프트 아카이브 스튜디오</title>

  <!-- CodeMirror 5 for Markdown Emphasis + HTML/JSX Highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/jsx/jsx.min.js"></script>

  <style>
    :root {
      --bg-app: #ffffff;
      --bg-sidebar: #f7f8fa;
      --bg-subtle: #f3f4f6;
      --bg-hover: #eceef2;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text-main: #1f2937;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --text-faint: #9ca3af;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --accent-text: #1d4ed8;
      --accent-border: rgba(37, 99, 235, 0.28);
      --accent-ring: rgba(37, 99, 235, 0.16);
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --emerald: #10b981;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --nsfw-red: #e53935;
      --diff-add-bg: #ecfdf5;
      --diff-add-text: #065f46;
      --diff-del-bg: #fef2f2;
      --diff-del-text: #991b1b;
      --seg-0: #2b303a;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.1);
      --font-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sidebar-w: 276px;
      --topbar-h: 48px;
      --statusbar-h: 32px;
    }

    [data-theme="dark"] {
      --bg-app: #131518;
      --bg-sidebar: #1a1d21;
      --bg-subtle: #20242a;
      --bg-hover: #262b33;
      --border: #2a2f37;
      --border-strong: #3a414c;
      --text-main: #e5e7eb;
      --text-secondary: #cbd5e1;
      --text-muted: #9ca3af;
      --text-faint: #6b7280;
      --amber: #f59e0b;
      --amber-soft: #2e2412;
      --danger: #f87171;
      --danger-soft: #31191a;
      --diff-add-bg: #112a1f;
      --diff-add-text: #86efac;
      --diff-del-bg: #2e1618;
      --diff-del-text: #fca5a5;
      --seg-0: #cbd5e1;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      font-family: var(--font-sans); background: var(--bg-app); color: var(--text-main);
      font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
    button { background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .hidden { display: none !important; }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

    .search-input:focus, .lore-input:focus, .field-input:focus,
    .card-edit-textarea:focus, .form-input:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-ring);
    }

    /* Core Layout */
    .app { display: flex; flex-direction: column; width: 100%; height: 100dvh; overflow: hidden; background: var(--bg-app); }

    .topbar {
      height: var(--topbar-h); min-height: var(--topbar-h);
      border-bottom: 1px solid var(--border); background: var(--bg-app);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px; gap: 8px; z-index: 30;
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .topbar-left { flex: 1; overflow-x: auto; scrollbar-width: none; }
    .topbar-left::-webkit-scrollbar { display: none; }
    .brand-title {
      display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px;
      color: var(--text-main); padding: 0 6px; white-space: nowrap;
    }

    /* Buttons & Controls */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 32px; padding: 0 10px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--bg-app); color: var(--text-main);
      font-size: 13px; font-weight: 500; white-space: nowrap; flex-shrink: 0;
      transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .btn:active { transform: translateY(0.5px); }
    .btn-ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-hover); border-color: transparent; color: var(--text-main); }
    .btn-icon { width: 34px; height: 34px; padding: 0; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #ffffff; }
    .btn-encrypt-on { background: rgba(229, 57, 53, 0.12); border-color: rgba(229, 57, 53, 0.35); color: var(--nsfw-red); }
    .btn-encrypt-on:hover { background: rgba(229, 57, 53, 0.18); border-color: var(--nsfw-red); }
    .btn-sm { height: 28px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
    .btn-xs { height: 24px; padding: 0 6px; font-size: 11.5px; border-radius: 5px; }

    .pill-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--text-faint); display: inline-block; flex-shrink: 0; }
    .pill-dot.connected { background: var(--emerald); }
    .pill-dot.dirty { background: var(--amber); }

    .work-thumb-mini {
      width: 20px; height: 20px; border-radius: 5px; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--bg-subtle); border: 1px solid var(--border); color: var(--text-muted); flex-shrink: 0;
    }
    .work-thumb-mini img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Workspace & Sidebar */
    .workspace { flex: 1; display: flex; min-height: 0; position: relative; overflow: hidden; }

    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      border-right: 1px solid var(--border); background: var(--bg-sidebar);
      display: flex; flex-direction: column; overflow: hidden; z-index: 25;
      transition: width 0.2s ease, min-width 0.2s ease, transform 0.22s ease;
    }
    .sidebar.collapsed { width: 0; min-width: 0; border-right-width: 0; }
    .sidebar-backdrop {
      display: none; position: fixed; inset: var(--topbar-h) 0 0 0;
      background: rgba(15, 23, 42, 0.42); z-index: 24; opacity: 0; transition: opacity 0.2s ease;
    }

    .sidebar-head { padding: 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .search-box { position: relative; display: flex; align-items: center; }
    .search-icon-slot { position: absolute; left: 9px; color: var(--text-faint); display: inline-flex; pointer-events: none; }
    .search-input {
      width: 100%; height: 29px; padding: 0 26px 0 30px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--bg-app); color: var(--text-main);
      font-size: 12.5px; outline: none; transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .search-clear-btn {
      position: absolute; right: 4px; width: 22px; height: 22px; border-radius: 5px; color: var(--text-muted);
    }
    .search-clear-btn:hover { background: var(--bg-hover); color: var(--text-main); }

    .seg-control {
      display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
      background: var(--bg-subtle); padding: 2px; border-radius: 7px; border: 1px solid var(--border);
    }
    .seg-btn { height: 25px; border-radius: 5px; font-size: 12px; color: var(--text-muted); font-weight: 500; transition: background 0.14s ease, color 0.14s ease; }
    .seg-btn.active { background: var(--bg-app); color: var(--text-main); box-shadow: var(--shadow-sm); }

    .sidebar-tags-bar {
      padding: 7px 10px; border-bottom: 1px solid var(--border); background: var(--bg-app);
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .sidebar-tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; flex: 1; }
    .tag-chip { font-size: 11px; padding: 2px 6px; border-radius: 5px; background: var(--bg-subtle); color: var(--text-muted); }

    .sidebar-actions {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; border-bottom: 1px solid var(--border); gap: 4px;
    }

    /* Sidebar Tree + Drag & Drop */
    .tree { flex: 1; overflow-y: auto; padding: 6px 8px 20px; }
    .tree-pinned { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .tree-folder { margin-bottom: 3px; border-radius: 7px; }
    .tree-folder-row {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 7px;
      color: var(--text-main); font-weight: 600; font-size: 13px; cursor: pointer; user-select: none;
      border: 1.5px solid transparent; transition: background 0.12s ease, border-color 0.12s ease;
    }
    .tree-folder-row:hover { background: var(--bg-hover); }
    .tree-folder-row.active-view { background: var(--accent-soft); color: var(--accent-text); }
    .tree-folder-name, .tree-item-title, .card-title, .search-hit-sub {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tree-folder-actions { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity 0.12s ease; }
    .tree-folder-row:hover .tree-folder-actions, .tree-folder-row.active-view .tree-folder-actions { opacity: 1; }

    .tree-mini-btn { width: 24px; height: 24px; border-radius: 5px; color: var(--text-muted); flex-shrink: 0; }
    .tree-mini-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .tree-mini-btn.active { background: var(--bg-app); color: var(--accent-text); box-shadow: var(--shadow-sm); }

    .tree-chevron { color: var(--text-faint); display: inline-flex; flex-shrink: 0; }
    .tree-folder-icon { color: var(--text-muted); display: inline-flex; flex-shrink: 0; }
    .tree-folder-row.active-view .tree-folder-icon { color: var(--accent-text); }

    .tree-items { margin-top: 1px; }
    .tree-item {
      display: flex; align-items: center; gap: 7px; padding: 6px 8px 6px 26px; border-radius: 7px;
      color: var(--text-secondary); font-size: 13px; cursor: pointer; user-select: none; margin-top: 1px;
      border-top: 2px solid transparent; border-bottom: 2px solid transparent;
      transition: background 0.12s ease;
    }
    .tree-item.pinned-item { padding-left: 10px; }
    .tree-item:hover { background: var(--bg-hover); color: var(--text-main); }
    .tree-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
    .tree-item-icon { opacity: 0.78; display: inline-flex; flex-shrink: 0; }
    .tree-item-meta { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .tree-item.active .tree-item-meta { color: var(--accent-text); opacity: 0.8; }
    .tree-item-more { opacity: 0; width: 24px; height: 24px; border-radius: 5px; color: var(--text-muted); flex-shrink: 0; }
    .tree-item:hover .tree-item-more, .tree-item.active .tree-item-more { opacity: 1; }
    .tree-item-more:hover { background: var(--bg-app); color: var(--text-main); }
    .code-badge { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--bg-subtle); color: var(--text-muted); font-weight: 500; flex-shrink: 0; }

    .dragging { opacity: 0.42; }
    .drag-over-top { border-top: 2px solid var(--accent) !important; }
    .drag-over-bottom { border-bottom: 2px solid var(--accent) !important; }
    .drag-over-inside { background: var(--accent-soft) !important; border-color: var(--accent) !important; }

    @media (hover: none) { .tree-folder-actions, .tree-item-more { opacity: 1 !important; } }

    /* Search Results */
    .search-results { padding: 2px 0; display: flex; flex-direction: column; gap: 4px; }
    .search-count-label { padding: 4px 6px; font-size: 11px; font-weight: 500; color: var(--text-muted); }
    .search-hit {
      padding: 8px 10px; border-radius: 7px; border: 1px solid transparent; background: var(--bg-app);
      cursor: pointer; transition: border-color 0.14s ease, background 0.14s ease;
    }
    .search-hit:hover { border-color: var(--border); background: var(--bg-hover); }
    .search-hit-sub { font-size: 11px; color: var(--text-faint); margin-bottom: 2px; }
    .search-hit-head { font-size: 12.5px; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }
    .search-hit-snippet {
      font-size: 11.5px; line-height: 1.45; color: var(--text-muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Main Content Area */
    .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg-app); }
    .main-header {
      min-height: 44px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--bg-app);
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .breadcrumb { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
    .crumb-folder {
      padding: 2px 8px; border-radius: 5px; background: var(--bg-subtle); color: var(--text-muted);
      font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .crumb-sep { color: var(--text-faint); }
    .crumb-title-input {
      border: 1px solid transparent; background: transparent; font-weight: 600; font-size: 14.5px;
      color: var(--text-main); padding: 2px 6px; border-radius: 6px; min-width: 100px; flex: 1; max-width: 320px; outline: none;
    }
    .crumb-title-input:hover { border-color: var(--border); }
    .crumb-title-input:focus { border-color: var(--accent); background: var(--bg-sidebar); }
    .main-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* ================= HOME GALLERY ================= */
    .home-scroll { flex: 1; overflow-y: auto; background: var(--bg-app); }
    .home-wrap { max-width: 1180px; margin: 0 auto; padding: 20px 24px 56px; display: flex; flex-direction: column; gap: 16px; }

    .home-summary-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .home-stats {
      display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--text-main);
      font-variant-numeric: tabular-nums; flex-wrap: wrap;
    }
    .home-stats-sep { color: var(--border-strong); font-weight: 400; }
    .home-stats-sub { font-weight: 500; color: var(--text-muted); font-size: 13px; }
    .home-controls { display: flex; align-items: center; gap: 8px; }
    .home-sort-select {
      height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg-app); color: var(--text-main); font-size: 13px; font-weight: 500; outline: none; cursor: pointer;
    }

    .home-filter-bar { display: flex; flex-direction: column; gap: 10px; }
    .home-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .home-search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; display: flex; align-items: center; }
    .home-search-wrap .search-input { height: 33px; font-size: 13px; }
    .filter-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .filter-pill {
      height: 29px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
      border: 1px solid var(--border); background: var(--bg-app); color: var(--text-secondary);
      transition: all 0.14s ease;
    }
    .filter-pill:hover { background: var(--bg-hover); color: var(--text-main); }
    .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .filter-tag-pill {
      height: 25px; padding: 0 9px; border-radius: 6px; font-size: 11.5px; font-weight: 500;
      background: var(--bg-subtle); color: var(--text-muted); border: 1px solid transparent;
      transition: all 0.12s ease;
    }
    .filter-tag-pill:hover { background: var(--bg-hover); color: var(--text-main); }
    .filter-tag-pill.active { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-border); }

    .gallery-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px 18px; align-items: start;
    }
    .gallery-card {
      display: flex; flex-direction: column; gap: 9px; cursor: pointer; group: true;
      transition: transform 0.16s ease;
    }
    .gallery-card:hover .gallery-thumb img { transform: scale(1.03); }
    .gallery-thumb {
      position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden;
      background: var(--bg-subtle); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .gallery-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.25s ease;
    }
    .gallery-thumb-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      color: var(--text-faint); width: 100%; height: 100%;
      background: linear-gradient(145deg, var(--bg-sidebar), var(--bg-subtle));
    }
    .gallery-thumb-letter {
      font-size: 38px; font-weight: 800; color: var(--border-strong); line-height: 1; user-select: none;
    }

    /* Gallery Overlay Badges (Exact User Spec) */
    .g-badge-tl { position: absolute; top: 9px; left: 9px; display: flex; align-items: center; gap: 4px; z-index: 2; }
    .g-badge-tr { position: absolute; top: 9px; right: 9px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; z-index: 2; }
    .g-badge-br { position: absolute; bottom: 9px; right: 9px; z-index: 2; }

    .g-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 700; line-height: 1.1;
      letter-spacing: -0.01em; color: #ffffff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22); user-select: none;
    }
    .g-badge-pin { background: rgba(10, 12, 16, 0.84); }
    .g-badge-enc { background: rgba(229, 57, 53, 0.94); }
    .g-badge-status { background: rgba(15, 18, 24, 0.78); font-weight: 600; font-size: 11px; }
    .g-badge-status .s-dot { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; }
    .g-badge-status.wip .s-dot { background: #fbbf24; }
    .g-badge-status.synced .s-dot { background: #34d399; }
    .g-badge-branch {
      background: rgba(15, 18, 24, 0.76); padding: 4px 9px; border-radius: 8px;
      font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums;
    }

    .gallery-meta { display: flex; flex-direction: column; gap: 4px; padding: 0 2px; min-width: 0; }
    .gallery-title-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .gallery-title {
      font-size: 15px; font-weight: 700; color: var(--text-main);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .gallery-summary {
      font-size: 12.5px; line-height: 1.48; color: var(--text-secondary);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      min-height: 1.48em;
    }
    .gallery-tags {
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
      font-size: 12px; color: var(--text-muted); margin-top: 1px;
    }
    .gallery-tag-link { color: var(--text-muted); transition: color 0.12s ease; }
    .gallery-tag-link:hover { color: var(--accent-text); }
    .gallery-foot-sub {
      font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums;
      display: flex; align-items: center; gap: 6px; margin-top: 1px;
    }

    /* Lorebook Keyword Bar */
    .lore-bar {
      padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .lore-bar label { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
    .lore-input {
      flex: 1; min-width: 180px; height: 29px; padding: 0 9px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--bg-app); color: var(--text-main);
      font-size: 12.5px; outline: none;
    }
    .lore-count { font-size: 12px; padding: 2px 8px; border-radius: 5px; background: var(--bg-subtle); color: var(--text-muted); white-space: nowrap; }

    /* Editor & Split Preview */
    .editor-stage { flex: 1; min-height: 0; display: flex; overflow: hidden; }
    .editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .preview-pane {
      width: 46%; min-width: 300px; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; background: var(--bg-subtle);
    }
    .preview-head {
      height: 36px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar);
      display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--text-muted);
    }

    .preview-iframe { flex: 1; width: 100%; border: none; background: var(--bg-app); }

    /* CodeMirror Custom Prompt-Markdown Styling */
    .CodeMirror {
      height: 100% !important; width: 100%;
      font-family: var(--font-sans); font-size: 14.5px; line-height: 1.72;
      background: var(--bg-app); color: var(--text-main);
    }
    .CodeMirror.cm-code-mode { font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; }
    .CodeMirror-gutters { background: var(--bg-app); border-right: 1px solid var(--border); }
    .CodeMirror-linenumber { color: var(--text-faint); font-family: var(--font-mono); font-size: 12px; padding: 0 8px 0 6px; }
    .CodeMirror-lines { padding: 14px 0 60px; }
    .CodeMirror pre.CodeMirror-line, .CodeMirror pre.CodeMirror-line-like { padding: 0 18px; }
    .CodeMirror-cursor { border-left: 2px solid var(--accent); }
    .CodeMirror-selected { background: var(--accent-soft) !important; }

    .cm-pm-h1 { font-size: 1.42em; font-weight: 800; color: var(--text-main); line-height: 1.45; }
    .cm-pm-h2 { font-size: 1.22em; font-weight: 700; color: var(--text-main); line-height: 1.5; }
    .cm-pm-h3 { font-size: 1.08em; font-weight: 700; color: var(--text-main); line-height: 1.55; }
    .cm-pm-syntax, .md-syn { color: var(--text-muted); font-weight: 500; }
    .cm-pm-bold, .md-bold { font-weight: 700; color: var(--text-main); }
    .cm-pm-italic, .md-italic { font-style: italic; color: var(--text-secondary); }
    .cm-pm-list, .md-list { color: var(--accent); font-weight: 600; }
    .cm-pm-var, .md-var {
      color: var(--accent-text); background: var(--accent-soft);
      font-family: var(--font-mono); font-size: 0.92em; font-weight: 600; padding: 1px 4px; border-radius: 4px;
    }
    .cm-pm-code, .md-code { background: var(--bg-subtle); color: var(--text-main); font-family: var(--font-mono); font-size: 0.92em; padding: 1px 5px; border-radius: 4px; }
    .cm-pm-tag, .md-tag { background: var(--bg-subtle); color: var(--text-secondary); font-family: var(--font-mono); font-size: 0.92em; padding: 1px 4px; border-radius: 4px; }
    .cm-pm-bracket, .md-bracket { background: var(--bg-subtle); color: var(--text-main); font-weight: 600; padding: 1px 4px; border-radius: 4px; }
    .cm-pm-hr { color: var(--text-muted); display: inline-block; width: 100%; border-bottom: 1px solid var(--border-strong); line-height: 1; }

    .fallback-textarea {
      width: 100%; height: 100%; border: none; outline: none; resize: none;
      padding: 16px 20px; background: var(--bg-app); color: var(--text-main); font-size: 14.5px; line-height: 1.7;
    }

    /* Character Info Page (1:1 Square Profile) */
    .char-info-page { flex: 1; overflow-y: auto; background: var(--bg-app); }
    .char-info-top { padding: 18px 24px 14px; border-bottom: 1px solid var(--border); }
    .char-info-kicker { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .char-info-heading { font-size: 18px; font-weight: 700; color: var(--text-main); line-height: 1.4; }
    .char-info-section { padding: 18px 24px; border-bottom: 1px solid var(--border); }
    .char-profile-row { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
    .profile-box {
      width: 180px; height: 180px; aspect-ratio: 1 / 1; border-radius: 12px; border: 1px solid var(--border);
      background: var(--bg-sidebar); overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: var(--text-faint); flex-shrink: 0;
    }
    .profile-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-controls { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 220px; padding-top: 2px; }
    .profile-asset-note {
      font-size: 12px; line-height: 1.5; color: var(--text-muted); font-family: var(--font-mono);
      background: var(--bg-sidebar); padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border); word-break: break-all;
    }
    .field-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .field-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .field-counter { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .field-counter.over { color: var(--danger); font-weight: 600; }
    .field-input {
      width: 100%; height: 40px; padding: 0 13px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg-app); color: var(--text-main); font-size: 14px; outline: none;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }

    /* Card Views */
    .cards-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 40px; background: var(--bg-sidebar); }
    .lore-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; align-items: start; }
    .text-stack { display: flex; flex-direction: column; gap: 14px; max-width: 1040px; margin: 0 auto; }
    .item-card {
      background: var(--bg-app); border: 1px solid var(--border); border-radius: 10px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-sm); transition: border-color 0.14s ease;
    }
    .item-card:hover { border-color: var(--border-strong); }
    .card-head { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .card-head-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-title { font-weight: 700; font-size: 14px; color: var(--text-main); }
    .card-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .card-kw-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .kw-pill {
      font-size: 11px; padding: 2px 7px; border-radius: 5px;
      background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent-border); font-weight: 500;
    }
    .kw-pill.empty { background: var(--bg-subtle); color: var(--text-muted); border-color: var(--border); }
    .card-body { padding: 12px 14px; font-size: 13.5px; line-height: 1.68; color: var(--text-main); word-break: break-word; }
    .lore-grid .card-body { max-height: 360px; overflow-y: auto; }
    .card-edit-box { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--bg-sidebar); }
    .card-edit-textarea {
      width: 100%; min-height: 180px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg-app); color: var(--text-main); font-size: 13.5px; line-height: 1.65; resize: vertical; outline: none;
    }

    /* Rendered Markdown inside Cards */
    .md-h1 { font-size: 1.32em; font-weight: 800; margin: 8px 0 4px; color: var(--text-main); }
    .md-h2 { font-size: 1.15em; font-weight: 700; margin: 6px 0 3px; color: var(--text-main); }
    .md-h3 { font-size: 1.04em; font-weight: 700; margin: 5px 0 2px; color: var(--text-main); }
    .md-line { min-height: 1.4em; line-height: 1.68; }
    .md-blank { height: 0.7em; }
    .md-hr { height: 1px; background: var(--border-strong); margin: 10px 0; }

    /* ================= TOKEN MINI-BAR STATUSBAR ================= */
    .statusbar {
      height: var(--statusbar-h); min-height: var(--statusbar-h);
      border-top: 1px solid var(--border); background: var(--bg-app); padding: 0 14px;
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--text-muted); cursor: pointer; user-select: none;
      transition: background 0.14s ease;
    }
    .statusbar:hover { background: var(--bg-sidebar); }
    .token-track {
      flex: 1; height: 7px; border-radius: 999px; background: var(--bg-hover);
      overflow: hidden; display: flex; min-width: 80px;
    }
    .token-seg { height: 100%; transition: width 0.22s ease; flex-shrink: 0; }
    .token-summary {
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-muted); flex-shrink: 0;
    }
    .token-summary strong { color: var(--text-main); font-weight: 700; }
    .token-summary.over strong, .token-summary.over .tok-num { color: var(--danger); font-weight: 700; }
    .item-inline-metric {
      font-size: 11.5px; color: var(--text-muted); padding: 2px 7px; border-radius: 5px;
      background: var(--bg-subtle); font-variant-numeric: tabular-nums; white-space: nowrap;
    }

    /* Token Breakdown Popover */
    .token-popover {
      position: fixed; bottom: calc(var(--statusbar-h) + 8px); right: 14px;
      width: min(340px, calc(100vw - 24px)); background: var(--bg-app);
      border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow-md);
      padding: 12px 14px; z-index: 120; display: flex; flex-direction: column; gap: 10px;
    }
    .tp-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 13px; }
    .tp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; }
    .tp-label { display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tp-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .tp-val { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
    .tp-budget-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary);
    }

    /* Dropdown & Accent Popover */
    .dropdown-wrap { position: relative; }
    .dropdown-menu {
      position: fixed; min-width: 210px; max-width: min(280px, calc(100vw - 16px)); max-height: 380px; overflow-y: auto;
      background: var(--bg-app); border: 1px solid var(--border); border-radius: 9px;
      box-shadow: var(--shadow-md); padding: 5px; z-index: 100;
    }
    .dd-item { width: 100%; padding: 7px 9px; border-radius: 6px; justify-content: space-between; text-align: left; font-size: 13px; color: var(--text-main); }
    .dd-item:hover { background: var(--bg-hover); }
    .dd-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
    .dd-sep { height: 1px; background: var(--border); margin: 4px 0; }
    .dd-label { font-size: 11px; color: var(--text-faint); padding: 4px 9px; font-weight: 600; }

    .accent-dot-preview {
      width: 14px; height: 14px; border-radius: 999px; background: var(--accent);
      border: 2px solid var(--bg-app); box-shadow: 0 0 0 1px var(--border-strong); display: inline-block;
    }
    .accent-popover-box { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 8px; }
    .accent-swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .accent-swatch {
      width: 24px; height: 24px; border-radius: 999px; border: 2px solid transparent;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); transition: transform 0.12s ease;
    }
    .accent-swatch:hover { transform: scale(1.12); }
    .accent-swatch.active { border-color: var(--text-main); transform: scale(1.1); }
    .accent-custom-row { display: flex; align-items: center; gap: 6px; }
    .accent-custom-row .form-input { min-width: 0; width: 0; }
    .accent-native-picker { width: 32px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer; flex-shrink: 0; }

    /* Modal & Forms */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(2px);
      display: none; align-items: center; justify-content: center; padding: 14px; z-index: 200;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 540px; max-height: 88dvh;
      background: var(--bg-app); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow-md); display: flex; flex-direction: column; overflow: hidden;
    }
    .modal.modal-lg { max-width: 860px; }
    .modal-head {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px;
    }
    .modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .modal-foot {
      padding: 12px 16px; border-top: 1px solid var(--border); background: var(--bg-sidebar);
      display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
    }
    .form-row { display: flex; flex-direction: column; gap: 5px; }
    .form-row label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .form-input, .form-select {
      height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg-app); color: var(--text-main); font-size: 13px; outline: none;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .form-check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; }

    /* History & Diff */
    .history-layout { display: grid; grid-template-columns: 240px 1fr; gap: 12px; min-height: 360px; }
    .history-list { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-sidebar); overflow-y: auto; max-height: 460px; }
    .history-item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s ease; }
    .history-item:hover { background: var(--bg-hover); }
    .history-item.active { background: var(--accent-soft); }
    .diff-box {
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 0; overflow-y: auto; max-height: 460px;
      font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
      background: var(--bg-app); white-space: pre-wrap; word-break: break-word;
    }
    .diff-add { background: var(--diff-add-bg); color: var(--diff-add-text); display: block; padding: 1px 10px; }
    .diff-del { background: var(--diff-del-bg); color: var(--diff-del-text); display: block; padding: 1px 10px; }
    .diff-same { color: var(--text-muted); display: block; padding: 1px 10px; }

    /* Toast */
    .toast-wrap {
      position: fixed; bottom: 44px; right: 14px; z-index: 300;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: min(92vw, 340px);
    }
    .toast {
      padding: 10px 14px; border-radius: 8px; background: var(--text-main); color: var(--bg-app);
      font-size: 13px; font-weight: 500; box-shadow: var(--shadow-md); animation: fadeUp 0.18s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar {
        position: fixed; top: var(--topbar-h); bottom: 0; left: 0;
        width: min(84vw, 310px); min-width: min(84vw, 310px);
        box-shadow: var(--shadow-md); transform: translateX(0);
      }
      .sidebar.collapsed { width: min(84vw, 310px); min-width: min(84vw, 310px); border-right-width: 1px; transform: translateX(-100%); }
      .sidebar:not(.collapsed):not(.hidden) + .sidebar-backdrop { display: block; opacity: 1; }
      .editor-stage { flex-direction: column; }
      .preview-pane { width: 100%; min-width: 0; height: 45%; border-left: none; border-top: 1px solid var(--border); }
      .history-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .hide-xs { display: none !important; }
      .home-wrap { padding: 14px 12px 44px; gap: 12px; }
      .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; }
      .g-badge { padding: 3px 6px; font-size: 10.5px; }
      .char-info-top, .char-info-section { padding: 14px 16px; }
      .cards-scroll { padding: 12px; }
      .lore-grid { grid-template-columns: 1fr; }
      .statusbar { padding: 0 10px; gap: 8px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn btn-ghost btn-icon" id="btnToggleSidebar" title="사이드바 접기/열기" aria-label="사이드바 토글"></button>
      <button class="btn btn-ghost btn-icon" id="btnGoHome" title="작품 홈 갤러리로 이동" aria-label="홈"></button>
      <span class="brand-title hidden" id="homeBrandTitle">프롬프트 아카이브 스튜디오</span>
      <div class="dropdown-wrap" id="wrapWorkMenu"><button class="btn" id="btnWorkMenu" title="작품 전환 및 관리"></button></div>
      <div class="dropdown-wrap" id="wrapBranchMenu"><button class="btn" id="btnBranchMenu" title="플랫폼 버전 분기 전환 및 관리"></button></div>
      <button class="btn btn-ghost" id="btnHistory" title="GitHub 커밋 및 로컬 스냅샷 비교"></button>
    </div>
    <div class="topbar-right">
      <button class="btn" id="btnEncryptToggle" title="작품 단위 암호화 저장 토글"></button>
      <button class="btn btn-ghost" id="btnSettings" title="GitHub 비공개 레포 연동 설정"></button>
      <button class="btn btn-ghost btn-icon" id="btnAccentPicker" title="액센트 컬러 변경" aria-label="액센트 컬러 변경"></button>
      <button class="btn btn-ghost btn-icon" id="btnTheme" title="라이트/다크 모드 전환" aria-label="테마 전환"></button>
      <button class="btn btn-primary" id="btnGitSave" title="GitHub에 커밋 저장"></button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="search-box">
          <span class="search-icon-slot" id="searchIconSlot"></span>
          <input type="text" class="search-input" id="searchInput" placeholder="항목·내용 검색 (Ctrl+Shift+F)" />
          <button type="button" class="search-clear-btn hidden" id="btnClearSearch" title="검색어 지우기"></button>
        </div>
        <div class="seg-control">
          <button class="seg-btn active" id="segCurrent" type="button">현재 작품</button>
          <button class="seg-btn" id="segAll" type="button">전체 작품</button>
        </div>
      </div>
      <div class="sidebar-tags-bar">
        <div class="sidebar-tags" id="sidebarTags"></div>
        <button type="button" class="tree-mini-btn" id="btnQuickCharInfo" title="캐릭터 정보·태그·썸네일 편집"></button>
      </div>
      <div class="sidebar-actions">
        <button class="btn btn-ghost btn-sm" id="btnAddFolder" type="button" style="padding:0 6px;"></button>
        <div style="display:flex;align-items:center;gap:2px;">
          <button class="btn btn-ghost btn-sm" id="btnExportCsv" type="button" title="로어북 CSV 내보내기" style="padding:0 6px;"></button>
          <button class="btn btn-ghost btn-sm" id="btnExportTxt" type="button" title="작품 전체 TXT 내보내기" style="padding:0 6px;"></button>
        </div>
      </div>
      <div class="tree" id="treeContainer"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="main" id="mainPane"></main>
  </div>

  <footer class="statusbar hidden" id="statusbar" title="클릭하여 폴더별 토큰 분포 및 목표 한도 확인">
    <div class="token-track" id="tokenTrack"></div>
    <div class="token-summary" id="tokenSummary"></div>
  </footer>
</div>

<div id="dropdownRoot"></div>
<div id="tokenPopoverRoot"></div>

<!-- Settings Modal -->
<div class="modal-backdrop" id="modalSettings">
  <div class="modal">
    <div class="modal-head">
      <span>GitHub 비공개 저장소 & 암호화 설정</span>
      <button class="tree-mini-btn" data-close-modal="modalSettings" id="closeSettingsIcon" aria-label="닫기"></button>
    </div>
    <div class="modal-body">
      <div class="form-row"><label>GitHub 아이디 (Owner)</label><input class="form-input" id="cfgOwner" placeholder="예: my-github-id" /></div>
      <div class="form-row"><label>비공개 데이터 레포 이름 (Repository)</label><input class="form-input" id="cfgRepo" placeholder="예: my-prompt-vault" /></div>

  function estimateTokens(text = '') {
    if (!text) return 0;
    let hangul = 0;
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      if ((c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3131 && c <= 0x318E)) hangul++;
    }
    return Math.ceil(hangul * 0.65 + (text.length - hangul) * 0.28);

  /* ================= UNIFIED INDEXEDDB STORAGE ================= */
  let dbInstance = null;
  function openDB() {
    if (dbInstance) return Promise.resolve(dbInstance);
    return new Promise((res, rej) => {
      const req = indexedDB.open('PromptStudioVaultDB_v2', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        [['works', 'id'], ['assets', 'path'], ['snapshots', 'id']].forEach(([n, k]) => {
          if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: k });
        });
      };
      req.onsuccess = () => res(dbInstance = req.result);
      req.onerror = () => rej(req.error);
    });
  }

  async function idb(store, op, arg) {
    const db = await openDB();
    const rw = op === 'put' || op === 'delete';
    return new Promise((res, rej) => {
      const tx = db.transaction(store, rw ? 'readwrite' : 'readonly');
      const req = tx.objectStore(store)[op](...(arg !== undefined ? [arg] : []));
      if (rw) { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }
      else { req.onsuccess = () => res(req.result ?? (op === 'getAll' ? [] : null)); req.onerror = () => rej(req.error); }
    });
  }

  /* ================= WEB CRYPTO & GITHUB API ================= */
  const b64FromBytes = (bytes) => {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  };
  const bytesFromB64 = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const utf8ToB64 = (str) => b64FromBytes(new TextEncoder().encode(str));
  const b64ToUtf8 = (b64) => new TextDecoder().decode(bytesFromB64(b64.replace(/\n/g, '')));

  async function deriveKey(password, salt) {
    const keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' },
      keyMat, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  }

  async function encryptObj(obj, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = new Uint8Array(await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv }, await deriveKey(password, salt), new TextEncoder().encode(JSON.stringify(obj))
    ));
    return {
      __encrypted: true, v: 1, id: obj.id, titleHint: 'Encrypted Work',
      updatedAt: obj.updatedAt || Date.now(),
      salt: b64FromBytes(salt), iv: b64FromBytes(iv), data: b64FromBytes(cipher)
    };
  }

  async function decryptObj(p, password) {
    const key = await deriveKey(password, bytesFromB64(p.salt));
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytesFromB64(p.iv) }, key, bytesFromB64(p.data));
    return JSON.parse(new TextDecoder().decode(buf));
  }

  async function ghRequest(path, options = {}) {
    const { owner, repo, token } = state.config;
    if (!owner || !repo || !token) throw new Error('GitHub 연동 설정을 먼저 입력해주세요.');
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${path}`, {
      ...options,
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        ...(options.headers || {})
      }
    });
    if (!res.ok) {
      let msg = `GitHub API 오류 (${res.status})`;
      try { const j = await res.json(); if (j.message) msg += `: ${j.message}`; } catch {}
      throw new Error(msg);
    }
    return res.json();
  }

  async function ghGetFile(filePath, ref) {
    try { return await ghRequest(`contents/${filePath}${ref ? `?ref=${encodeURIComponent(ref)}` : ''}`); }
    catch (e) { if (String(e.message).includes('(404)')) return null; throw e; }
  }

  async function ghPutFile(filePath, content, message) {
    const branch = state.config.branch || 'main';
    const existing = await ghGetFile(filePath, branch);
    const body = { message, content, branch, ...(existing?.sha ? { sha: existing.sha } : {}) };
    return ghRequest(`contents/${filePath}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
  }

  async function ghDeleteFile(filePath, message) {
  const branch = state.config.branch || 'main';
  const existing = await ghGetFile(filePath, branch);
  if (!existing?.sha) return false; // 원격에 애초에 없던 파일이면 패스
  await ghRequest(`contents/${filePath}`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, sha: existing.sha, branch })
  });
  return true;
}

  const getActiveBranch = (w = getActiveWork()) => w ? (w.branches.find(b => b.id === w.activeBranchId) || w.branches[0] || null) : null;
  const isCodeItem = (f, it) => f?.kind === 'code' || it?.type === 'html' || it?.type === 'jsx';

  function findFolderAndItem(branch, itemId) {
    for (const f of (branch?.folders || [])) {
      const it = f.items.find(i => i.id === itemId);
      if (it) return { folder: f, item: it };
    }

      Object.assign(state.config, JSON.parse(localStorage.getItem('ps_config') || '{}'));

    } catch {}
  }

  function persistConfig() {
    localStorage.setItem('ps_config', JSON.stringify(state.config));
    if (state.config.rememberPass && state.masterPass) localStorage.setItem('ps_master_pass', state.masterPass);
    else localStorage.removeItem('ps_master_pass');
  }

  function calcWorkPromptBreakdown(branch = getActiveBranch()) {
    let chars = 0, tokens = 0, segIdx = 0;
    const folders = [];
    for (const f of (branch?.folders || [])) {
      let fChars = 0, fTokens = 0, hasNonCode = false;
      for (const it of f.items) {
        if (isCodeItem(f, it)) continue;
        hasNonCode = true;
        const txt = it.content || '';
        fChars += txt.length;
        fTokens += estimateTokens(txt);
      }
      const excluded = f.kind === 'code' || (!hasNonCode && f.items.length > 0);
      const color = excluded ? 'var(--border-strong)' : TOKEN_SEG_COLORS[segIdx++ % TOKEN_SEG_COLORS.length];
      folders.push({ id: f.id, name: f.name, chars: fChars, tokens: fTokens, excluded, color });
      if (!excluded) { chars += fChars; tokens += fTokens; }
    }
    return { chars, tokens, folders };
  }

  function scheduleWorkSave(work, createSnapshot = false, markDirty = true) {

  async function saveLocalSnapshot(work, note = '로컬 자동 저장') {
    const snaps = (await idb('snapshots', 'getAll')).filter(s => s.workId === work.id).sort((a, b) => b.createdAt - a.createdAt);
    if (snaps[0] && JSON.stringify(snaps[0].data) === JSON.stringify(work)) return;
    await idb('snapshots', 'put', { id: uid('snap'), workId: work.id, note, createdAt: Date.now(), data: clone(work) });
    for (const old of snaps.slice(14)) await idb('snapshots', 'delete', old.id);

  async function flushDeletedToGitHub() {
    if (!state.deletedQueue.length) return 0;
    let removed = 0;
    while (state.deletedQueue.length) {
      const item = state.deletedQueue[0];
      const ok = await ghDeleteFile(`works/${item.id}.json`, `Delete ${item.title || item.id}`);
      if (item.assetPath) await ghDeleteFile(item.assetPath, `Delete asset ${item.assetPath}`);
      if (ok) removed++;
      state.deletedQueue.shift();
      saveDeletedQueue();
    }
    updateTopbarStatusDot();
    return removed;
  }

  async function deleteWorkById(workId) {
    const w = state.works.find(x => x.id === workId);

    if (!state.deletedQueue.some(d => d.id === w.id)) {
      state.deletedQueue.push({ id: w.id, title: w.title || w.id, assetPath: w.profile?.assetPath || '' });
      saveDeletedQueue();

    await idb('works', 'delete', w.id);
    if (w.profile?.assetPath) { state.assetCache.delete(w.profile.assetPath); await idb('assets', 'delete', w.profile.assetPath); }
    state.works = state.works.filter(x => x.id !== w.id);

  /* ================= THEME & ACCENT CUSTOMIZER ================= */
  const normalizeHex = (hex) => {
    let s = String(hex || '').trim().replace(/^#/, '');
    if (s.length === 3) s = s.replace(/./g, '$&$&');
    return /^[0-9a-fA-F]{6}$/.test(s) ? '#' + s.toLowerCase() : '#2563eb';
  };
  const hexToRgb = (hex) => {
    const n = parseInt(normalizeHex(hex).slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  };
  const getLum = (hex) => { const { r, g, b } = hexToRgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
  const shadeHex = (hex, amt) => {
    const { r, g, b } = hexToRgb(hex);
    const ch = (c) => Math.max(0, Math.min(255, Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt))).toString(16).padStart(2, '0');
    return `#${ch(r)}${ch(g)}${ch(b)}`;
  };

  function applyAccentColor(hex = state.accentColor) {
    const base = normalizeHex(hex), isDark = state.theme === 'dark';
    state.accentColor = base;
    localStorage.setItem('ps_accent', base);
    const main = isDark && getLum(base) < 0.45 ? shadeHex(base, 0.34) : base;
    const { r, g, b } = hexToRgb(main);
    const rgba = (a) => `rgba(${r},${g},${b},${a})`;
    const vars = {
      '--accent': main,
      '--accent-hover': shadeHex(main, isDark ? -0.12 : -0.14),
      '--accent-soft': rgba(isDark ? 0.18 : 0.10),
      '--accent-text': isDark ? shadeHex(main, 0.26) : shadeHex(main, getLum(main) > 0.65 ? -0.45 : -0.12),
      '--accent-border': rgba(isDark ? 0.36 : 0.28),
      '--accent-ring': rgba(isDark ? 0.22 : 0.16)
    };
    const rootStyle = document.documentElement.style;
    for (const [k, v] of Object.entries(vars)) rootStyle.setProperty(k, v);
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
    applyAccentColor();
  }

  /* ================= CODEMIRROR MODE & CARD MARKDOWN RENDERER ================= */
  if (window.CodeMirror) {
    CodeMirror.defineMode('prompt-markdown', () => ({
      startState: () => ({ header: 0, bold: false, italic: false }),
      token(stream, st) {
        if (stream.sol()) {
          st.header = 0; st.bold = st.italic = false;
          if (stream.match(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/)) return 'pm-hr';
          const hm = stream.match(/^(#{1,3})(?=\s)/);
          if (hm) { st.header = hm[1].length; return `pm-syntax pm-h${st.header}`; }
          if (stream.match(/^\s*([-*+]|\d+\.)(?=\s)/)) return 'pm-list';
        }
        const hCls = st.header ? ` pm-h${st.header}` : '';
        const base = `${hCls}${st.bold ? ' pm-bold' : ''}${st.italic ? ' pm-italic' : ''}`.trim();

        if (stream.match(/^\{\{[^}\n]+\}\}/)) return ('pm-var ' + hCls).trim();
        if (stream.match(/^`[^`\n]+`/)) return ('pm-code ' + hCls).trim();
        if (stream.match(/^<\/?[A-Za-z][^>\n]*>/)) return ('pm-tag ' + hCls).trim();
        if (stream.match(/^\[[^\]\n]+\]/)) return ('pm-bracket ' + base).trim();
        if (stream.peek() === '*' && stream.match(/^\*\*/)) {
          if (st.bold) { st.bold = false; return ('pm-syntax ' + hCls).trim(); }
          if (stream.string.slice(stream.pos).includes('**')) { st.bold = true; return ('pm-syntax ' + hCls).trim(); }
          return base || null;
        }
        if (stream.peek() === '*' && !stream.match(/^\*\*/, false)) {
          stream.next();
          if (st.italic) { st.italic = false; return ('pm-syntax ' + hCls).trim(); }
          if (/^[^*\n]+\*/.test(stream.string.slice(stream.pos))) { st.italic = true; return ('pm-syntax ' + hCls).trim(); }
          return base || null;
        }
        stream.next();
        while (!stream.eol() && !'{`<[*'.includes(stream.peek())) stream.next();
        return base || null;
      }
    }));
  }

  function highlightInlineMd(s) {
    return s
      .replace(/`([^`]+)`/g, '<span class="md-code">`$1`</span>')
      .replace(/(\{\{[^}]+\}\})/g, '<span class="md-var">$1</span>')
      .replace(/(&lt;\/?[A-Za-z][^&]*?&gt;)/g, '<span class="md-tag">$1</span>')
      .replace(/\*\*([^*]+)\*\*/g, '<span class="md-syn">**</span><strong class="md-bold">$1</strong><span class="md-syn">**</span>')
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<span class="md-syn">*</span><em class="md-italic">$2</em><span class="md-syn">*</span>')
      .replace(/(\[[^\]<]+\])/g, '<span class="md-bracket">$1</span>');
  }

  function renderMarkdownHighlightHtml(text = '') {
    if (!text.trim()) return '<div style="color:var(--text-faint);font-size:12.5px;">내용이 비어 있습니다.</div>';
    return text.split('\n').map(raw => {
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(raw)) return '<div class="md-hr"></div>';
      if (!raw.trim()) return '<div class="md-blank"></div>';
      const esc = escHtml(raw);
      const hm = esc.match(/^(#{1,3})(\s+)(.*)$/);
      if (hm) return `<div class="md-h${hm[1].length}"><span class="md-syn">${hm[1]}</span>${hm[2]}${highlightInlineMd(hm[3])}</div>`;
      const lm = esc.match(/^(\s*)([-*+]|\d+\.)(\s+)(.*)$/);
      if (lm) return `<div class="md-line">${lm[1]}<span class="md-list">${lm[2]}</span>${lm[3]}${highlightInlineMd(lm[4])}</div>`;
      return `<div class="md-line">${highlightInlineMd(esc)}</div>`;
    }).join('');
  }

  /* ================= ASSET IMAGE HANDLING ================= */
  function compressImageFile(file, maxSize = 840) {
    return new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width: w, height: h } = img;
          if (w > maxSize || h > maxSize) { const r = Math.min(maxSize / w, maxSize / h); w = Math.round(w * r); h = Math.round(h * r); }
          const cv = Object.assign(document.createElement('canvas'), { width: w, height: h });
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          res(cv.toDataURL('image/webp', 0.86));
        };
        img.onerror = rej;
        img.src = reader.result;
      };
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });
  }

  async function getAssetDataUrl(assetPath) {
    if (!assetPath) return '';
    if (state.assetCache.has(assetPath)) return state.assetCache.get(assetPath);
    const local = await idb('assets', 'get', assetPath);
    if (local?.dataUrl) { state.assetCache.set(assetPath, local.dataUrl); return local.dataUrl; }
    if (state.config.owner && state.config.repo && state.config.token) {
      try {
        const file = await ghGetFile(assetPath, state.config.branch || 'main');
        if (file?.content) {
          const mime = assetPath.endsWith('.png') ? 'image/png' : assetPath.endsWith('.jpg') ? 'image/jpeg' : 'image/webp';
          const dataUrl = `data:${mime};base64,${file.content.replace(/\n/g, '')}`;
          await idb('assets', 'put', { path: assetPath, dataUrl, dirty: false, updatedAt: Date.now() });
          state.assetCache.set(assetPath, dataUrl);
          return dataUrl;
        }
      } catch {}
    }
    return '';
  }

  async function getWorkThumbSrc(work) {
    if (!work?.profile) return '';
    return work.profile.assetPath ? getAssetDataUrl(work.profile.assetPath) : (work.profile.externalUrl || '');

      for (const w of targets) {
        for (const f of (getActiveBranch(w)?.folders || [])) {
          for (const it of f.items) {
            if (`${it.title}\n${it.keywords || ''}\n${it.content || ''}`.toLowerCase().includes(q)) {
              const raw = `${it.keywords ? `[${it.keywords}] ` : ''}${it.content || ''}`;
              const pos = raw.toLowerCase().indexOf(q);
              const start = Math.max(0, pos - 24);
              const snippet = (start > 0 ? '...' : '') + raw.slice(start, start + 110) + (start + 110 < raw.length ? '...' : '');
              hits.push({ w, f, it, snippet });
            }
          }
        }
      }
      container.innerHTML = hits.length
        ? `<div class="search-count-label">검색 결과 ${hits.length}건</div><div class="search-results">${hits.map(({ w, f, it, snippet }) => `
            <div class="search-hit" data-w="${w.id}" data-f="${f.id}" data-i="${it.id}">
              <div class="search-hit-sub">${escHtml(w.title || '제목 없음')} / ${escHtml(f.name)}</div>
              <div class="search-hit-head">${escHtml(it.title)}</div>
              <div class="search-hit-snippet">${escHtml(snippet || '(제목 일치)')}</div>
            </div>`).join('')}</div>`
        : `<div style="padding:20px;text-align:center;color:var(--text-faint);font-size:12px;">"${escHtml(state.searchQuery.trim())}"에 해당하는 검색 결과가 없습니다.</div>`;
      return;
    }

    if (!work || !branch) { container.innerHTML = ''; return; }

    container.innerHTML = `
      <div class="tree-pinned">
        <div class="tree-item pinned-item ${state.viewMode === 'charInfo' ? 'active' : ''}" id="navCharInfo">
          <span class="tree-item-icon">${ICONS.user}</span>
          <span class="tree-item-title">캐릭터 정보</span>
          <span class="tree-item-meta">고정</span>
        </div>
      </div>
      ${branch.folders.map(f => {
        const fIcon = f.kind === 'lorebook' ? ICONS.book : f.kind === 'code' ? ICONS.code : (f.collapsed ? ICONS.folder : ICONS.folderOpen);
        const cardType = f.kind === 'lorebook' ? 'loreCards' : f.kind === 'text' ? 'textCards' : '';
        const isCardActive = cardType && state.viewMode === cardType && state.activeFolderId === f.id;
        return `
          <div class="tree-folder" data-folder-wrap="${f.id}">
            <div class="tree-folder-row ${isCardActive ? 'active-view' : ''}" draggable="true" data-ftoggle="${f.id}">
              <span class="tree-chevron">${f.collapsed ? ICONS.chevRight : ICONS.chevDown}</span>
              <span class="tree-folder-icon">${fIcon}</span>
              <span class="tree-folder-name">${escHtml(f.name)}</span>
              ${f.kind === 'code' ? '<span class="code-badge">제외</span>' : ''}
              <div class="tree-folder-actions">
                ${cardType ? `<button class="tree-mini-btn ${isCardActive ? 'active' : ''}" data-act="cards" data-fid="${f.id}" data-ctype="${cardType}" title="${f.kind === 'lorebook' ? '로어북 그리드 카드 보기' : '텍스트 한 줄 카드 보기'}">${f.kind === 'lorebook' ? ICONS.grid : ICONS.rows}</button>` : ''}
                <button class="tree-mini-btn" data-act="fadd" data-fid="${f.id}" title="항목 추가">${ICONS.plus}</button>
                <button class="tree-mini-btn" data-act="fmenu" data-fid="${f.id}" title="폴더 메뉴">${ICONS.more}</button>
              </div>
            </div>
            ${f.collapsed ? '' : `<div class="tree-items">${f.items.map(it => {
              const active = state.viewMode === 'editor' && state.activeItemId === it.id;
              const itIcon = it.type === 'lorebook' ? ICONS.book : (it.type === 'html' || it.type === 'jsx') ? ICONS.code : ICONS.file;
              const len = (it.content || '').length;
              return `
                <div class="tree-item ${active ? 'active' : ''}" draggable="true" data-iselect="${it.id}" data-fid="${f.id}">
                  <span class="tree-item-icon">${itIcon}</span>
                  <span class="tree-item-title">${escHtml(it.title)}</span>
                  ${len ? `<span class="tree-item-meta">${fmtNum(len)}</span>` : ''}
                  <button class="tree-item-more" data-act="imenu" data-fid="${f.id}" data-iid="${it.id}" title="항목 메뉴">${ICONS.more}</button>
                </div>`;
            }).join('')}</div>`}
          </div>`;
      }).join('')}`;
  }

  /* ================= MAIN VIEWS ================= */
  function renderMain() {
    cmEditor = null;
    const main = $('mainPane');
    if (isHome()) {
      renderHomeGallery(main);
      renderStatusbar();
      return;
    }
    const work = getActiveWork(), branch = getActiveBranch(work);
    if (!work || !branch) {
      state.viewMode = 'home';
      renderAll();
      return;
    }

    if (state.viewMode === 'loreCards' || state.viewMode === 'textCards') {
      const folder = branch.folders.find(f => f.id === state.activeFolderId);
      if (folder) renderCardsView(main, work, folder, state.viewMode === 'loreCards');
      else { state.viewMode = 'charInfo'; renderCharInfoView(main, work); }
    } else if (state.viewMode === 'editor') {
      const { folder, item } = findFolderAndItem(branch, state.activeItemId);
      if (item) renderItemEditorView(main, work, folder, item);
      else { state.viewMode = 'charInfo'; renderCharInfoView(main, work); }
    } else {
      renderCharInfoView(main, work);
    }
    renderStatusbar();
  }

  /* ================= HOME GALLERY VIEW ================= */
  function getFilteredHomeWorks() {
    const q = state.homeQuery.trim().toLowerCase();
    const list = state.works.map(w => ({
      work: w,
      stats: calcWorkPromptBreakdown(getActiveBranch(w))
    })).filter(({ work: w }) => {
      if (state.homeFilter === 'pinned' && !w.pinned) return false;
      if (state.homeFilter === 'wip' && !w.dirty) return false;
      if (state.homeFilter === 'synced' && w.dirty) return false;
      if (state.homeFilter === 'encrypted' && !w.encrypted) return false;
      if (state.homeTag && !(w.tags || []).includes(state.homeTag)) return false;
      if (q && !`${w.title || ''}\n${w.summary || ''}\n${(w.tags || []).join(' ')}`.toLowerCase().includes(q)) return false;
      return true;
    });

    list.sort((a, b) => {
      if (!!a.work.pinned !== !!b.work.pinned) return a.work.pinned ? -1 : 1;
      if (state.homeSort === 'oldest') return (a.work.updatedAt || 0) - (b.work.updatedAt || 0);
      if (state.homeSort === 'title') return (a.work.title || '').localeCompare(b.work.title || '', 'ko');
      if (state.homeSort === 'tokens') return b.stats.tokens - a.stats.tokens;
      if (state.homeSort === 'branches') return (b.work.branches?.length || 0) - (a.work.branches?.length || 0);
      return (b.work.updatedAt || 0) - (a.work.updatedAt || 0);
    });
    return list;
  }

  function renderHomeGallery(main) {
    const totalWorks = state.works.length;
    const syncedCount = state.works.filter(w => !w.dirty).length;
    const wipCount = totalWorks - syncedCount;
    const totalTokensAll = state.works.reduce((sum, w) => sum + calcWorkPromptBreakdown(getActiveBranch(w)).tokens, 0);

    const tagMap = new Map();
    for (const w of state.works) for (const t of (w.tags || [])) tagMap.set(t, (tagMap.get(t) || 0) + 1);
    const topTags = [...tagMap.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14).map(([t]) => t);
    if (state.homeTag && !tagMap.has(state.homeTag)) state.homeTag = '';

    const items = getFilteredHomeWorks();

    main.innerHTML = `
      <div class="home-scroll">
        <div class="home-wrap">
          <div class="home-summary-bar">
            <div class="home-stats">
              <span>전체 작품 ${totalWorks}개</span>
              <span class="home-stats-sep">|</span>
              <span class="home-stats-sub">배포 완료 ${syncedCount} · 제작중 ${wipCount}</span>
              <span class="home-stats-sep hide-xs">|</span>
              <span class="home-stats-sub hide-xs">누적 ${fmtShort(totalTokensAll)} 토큰</span>
            </div>

                  `<option value="${v}" ${state.homeSort === v ? 'selected' : ''}>${l}</option>`).join('')}
                <!-- .home-controls 내부 <select> 바로 위 -->
                ${state.deletedQueue.length ? `<button class="btn btn-sm" id="btnHomeSyncDel" style="color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft);">${ICONS.cloud}<span>삭제 반영 (${state.deletedQueue.length})</span></button>` : ''}
              </select>
              <button class="btn btn-primary" id="btnHomeNewWork">${ICONS.plus}<span>새 작품</span></button>
            </div>
          </div>

          <div class="home-filter-bar">
            <div class="home-filter-row">
              <div class="home-search-wrap">
                <span class="search-icon-slot">${ICONS.search}</span>
                <input type="text" class="search-input" id="homeSearchInput" value="${escHtml(state.homeQuery)}" placeholder="작품 제목, 소개, 태그 검색..." />
                <button type="button" class="search-clear-btn ${state.homeQuery ? '' : 'hidden'}" id="btnClearHomeSearch">${ICONS.close}</button>
              </div>
              <div class="filter-pills" id="homeFilterPills">
                ${[['all', '전체'], ['pinned', '고정됨'], ['wip', '제작중'], ['synced', '배포 완료'], ['encrypted', '암호화']].map(([v, l]) =>
                  `<button type="button" class="filter-pill ${state.homeFilter === v ? 'active' : ''}" data-hfilter="${v}">${l}</button>`).join('')}
              </div>
            </div>
            ${topTags.length ? `
              <div class="filter-pills" id="homeTagPills">
                ${topTags.map(t => `<button type="button" class="filter-tag-pill ${state.homeTag === t ? 'active' : ''}" data-htag="${escHtml(t)}">#${escHtml(t)}</button>`).join('')}
              </div>` : ''}
          </div>

          <div class="gallery-grid" id="galleryGrid">
            ${items.length ? items.map(({ work: w, stats }) => {
              const tags = w.tags || [];
              const shownTags = tags.slice(0, 3);
              const extraTags = tags.length - shownTags.length;
              const initial = (w.title || 'W').trim().charAt(0).toUpperCase();
              const branchCount = w.branches?.length || 1;
              return `
                <article class="gallery-card" data-open-work="${w.id}">
                  <div class="gallery-thumb" data-thumb-slot="${w.id}">
                    <div class="gallery-thumb-empty">
                      <span class="gallery-thumb-letter">${escHtml(initial)}</span>
                    </div>
                    ${w.pinned ? `<div class="g-badge-tl"><span class="g-badge g-badge-pin">${ICONS.pin}<span>고정됨</span></span></div>` : ''}
                    <div class="g-badge-tr">
                      ${w.encrypted ? `<span class="g-badge g-badge-enc">${ICONS.lock}<span>암호화</span></span>` : ''}
                      <span class="g-badge g-badge-status ${w.dirty ? 'wip' : 'synced'}"><span class="s-dot"></span><span>${w.dirty ? '제작중' : '배포 완료'}</span></span>
                    </div>
                    <div class="g-badge-br">
                      <span class="g-badge g-badge-branch" title="플랫폼 분기 수">${ICONS.branch}<span>${branchCount}</span></span>
                    </div>
                  </div>
                  <div class="gallery-meta">
                    <div class="gallery-title-row">
                      <div class="gallery-title">${escHtml(w.title || '제목 없음')}</div>
                      <button type="button" class="tree-mini-btn" data-gmenu="${w.id}" title="작품 메뉴">${ICONS.moreV}</button>
                    </div>
                    <div class="gallery-summary">${escHtml(w.summary || '한 줄 소개가 비어 있습니다.')}</div>
                    ${tags.length ? `
                      <div class="gallery-tags">
                        ${shownTags.map(t => `<span class="gallery-tag-link" data-pick-tag="${escHtml(t)}">#${escHtml(t)}</span>`).join('')}
                        ${extraTags > 0 ? `<span>+${extraTags}</span>` : ''}
                      </div>` : ''}
                    <div class="gallery-foot-sub">
                      <span>${fmtShort(stats.tokens)} 토큰</span>
                      <span>·</span>
                      <span>${new Date(w.updatedAt || Date.now()).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}</span>
                    </div>
                  </div>
                </article>`;
            }).join('') : `
              <div style="grid-column:1/-1;padding:64px 20px;text-align:center;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;gap:12px;">
                <div>${state.works.length ? '조건에 맞는 작품이 없습니다.' : '등록된 작품이 없습니다. 새 작품을 만들어 보세요.'}</div>
                ${state.works.length ? '<button class="btn btn-sm" id="btnResetHomeFilter">필터 초기화</button>' : ''}
              </div>`}
          </div>
        </div>
      </div>`;

    // Bind gallery controls
    $('btnHomeNewWork').onclick = createAndOpenNewWork;
    $('homeSortSelect').onchange = (e) => { state.homeSort = e.target.value; renderHomeGallery(main); };
    if ($('btnHomeSyncDel')) {
      $('btnHomeSyncDel').onclick = async () => {
        try {
          toast('GitHub 원격 삭제 반영 중...');
          const cnt = await flushDeletedToGitHub();
          renderMain();
          toast(cnt ? `GitHub에서 ${cnt}개 작품을 삭제했습니다.` : '원격 삭제 대기열을 정리했습니다.');
        } catch (e) { toast(e.message); }
      };
    }
    $('homeSearchInput').oninput = (e) => {
      state.homeQuery = e.target.value;
      const pos = e.target.selectionStart;
      renderHomeGallery(main);
      const inp = $('homeSearchInput');
      if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
    };
    $('btnClearHomeSearch').onclick = () => { state.homeQuery = ''; renderHomeGallery(main); $('homeSearchInput')?.focus(); };
    $('homeFilterPills').onclick = (e) => {
      const btn = e.target.closest('[data-hfilter]');
      if (btn) { state.homeFilter = btn.dataset.hfilter; renderHomeGallery(main); }
    };
    if ($('homeTagPills')) {
      $('homeTagPills').onclick = (e) => {
        const btn = e.target.closest('[data-htag]');
        if (btn) { state.homeTag = state.homeTag === btn.dataset.htag ? '' : btn.dataset.htag; renderHomeGallery(main); }
      };
    }
    if ($('btnResetHomeFilter')) {
      $('btnResetHomeFilter').onclick = () => { state.homeQuery = ''; state.homeFilter = 'all'; state.homeTag = ''; renderHomeGallery(main); };
    }

    $('galleryGrid').onclick = (e) => {
      const menuBtn = e.target.closest('[data-gmenu]');
      if (menuBtn) { e.stopPropagation(); return openGalleryQuickMenu(menuBtn, menuBtn.dataset.gmenu); }
      const tagLink = e.target.closest('[data-pick-tag]');
      if (tagLink) {
        e.stopPropagation();
        state.homeTag = state.homeTag === tagLink.dataset.pickTag ? '' : tagLink.dataset.pickTag;
        return renderHomeGallery(main);
      }
      const card = e.target.closest('[data-open-work]');
      if (card) enterWork(card.dataset.openWork, 'charInfo');
    };

    // Async parallel thumbnail loading without layout shift
    items.forEach(async ({ work: w }) => {
      const src = await getWorkThumbSrc(w);
      if (!src) return;
      const slot = main.querySelector(`[data-thumb-slot="${w.id}"]`);
      if (!slot) return;
      const empty = slot.querySelector('.gallery-thumb-empty');
      if (empty) {
        const img = Object.assign(document.createElement('img'), { src, alt: w.title || '', loading: 'lazy' });
        empty.replaceWith(img);
      }
    });
  }

  function openGalleryQuickMenu(anchor, workId) {
    const work = state.works.find(w => w.id === workId);
    if (!work) return;
    const menu = showDropdown(anchor, `
      <button class="dd-item" id="gqPin"><span>${work.pinned ? '상단 고정 해제' : '상단 고정'}</span>${ICONS.pin}</button>
      <button class="dd-item" id="gqDup"><span>작품 복제</span>${ICONS.copy}</button>
      <div class="dd-sep"></div>
      <div class="dd-label">즉시 내보내기</div>
      <button class="dd-item" id="gqTxt"><span>전체 TXT 내보내기</span>${ICONS.download}</button>
      <button class="dd-item" id="gqCsv"><span>로어북 CSV 내보내기</span>${ICONS.table}</button>
      <div class="dd-sep"></div>
      <button class="dd-item" id="gqPush" style="color:var(--accent);font-weight:600;"><span>GitHub 단독 푸시</span>${ICONS.cloud}</button>
      <button class="dd-item" id="gqDel" style="color:var(--danger);"><span>작품 삭제</span>${ICONS.trash}</button>`);

    menu.querySelector('#gqPin').onclick = async () => {
      closeDropdown();
      work.pinned = !work.pinned;
      await idb('works', 'put', work);
      renderMain();
      toast(work.pinned ? '작품을 상단에 고정했습니다.' : '상단 고정을 해제했습니다.');
    };
    menu.querySelector('#gqDup').onclick = async () => { closeDropdown(); await duplicateWork(work); };
    menu.querySelector('#gqTxt').onclick = () => { closeDropdown(); exportWorkTxt(work); };
    menu.querySelector('#gqCsv').onclick = () => { closeDropdown(); exportLorebookCsv(work); };
    menu.querySelector('#gqPush').onclick = async () => {
      closeDropdown();
      try { toast(`'${work.title || '제목 없음'}' GitHub 푸시 중...`); await pushWorkToGitHub(work); toast('GitHub 단독 푸시 완료!'); }
      catch (e) { toast(e.message); }
    };
    menu.querySelector('#gqDel').onclick = async () => { closeDropdown(); await deleteWorkById(work.id); };
  }

      scheduleWorkSave(work); renderSidebar();

      return;
    }

    list.innerHTML = folder.items.map(it => {
      if (state.editingCardIds.has(it.id)) {
        return `
          <div class="item-card">
            <div class="card-edit-box">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                <input class="form-input" data-field="title" data-id="${it.id}" value="${escHtml(it.title)}" placeholder="항목 제목" style="flex:1;height:30px;font-weight:600;" />
                <button class="btn btn-primary btn-xs" data-act="done" data-id="${it.id}">${ICONS.check}<span>완료</span></button>
              </div>
              ${isLore ? `<input class="form-input" data-field="keywords" data-id="${it.id}" value="${escHtml(it.keywords || '')}" placeholder="키워드 (쉼표 구분)" style="height:29px;font-size:12.5px;" />` : ''}
              <textarea class="card-edit-textarea" ${isLore ? '' : 'style="min-height:220px;"'} data-field="content" data-id="${it.id}" placeholder="${isLore ? '로어북 내용 (마크다운 강조 지원)' : '프롬프트 내용'}">${escHtml(it.content || '')}</textarea>
            </div>
          </div>`;
      }
      const kws = isLore ? splitCsv(it.keywords) : [];
      const len = (it.content || '').length;
      return `
        <div class="item-card">
          <div class="card-head">
            <div class="card-head-top">
              <span class="card-title">${escHtml(it.title)}</span>
              ${isLore ? '' : `<span style="font-size:11.5px;color:var(--text-faint);margin-right:6px;">${fmtNum(len)}자 · ${fmtNum(estimateTokens(it.content))}토큰</span>`}

                <button class="tree-mini-btn" data-act="copy" data-id="${it.id}" title="복사">${ICONS.copy}</button>
                <button class="tree-mini-btn" data-act="edit" data-id="${it.id}" title="${isLore ? '카드에서 편집' : '바로 편집'}">${ICONS.edit}</button>
                <button class="tree-mini-btn" data-act="open" data-id="${it.id}" title="전체 에디터로 열기">${ICONS.external}</button>
                <button class="tree-mini-btn" data-act="del" data-id="${it.id}" title="삭제">${ICONS.trash}</button>

            ${isLore ? `<div class="card-kw-list">${kws.length ? kws.map(k => `<span class="kw-pill">${escHtml(k)}</span>`).join('') : '<span class="kw-pill empty">키워드 없음</span>'}</div>` : ''}

    const rerender = () => renderCardsView(main, work, folder, isLore);

      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const { act, id } = btn.dataset;
      const it = folder.items.find(x => x.id === id);
      if (!it) return;
      if (act === 'copy') copyText(it.content || '', `'${it.title}' 복사 완료`);
      else if (act === 'edit') { state.editingCardIds.add(id); rerender(); }
      else if (act === 'done') { state.editingCardIds.delete(id); renderSidebar(); renderStatusbar(); rerender(); }
      else if (act === 'open') { state.activeFolderId = folder.id; state.activeItemId = id; state.viewMode = 'editor'; renderAll(); }

        folder.items = folder.items.filter(x => x.id !== id);
        scheduleWorkSave(work); renderSidebar(); renderStatusbar(); rerender();
      }

    list.oninput = (e) => {
      const { field, id } = e.target.dataset || {};
      if (!field || !id) return;
      const it = folder.items.find(x => x.id === id);
      if (!it) return;
      it[field] = e.target.value;
      scheduleWorkSave(work);
      if (field === 'content') renderStatusbar();
    };
  }

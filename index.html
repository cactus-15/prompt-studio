  function openFolderMenu(anchor, folder) {
    if (!folder) return;
    const work = getActiveWork(), branch = getActiveBranch(work);
    const html = `
      <button class="dd-item" id="ddRenameF"><span>폴더 이름/유형 변경</span>${ICONS.edit}</button>
      <button class="dd-item" id="ddDelF" style="color:var(--danger);"><span>폴더 삭제</span>${ICONS.trash}</button>
    `;
    const menu = showDropdown(anchor, html);
    menu.querySelector('#ddRenameF').onclick = () => {
      closeDropdown();
      openSimpleFormModal('폴더 설정', [
        { id: 'name', label: '폴더 이름', value: folder.name },
        { id: 'kind', label: '폴더 유형', type: 'select', value: folder.kind, options: [
          { value: 'text', label: '텍스트 폴더 (한 줄 카드 보기 · 토큰 합산)' },
          { value: 'lorebook', label: '로어북 폴더 (그리드 카드 보기 · CSV 내보내기)' },
          { value: 'code', label: '코드 폴더 (HTML/JSX · 작품 토큰 제외)' }
        ]}
      ], (vals) => {
        if (!vals.name.trim()) return;
        folder.name = vals.name.trim();
        folder.kind = vals.kind;
        scheduleWorkSave(work);
        renderAll();
      });
    };
    menu.querySelector('#ddDelF').onclick = () => {
      closeDropdown();
      if (!confirm(`'${folder.name}' 폴더와 하위 항목을 모두 삭제할까요?`)) return;
      branch.folders = branch.folders.filter(f => f.id !== folder.id);
      if (state.activeFolderId === folder.id) state.viewMode = 'charInfo';
      scheduleWorkSave(work);
      renderAll();
    };
  }

  function openItemMenu(anchor, folder, item) {
    const work = getActiveWork();
    const html = `
      <button class="dd-item" id="ddDupI"><span>항목 복제</span>${ICONS.copy}</button>
      <button class="dd-item" id="ddDelI" style="color:var(--danger);"><span>항목 삭제</span>${ICONS.trash}</button>
    `;
    const menu = showDropdown(anchor, html);
    menu.querySelector('#ddDupI').onclick = () => {
      closeDropdown();
      const copy = { ...JSON.parse(JSON.stringify(item)), id: uid('itm'), title: `${item.title} (사본)` };
      folder.items.push(copy);
      scheduleWorkSave(work);
      renderSidebar();
    };
    menu.querySelector('#ddDelI').onclick = () => {
      closeDropdown();
      if (!confirm(`'${item.title}' 항목을 삭제할까요?`)) return;
      folder.items = folder.items.filter(x => x.id !== item.id);
      if (state.activeItemId === item.id) state.viewMode = 'charInfo';
      scheduleWorkSave(work);
      renderAll();
    };
  }

  function openSimpleFormModal(title, fields, onSubmit) {
    document.getElementById('formModalTitle').textContent = title;
    const body = document.getElementById('formModalBody');
    body.innerHTML = fields.map(f => {
      if (f.type === 'select') {
        return `<div class="form-row"><label>${escHtml(f.label)}</label><select class="form-select" id="fm_${f.id}">${f.options.map(o => `<option value="${o.value}" ${o.value === f.value ? 'selected' : ''}>${escHtml(o.label)}</option>`).join('')}</select></div>`;
      }
      return `<div class="form-row"><label>${escHtml(f.label)}</label><input class="form-input" id="fm_${f.id}" value="${escHtml(f.value || '')}" placeholder="${escHtml(f.placeholder || '')}" /></div>`;
    }).join('');
    document.getElementById('modalForm').classList.add('open');
    document.getElementById('formModalSubmit').onclick = () => {
      const vals = {};
      fields.forEach(f => { vals[f.id] = document.getElementById(`fm_${f.id}`).value; });
      document.getElementById('modalForm').classList.remove('open');
      onSubmit(vals);
    };
  }

  /* ================= EXPORT (CSV & TXT) ================= */
  function csvCell(v = '') {
    const s = String(v).replace(/"/g, '""');
    return `"${s}"`;
  }

  function exportLorebookCsv(work, specificFolder = null) {
    const branch = getActiveBranch(work);
    const folders = specificFolder ? [specificFolder] : branch.folders.filter(f => f.kind === 'lorebook');
    const rows = ['키워드,내용'];
    for (const f of folders) {
      for (const it of f.items) {
        rows.push(`${csvCell(it.keywords || it.title)},${csvCell(it.content || '')}`);
      }
    }
    if (rows.length === 1) { toast('내보낼 로어북 항목이 없습니다.'); return; }
    downloadFile(`${work.title || 'lorebook'}_lorebook.csv`, '\uFEFF' + rows.join('\r\n'), 'text/csv;charset=utf-8');
    toast('로어북 CSV를 내보냈습니다.');
  }

  function exportWorkTxt(work) {
    const branch = getActiveBranch(work);
    const out = [
      `제목: ${work.title || ''}`,
      `소개: ${work.summary || ''}`,
      `태그: ${(work.tags || []).join(', ')}`,
      `분기: ${branch.name}`,
      '========================================'
    ];
    for (const f of branch.folders) {
      out.push(`\n## [${f.name}]`);
      for (const it of f.items) {
        out.push(`\n### ${it.title}`);
        if (it.keywords) out.push(`키워드: ${it.keywords}`);
        out.push(it.content || '');
      }
    }
    downloadFile(`${work.title || 'work'}_${branch.name}.txt`, out.join('\n'));
    toast('작품 전체 TXT를 내보냈습니다.');
  }

  /* ================= GITHUB SYNC (JSON + assets/ + Encryption) ================= */
  async function ensureMasterPass() {
    if (state.masterPass) return state.masterPass;
    const p = prompt('암호화/복호화에 사용할 마스터 비밀번호를 입력하세요:');
    if (!p) throw new Error('비밀번호가 필요합니다.');
    state.masterPass = p;
    persistConfig();
    return p;
  }

  async function pushWorkToGitHub(work) {
    // 1. Upload profile asset to assets/ if dirty
    if (work.profile?.assetPath) {
      const assetRec = await idbGet('assets', work.profile.assetPath);
      if (assetRec && assetRec.dirty && assetRec.dataUrl) {
        const b64 = assetRec.dataUrl.split(',')[1];
        await ghPutFile(work.profile.assetPath, b64, `Update asset ${work.profile.assetPath}`);
        assetRec.dirty = false;
        await idbPut('assets', assetRec);
      }
    }
    // 2. Upload work JSON (plain or encrypted)
    let payload = work;
    if (work.encrypted) {
      const pass = await ensureMasterPass();
      payload = await encryptObj(work, pass);
    }
    const contentB64 = utf8ToB64(JSON.stringify(payload, null, 2));
    const msg = `Save ${work.encrypted ? '[Encrypted]' : (work.title || work.id)} (${new Date().toLocaleString('ko-KR')})`;
    await ghPutFile(`works/${work.id}.json`, contentB64, msg);
    await saveLocalSnapshot(work, 'GitHub 저장 시점');
    state.dirtyWorkIds.delete(work.id);
    updateTopbarStatusDot();
  }

  async function pullAllFromGitHub() {
    const branch = state.config.branch || 'main';
    const list = await ghGetFile('works', branch);
    if (!Array.isArray(list)) {
      toast('원격 레포에 works/ 폴더가 아직 없습니다.');
      return;
    }
    const jsonFiles = list.filter(f => f.type === 'file' && f.name.endsWith('.json'));
    let loaded = 0;
    for (const f of jsonFiles) {
      const file = await ghGetFile(`works/${f.name}`, branch);
      if (!file || !file.content) continue;
      let obj = JSON.parse(b64ToUtf8(file.content));
      if (obj.__encrypted) {
        const pass = await ensureMasterPass();
        obj = await decryptObj(obj, pass);
      }
      await idbPut('works', obj);
      const idx = state.works.findIndex(w => w.id === obj.id);
      if (idx >= 0) state.works[idx] = obj; else state.works.push(obj);
      state.dirtyWorkIds.delete(obj.id);
      loaded++;
    }
    if (state.works.length && !state.works.find(w => w.id === state.activeWorkId)) {
      state.activeWorkId = state.works[0].id;
    }
    renderAll();
    toast(`GitHub에서 ${loaded}개 작품을 불러왔습니다.`);
  }

  /* ================= HISTORY & DIFF MODAL ================= */
  function flattenWorkText(work) {
    const br = getActiveBranch(work);
    const lines = [`제목: ${work.title || ''}`, `소개: ${work.summary || ''}`, `태그: ${(work.tags || []).join(', ')}`];
    for (const f of (br?.folders || [])) {
      lines.push(`\n[${f.name}]`);
      for (const it of f.items) {
        lines.push(`--- ${it.title} ---`);
        if (it.keywords) lines.push(`키워드: ${it.keywords}`);
        lines.push(it.content || '');
      }
    }
    return lines.join('\n');
  }

  function renderSimpleDiff(oldText, newText) {
    const a = oldText.split('\n'), b = newText.split('\n');
    const maxLen = Math.max(a.length, b.length);
    const out = [];
    for (let i = 0; i < maxLen; i++) {
      const la = a[i], lb = b[i];
      if (la === lb) {
        if (la !== undefined) out.push(`<span class="diff-same">  ${escHtml(la)}</span>`);
      } else {
        if (la !== undefined) out.push(`<span class="diff-del">- ${escHtml(la)}</span>`);
        if (lb !== undefined) out.push(`<span class="diff-add">+ ${escHtml(lb)}</span>`);
      }
    }
    return out.join('') || '<span class="diff-same">변경 사항이 없습니다.</span>';
  }

  async function openHistoryModal() {
    const work = getActiveWork();
    if (!work) return;
    selectedHistoryPayload = null;
    document.getElementById('btnRestoreVersion').disabled = true;
    document.getElementById('diffTitle').textContent = '버전을 선택하세요';
    document.getElementById('diffOutput').textContent = '로컬 스냅샷과 GitHub 커밋 이력을 불러오는 중...';
    document.getElementById('modalHistory').classList.add('open');

    const entries = [];
    // Local snapshots
    const snaps = (await idbGetAll('snapshots')).filter(s => s.workId === work.id)
      .sort((a, b) => b.createdAt - a.createdAt);
    for (const s of snaps) {
      entries.push({ source: '로컬', label: s.note, date: new Date(s.createdAt).toLocaleString('ko-KR'), data: s.data });
    }
    // GitHub commits if configured
    if (state.config.owner && state.config.repo && state.config.token) {
      try {
        const commits = await ghRequest(`commits?path=works/${work.id}.json&per_page=15`);
        for (const c of commits) {
          entries.push({
            source: 'GitHub',
            label: c.commit.message,
            date: new Date(c.commit.author.date).toLocaleString('ko-KR'),
            sha: c.sha
          });
        }
      } catch {}
    }

    const listEl = document.getElementById('historyList');
    if (!entries.length) {
      listEl.innerHTML = '<div style="padding:16px;color:var(--text-muted);font-size:12.5px;">저장된 이전 이력이 아직 없습니다.</div>';
      document.getElementById('diffOutput').textContent = 'GitHub 저장 시 자동으로 버전 이력이 기록됩니다.';
      return;
    }

    listEl.innerHTML = entries.map((e, idx) => `
      <div class="history-item" data-hidx="${idx}">
        <div style="font-size:11px;font-weight:600;color:var(--accent);">${e.source} · ${escHtml(e.date)}</div>
        <div style="font-size:12.5px;margin-top:2px;color:var(--text);">${escHtml(e.label)}</div>
      </div>`).join('');

    listEl.querySelectorAll('.history-item').forEach(el => {
      el.onclick = async () => {
        listEl.querySelectorAll('.history-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        const entry = entries[Number(el.dataset.hidx)];
        document.getElementById('diffOutput').textContent = '버전 데이터를 불러오는 중...';
        try {
          let oldWork = entry.data;
          if (!oldWork && entry.sha) {
            const file = await ghGetFile(`works/${work.id}.json`, entry.sha);
            let obj = JSON.parse(b64ToUtf8(file.content));
            if (obj.__encrypted) {
              const pass = await ensureMasterPass();
              obj = await decryptObj(obj, pass);
            }
            oldWork = obj;
          }
          selectedHistoryPayload = oldWork;
          document.getElementById('diffTitle').textContent = `${entry.source} (${entry.date}) vs 현재`;
          document.getElementById('diffOutput').innerHTML = renderSimpleDiff(flattenWorkText(oldWork), flattenWorkText(work));
          document.getElementById('btnRestoreVersion').disabled = false;
        } catch (err) {
          document.getElementById('diffOutput').textContent = `불러오기 실패: ${err.message}`;
        }
      };
    });
  }

  /* ================= RENDER ALL & GLOBAL EVENTS ================= */
  function renderAll() {
    document.documentElement.setAttribute('data-theme', state.theme);
    renderTopbar();
    renderSidebar();
    renderMain();
  }

  function bindGlobalEvents() {
    document.getElementById('closeSettingsIcon').innerHTML = ICONS.close;
    document.getElementById('closeHistoryIcon').innerHTML = ICONS.close;
    document.getElementById('closeFormIcon').innerHTML = ICONS.close;

    document.getElementById('btnToggleSidebar').onclick = () => {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      renderSidebar();
    };
    document.getElementById('sidebarBackdrop').onclick = () => {
      state.sidebarCollapsed = true;
      renderSidebar();
    };

    document.getElementById('btnWorkMenu').onclick = (e) => { e.stopPropagation(); openWorkMenu(e.currentTarget); };
    document.getElementById('btnBranchMenu').onclick = (e) => { e.stopPropagation(); openBranchMenu(e.currentTarget); };
    document.getElementById('btnHistory').onclick = openHistoryModal;

    document.getElementById('btnEncryptToggle').onclick = () => {
      const w = getActiveWork();
      if (!w) return;
      w.encrypted = !w.encrypted;
      scheduleWorkSave(w);
      renderTopbar();
      toast(w.encrypted ? '이 작품은 GitHub에 암호화되어 저장됩니다.' : '이 작품은 평문 JSON으로 저장됩니다.');
    };

    document.getElementById('btnTheme').onclick = () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('ps_theme', state.theme);
      renderAll();
    };

    document.getElementById('btnSettings').onclick = () => {
      document.getElementById('cfgOwner').value = state.config.owner || '';
      document.getElementById('cfgRepo').value = state.config.repo || '';
      document.getElementById('cfgBranch').value = state.config.branch || 'main';
      document.getElementById('cfgToken').value = state.config.token || '';
      document.getElementById('cfgPass').value = state.masterPass || '';
      document.getElementById('cfgRememberPass').checked = !!state.config.rememberPass;
      document.getElementById('modalSettings').classList.add('open');
    };

    document.getElementById('btnSaveSettings').onclick = () => {
      state.config.owner = document.getElementById('cfgOwner').value.trim();
      state.config.repo = document.getElementById('cfgRepo').value.trim();
      state.config.branch = document.getElementById('cfgBranch').value.trim() || 'main';
      state.config.token = document.getElementById('cfgToken').value.trim();
      state.config.rememberPass = document.getElementById('cfgRememberPass').checked;
      state.masterPass = document.getElementById('cfgPass').value;
      persistConfig();
      document.getElementById('modalSettings').classList.remove('open');
      renderTopbar();
      toast('연동 설정을 저장했습니다.');
    };

    document.getElementById('btnGitSave').onclick = async () => {
      const w = getActiveWork();
      if (!w) return;
      try {
        toast('GitHub에 저장 중...');
        await pushWorkToGitHub(w);
        toast('GitHub 저장 완료!');
      } catch (e) {
        toast(e.message);
      }
    };

    document.getElementById('btnPushAll').onclick = async () => {
      try {
        toast('모든 작품을 GitHub에 올리는 중...');
        for (const w of state.works) await pushWorkToGitHub(w);
        toast(`총 ${state.works.length}개 작품 업로드 완료!`);
      } catch (e) {
        toast(e.message);
      }
    };

    document.getElementById('btnPullAll').onclick = async () => {
      try {
        await pullAllFromGitHub();
        document.getElementById('modalSettings').classList.remove('open');
      } catch (e) {
        toast(e.message);
      }
    };

    document.getElementById('btnRestoreVersion').onclick = async () => {
      if (!selectedHistoryPayload) return;
      if (!confirm('선택한 과거 버전으로 현재 작품을 덮어쓸까요?')) return;
      const idx = state.works.findIndex(w => w.id === selectedHistoryPayload.id);
      if (idx >= 0) {
        state.works[idx] = JSON.parse(JSON.stringify(selectedHistoryPayload));
        await idbPut('works', state.works[idx]);
        state.dirtyWorkIds.add(state.works[idx].id);
        document.getElementById('modalHistory').classList.remove('open');
        state.viewMode = 'charInfo';
        renderAll();
        toast('선택한 버전으로 복구했습니다.');
      }
    };

    // Sidebar actions
    document.getElementById('searchInput').oninput = (e) => {
      state.searchQuery = e.target.value;
      renderSidebar();
    };
    document.getElementById('segCurrent').onclick = () => { state.searchScope = 'current'; renderSidebar(); };
    document.getElementById('segAll').onclick = () => { state.searchScope = 'all'; renderSidebar(); };

    document.getElementById('btnAddFolder').onclick = () => {
      const work = getActiveWork(), branch = getActiveBranch(work);
      if (!branch) return;
      openSimpleFormModal('새 폴더 추가', [
        { id: 'name', label: '폴더 이름', placeholder: '예: NPC 설정, 시스템 프롬프트' },
        { id: 'kind', label: '폴더 유형', type: 'select', value: 'text', options: [
          { value: 'text', label: '텍스트 폴더 (한 줄 카드 보기 · 토큰 합산)' },
          { value: 'lorebook', label: '로어북 폴더 (그리드 카드 보기 · CSV 내보내기)' },
          { value: 'code', label: '코드 폴더 (HTML/JSX · 작품 토큰 제외)' }
        ]}
      ], (vals) => {
        if (!vals.name.trim()) return;
        branch.folders.push({ id: uid('fld'), name: vals.name.trim(), kind: vals.kind, collapsed: false, items: [] });
        scheduleWorkSave(work);
        renderSidebar();
      });
    };

    document.getElementById('btnExportCsv').onclick = () => {
      const w = getActiveWork();
      if (w) exportLorebookCsv(w);
    };
    document.getElementById('btnExportTxt').onclick = () => {
      const w = getActiveWork();
      if (w) exportWorkTxt(w);
    };

    // Close modals & dropdowns
    document.querySelectorAll('[data-close-modal]').forEach(b => {
      b.onclick = () => document.getElementById(b.dataset.closeModal).classList.remove('open');
    });
    document.querySelectorAll('.modal-backdrop').forEach(mb => {
      mb.onclick = (e) => { if (e.target === mb) mb.classList.remove('open'); };
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown-menu')) closeDropdown();
    });

    // Global shortcut Ctrl+Shift+F
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        state.sidebarCollapsed = false;
        renderSidebar();
        document.getElementById('searchInput').focus();
      }
    });
  }

  /* ================= BOOTSTRAP ================= */
  async function init() {
    loadConfig();
    bindGlobalEvents();
    const works = await idbGetAll('works');
    if (works.length) {
      state.works = works.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    } else {
      const sample = createWorkObject({
        title: '엘레멘시아 아카데미',
        summary: '두근두근 마법학원 시뮬레이션',
        tags: ['판타지', '학원물', 'GM'],
        withSample: true
      });
      state.works = [sample];
      await idbPut('works', sample);
    }
    state.activeWorkId = state.works[0].id;
    state.viewMode = 'charInfo';
    renderAll();
  }

  init();
})();
</script>

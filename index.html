      grid.classList.toggle('is-vertical', isVertical);
      grid.innerHTML = items.length ? items.map(({ work: w, stats }) => {
        const tags = w.tags || [], shownTags = tags.slice(0, 3), extraTags = tags.length - shownTags.length;
        const initial = (w.title || 'W').trim().charAt(0).toUpperCase();
        return `
          <article class="gallery-card" data-open-work="${w.id}">
            <div class="gallery-thumb" data-thumb-slot="${w.id}">
              <div class="gallery-thumb-empty"><span class="gallery-thumb-letter">${escHtml(initial)}</span></div>
              ${w.pinned ? `<div class="g-badge-tl"><span class="g-badge g-badge-pin" title="고정됨">${ICONS.pin}</span></div>` : ''}
              <div class="g-badge-tr">
                ${w.encrypted ? `<span class="g-badge g-badge-enc" title="암호화">${ICONS.lock}<span>암호화</span></span>` : ''}
                <span class="g-badge g-badge-status ${w.dirty ? 'wip' : 'synced'}"><span class="s-dot"></span><span>${w.dirty ? '제작중' : '배포 완료'}</span></span>
              </div>
              <div class="g-badge-br">
                <span class="g-badge g-badge-branch" title="플랫폼 분기 수">${ICONS.branch}<span>${w.branches?.length || 1}</span></span>
              </div>
            </div>
            <div class="gallery-meta">
              <div class="gallery-title-row">
                <div class="gallery-title">${escHtml(w.title || '제목 없음')}</div>
                <button type="button" class="tree-mini-btn" data-gmenu="${w.id}" title="작품 메뉴">${ICONS.moreV}</button>
              </div>
              <div class="gallery-summary">${escHtml(w.summary || ' ')}</div>
              <div class="gallery-tags">${shownTags.map(t => `<span class="gallery-tag-link" data-pick-tag="${escHtml(t)}">#${escHtml(t)}</span>`).join('')}${extraTags > 0 ? `<span>+${extraTags}</span>` : ''}</div>
              <div class="gallery-foot-sub">
                <span>${fmtShort(stats.tokens)} 토큰</span><span>·</span>
                <span title="생성일">${new Date(getWorkCreatedAt(w) || Date.now()).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}</span>
              </div>
            </div>
          </article>`;
      }).join('') : `
        <div style="grid-column:1/-1;padding:64px 20px;text-align:center;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;gap:12px;">
          <div>${state.works.length ? '조건에 맞는 작품이 없습니다.' : '등록된 작품이 없습니다. 새 작품을 만들어 보세요.'}</div>
          ${state.works.length ? '<button class="btn btn-sm" id="btnResetHomeFilter">필터 초기화</button>' : ''}
        </div>`;

      const applySquareFit = (slot, img, pos) => {
        if (!slot.isConnected || slot.classList.contains('is-square-fit')) return;
        slot.classList.add('is-square-fit');
        const blur = Object.assign(document.createElement('img'), { className: 'gallery-img-blur', src: img.src, alt: '' });
        blur.setAttribute('aria-hidden', 'true');
        blur.style.objectPosition = pos;
        slot.insertBefore(blur, img);
      };

      items.forEach(async ({ work: w }) => {
        const src = await getWorkThumbSrc(w);
        const slot = src && grid.querySelector(`[data-thumb-slot="${w.id}"]`);
        const empty = slot?.querySelector('.gallery-thumb-empty');
        if (!empty) return;
        const pos = getProfilePos(w);
        const img = Object.assign(document.createElement('img'), {
          className: 'gallery-img-main', src, alt: w.title || '', loading: 'lazy'
        });
        img.style.objectPosition = pos;
        empty.replaceWith(img);
        if (!isVertical) return;
        const cached = state.imgSquareCache.get(src);
        if (cached === true) {
          applySquareFit(slot, img, pos);
        } else if (cached === undefined) {
          const checkFit = () => {
            if (!img.naturalWidth || !img.naturalHeight) return;
            const sq = img.naturalHeight <= img.naturalWidth * 1.05;
            state.imgSquareCache.set(src, sq);
            if (sq) applySquareFit(slot, img, pos);
          };
          if (img.complete && img.naturalWidth) checkFit();
          else img.onload = checkFit;
        }
      });
    };

    $('btnHomeNewWork').onclick = createAndOpenNewWork;
    $('homeSortSelect').onchange = (e) => { state.homeSort = e.target.value; renderGrid(); };
    if ($('btnHomeSyncDel')) {
      $('btnHomeSyncDel').onclick = async () => {
        if (state.isSyncing) return;
        state.isSyncing = true;
        try {
          toast('GitHub 원격 삭제 반영 중...');
          const cnt = await flushDeletedToGitHub();
          toast(cnt ? `GitHub에서 ${cnt}개 작품을 삭제했습니다.` : '원격 삭제 대기열을 정리했습니다.');
        } catch (e) { toast(e.message); }
        finally { state.isSyncing = false; renderMain(); }
      };
    }
    $('homeSearchInput').oninput = (e) => { state.homeQuery = e.target.value; renderGrid(); };
    $('btnClearHomeSearch').onclick = () => { state.homeQuery = $('homeSearchInput').value = ''; renderGrid(); $('homeSearchInput').focus(); };
    $('homeFilterPills').onclick = (e) => {
      const btn = e.target.closest('[data-hfilter]');
      if (btn) { state.homeFilter = btn.dataset.hfilter; renderGrid(); }
    };
    if ($('homeTagPills')) {
      $('homeTagPills').onclick = (e) => {
        const btn = e.target.closest('[data-htag]');
        if (btn) { state.homeTag = state.homeTag === btn.dataset.htag ? '' : btn.dataset.htag; renderGrid(); }
      };
    }
    $('galleryGrid').onclick = (e) => {
      if (e.target.closest('#btnResetHomeFilter')) {
        state.homeQuery = $('homeSearchInput').value = '';
        state.homeFilter = 'all'; state.homeTag = '';
        return renderGrid();
      }
      const menuBtn = e.target.closest('[data-gmenu]');
      if (menuBtn) { e.stopPropagation(); return toggleDropdown(menuBtn, (a) => openGalleryQuickMenu(a, menuBtn.dataset.gmenu)); }
      const tagLink = e.target.closest('[data-pick-tag]');
      if (tagLink) {
        e.stopPropagation();
        state.homeTag = state.homeTag === tagLink.dataset.pickTag ? '' : tagLink.dataset.pickTag;
        return renderGrid();
      }
      const card = e.target.closest('[data-open-work]');
      if (card) enterWork(card.dataset.openWork, 'charInfo');
    };

    renderGrid();
    const hs = main.querySelector('.home-scroll');
    if (hs && prevScroll) hs.scrollTop = prevScroll;
  }

  function openGalleryQuickMenu(anchor, workId) {
    const work = state.works.find(w => w.id === workId);
    if (!work) return;
    const menu = showDropdown(anchor, `
      <button class="dd-item" id="gqPin"><span>${work.pinned ? '상단 고정 해제' : '상단 고정'}</span>${ICONS.pin}</button>
      <button class="dd-item" id="gqDup"><span>작품 복제</span>${ICONS.copy}</button>
      <div class="dd-sep"></div>
      <div class="dd-label">즉시 내보내기</div>
      <button class="dd-item" id="gqTxt"><span>전체 TXT 내보내기</span>${ICONS.download}</button>
      <button class="dd-item" id="gqCsv"><span>로어북 CSV 내보내기</span>${ICONS.table}</button>
      <div class="dd-sep"></div>
      <button class="dd-item" id="gqPush" style="color:var(--accent);font-weight:600;"><span>GitHub 단독 푸시</span>${ICONS.cloud}</button>
      <button class="dd-item" id="gqDel" style="color:var(--danger);"><span>작품 삭제</span>${ICONS.trash}</button>`);

    menu.querySelector('#gqPin').onclick = async () => {
      closeDropdown();
      work.pinned = !work.pinned;
      await idb('works', 'put', work);
      renderMain();
      toast(work.pinned ? '작품을 상단에 고정했습니다.' : '상단 고정을 해제했습니다.');
    };
    menu.querySelector('#gqDup').onclick = async () => { closeDropdown(); await duplicateWork(work); };
    menu.querySelector('#gqTxt').onclick = () => { closeDropdown(); exportWorkTxt(work); };
    menu.querySelector('#gqCsv').onclick = () => { closeDropdown(); exportLorebookCsv(work); };
    menu.querySelector('#gqPush').onclick = async () => {
      closeDropdown();
      try { toast(`'${work.title || '제목 없음'}' GitHub 푸시 중...`); await pushWorkToGitHub(work); toast('GitHub 단독 푸시 완료!'); }
      catch (e) { toast(e.message); }
    };
    menu.querySelector('#gqDel').onclick = async () => { closeDropdown(); await deleteWorkById(work.id); };
  }

  /* ================= CHARACTER INFO VIEW (1:1 PROFILE + TEMPLATES) ================= */
  function renderCharInfoView(main, work) {
    const titleLen = (work.title || '').length, sumLen = (work.summary || '').length;
    const { assetPath = '', externalUrl = '' } = work.profile || {};
    const branch = getActiveBranch(work);
    const defTpl = getDefaultTemplate();
    if (!state.selectedTemplateId || (state.selectedTemplateId !== BUILTIN_TPL_ID && !state.templates.some(t => t.id === state.selectedTemplateId))) {
      state.selectedTemplateId = defTpl?.id || state.templates[0]?.id || BUILTIN_TPL_ID;
    }

    main.innerHTML = `
      <div class="char-info-page">
        <div class="char-info-top">
          <div class="char-info-kicker">캐릭터 정보</div>
          <div class="char-info-heading">제목 · 소개 · 태그</div>
        </div>
        <div class="char-info-section">
          <div class="char-profile-row">
            <div class="profile-box" id="profilePreviewBox">${ICONS.image}<span style="font-size:12px;margin-top:6px;">1:1 프로필 이미지</span></div>
            <div class="profile-controls">
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <input type="file" id="profileFileInput" accept="image/*" style="display:none;" />
                <button class="btn btn-sm" id="btnUploadProfile">${ICONS.upload}<span>이미지 업로드</span></button>
                <button class="btn btn-ghost btn-sm" id="btnRemoveProfile">${ICONS.trash}<span>제거</span></button>
              </div>
              <div class="form-row" style="max-width:420px;">
                <label style="font-size:12px;color:var(--text-muted);">또는 외부 이미지 URL</label>
                <input class="form-input" id="profileUrlInput" value="${escHtml(externalUrl)}" placeholder="https://..." style="height:32px;font-size:12.5px;" />
              </div>
              <div class="profile-asset-note">${assetPath ? `에셋 경로: ${escHtml(assetPath)}` : (externalUrl ? '외부 URL 연결됨' : '업로드 시 레포의 assets/ 폴더에 1:1 썸네일로 분리 저장됩니다.')}</div>
            </div>
          </div>
        </div>
        <div class="char-info-section">
          <div class="field-label-row"><span class="field-label">제목</span><span class="field-counter ${titleLen > 30 ? 'over' : ''}" id="titleCounter">${titleLen} / 30자</span></div>
          <input class="field-input" id="charTitleInput" value="${escHtml(work.title || '')}" placeholder="작품 이름을 입력하세요" />
        </div>
        <div class="char-info-section">
          <div class="field-label-row"><span class="field-label">한 줄 소개</span><span class="field-counter ${sumLen > 35 ? 'over' : ''}" id="summaryCounter">${sumLen} / 35자</span></div>
          <input class="field-input" id="charSummaryInput" value="${escHtml(work.summary || '')}" placeholder="작품을 한 줄로 소개해 주세요" />
        </div>
        <div class="char-info-section">
          <div class="field-label-row"><span class="field-label">해시태그 (쉼표로 구분)</span><span class="field-counter" id="tagsCounter">${(work.tags || []).length}개</span></div>
          <input class="field-input" id="charTagsInput" value="${escHtml((work.tags || []).join(', '))}" placeholder="예: 학교, 도서관, 판타지" />
        </div>
        <div class="char-info-section" style="border-bottom:none;">
          <div class="field-label-row">
            <span class="field-label">${ICONS.layers}<span>프롬프트 템플릿</span></span>
            <span class="field-counter" id="tplDefaultLabel"></span>
          </div>
          <div class="tpl-box">
            <div class="tpl-controls-row">
              <select class="form-select tpl-select" id="tplSelect" aria-label="템플릿 선택"></select>
              <button class="btn btn-sm btn-primary" id="btnSaveTemplate">${ICONS.save}<span>템플릿 저장</span></button>
              <button class="btn btn-sm" id="btnApplyTemplate">${ICONS.refresh}<span>템플릿 불러오기</span></button>
              <button class="btn btn-sm" id="btnToggleDefaultTpl"></button>
              <button class="btn btn-ghost btn-sm" id="btnDeleteTemplate" style="color:var(--danger);">${ICONS.trash}<span>삭제</span></button>
            </div>
            <div class="tpl-summary-note" id="tplSummaryNote"></div>
          </div>
        </div>
      </div>`;

    const applyProfilePos = (x, y) => {
      const nx = Math.max(0, Math.min(100, Math.round(x)));
      const ny = Math.max(0, Math.min(100, Math.round(y)));
      const prev = work.profile?.pos;
      if (prev && prev.x === nx && prev.y === ny) return;
      work.profile = { ...(work.profile || { assetPath: '', externalUrl: '' }), pos: { x: nx, y: ny } };
      const posStr = `${nx}% ${ny}%`;
      const pImg = $('profilePreviewImg'), tImg = $('topWorkThumb')?.querySelector('img');
      if (pImg) pImg.style.objectPosition = posStr;
      if (tImg) tImg.style.objectPosition = posStr;
      scheduleWorkSave(work);
    };

    getWorkThumbSrc(work).then(src => {
      const box = $('profilePreviewBox');
      if (!src || !box) return;
      box.innerHTML = `<img id="profilePreviewImg" src="${escHtml(src)}" style="object-position:${getProfilePos(work)};" alt="profile" draggable="false" />`;
      const img = $('profilePreviewImg');
      let lastTap = { t: 0, x: 0, y: 0 };

      const setupDrag = () => {
        const nw = img.naturalWidth, nh = img.naturalHeight;
        if (!nw || !nh) return;
        const canX = nw > nh * 1.01, canY = nh > nw * 1.01;
        if (!canX && !canY) return;
        box.classList.add('has-img');
        if (!box.querySelector('.profile-drag-hint')) {
          box.insertAdjacentHTML('beforeend', '<span class="profile-drag-hint">드래그로 위치 조정</span>');
        }
        box.onpointerdown = (e) => {
          e.preventDefault();
          const sx = e.clientX, sy = e.clientY;
          const ox = work.profile?.pos?.x ?? 50, oy = work.profile?.pos?.y ?? 50;
          const rect = box.getBoundingClientRect();
          const divX = canX ? Math.max(24, rect.width * (nw / nh - 1)) : 1;
          const divY = canY ? Math.max(24, rect.height * (nh / nw - 1)) : 1;
          let moved = false;
          box.classList.add('is-dragging');
          box.setPointerCapture(e.pointerId);
          box.onpointermove = (ev) => {
            const dx = ev.clientX - sx, dy = ev.clientY - sy;
            if (!moved && Math.hypot(dx, dy) > 4) moved = true;
            if (moved) applyProfilePos(canX ? ox - (dx / divX) * 100 : ox, canY ? oy - (dy / divY) * 100 : oy);
          };
          box.onpointerup = box.onpointercancel = () => {
            box.classList.remove('is-dragging');
            box.onpointermove = box.onpointerup = box.onpointercancel = null;
            if (!moved) {
              const now = Date.now();
              if (now - lastTap.t < 340 && Math.hypot(sx - lastTap.x, sy - lastTap.y) < 20) {
                applyProfilePos(50, 50);
                lastTap.t = 0;
              } else {
                lastTap = { t: now, x: sx, y: sy };
              }
            }
          };
        };
      };
      if (img.complete && img.naturalWidth) setupDrag();
      else img.onload = setupDrag;
    });

    $('btnUploadProfile').onclick = () => $('profileFileInput').click();
    $('profileFileInput').onchange = async (e) => { if (e.target.files?.[0]) await saveProfileAsset(work, e.target.files[0]); };
    $('btnRemoveProfile').onclick = async () => {
      if (work.profile?.assetPath) { state.assetCache.delete(work.profile.assetPath); await idb('assets', 'delete', work.profile.assetPath); }
      work.profile = { assetPath: '', externalUrl: '' };
      scheduleWorkSave(work); renderTopbar(); renderMain();
      toast('프로필 이미지를 제거했습니다.');
    };
    $('profileUrlInput').onchange = (e) => {
      work.profile = { assetPath: '', externalUrl: e.target.value.trim() };
      scheduleWorkSave(work); renderTopbar(); renderMain();
    };

    const bindCounter = (inpId, cntId, max, prop, after) => {
      $(inpId).oninput = (e) => {
        work[prop] = e.target.value;
        const n = work[prop].length, c = $(cntId);
        c.textContent = `${n} / ${max}자`;
        c.classList.toggle('over', n > max);
        scheduleWorkSave(work);
        after?.();
      };
    };
    bindCounter('charTitleInput', 'titleCounter', 30, 'title', renderTopbar);
    bindCounter('charSummaryInput', 'summaryCounter', 35, 'summary');
    $('charTagsInput').oninput = (e) => {
      work.tags = splitCsv(e.target.value).map(s => s.replace(/^#/, '')).filter(Boolean);
      $('tagsCounter').textContent = `${work.tags.length}개`;
      scheduleWorkSave(work); renderSidebar();
    };

    /* Template Section Logic */
    const syncTemplateUI = () => {
      const activeDef = getDefaultTemplate();
      $('tplDefaultLabel').textContent = `새 작품 기본값: ${activeDef ? activeDef.name : '앱 기본 폴더'}`;

      const sel = $('tplSelect');
      sel.innerHTML = [
        ...state.templates.map(t => `<option value="${t.id}" ${t.id === state.selectedTemplateId ? 'selected' : ''}>${t.id === state.defaultTemplateId ? '★ ' : ''}${escHtml(t.name)}</option>`),
        `<option value="${BUILTIN_TPL_ID}" ${state.selectedTemplateId === BUILTIN_TPL_ID ? 'selected' : ''}>앱 기본 폴더 (초기값)</option>`
      ].join('');

      const cur = resolveTemplateById(state.selectedTemplateId);
      const isDef = !cur.isBuiltin && cur.id === state.defaultTemplateId;
      const defBtn = $('btnToggleDefaultTpl');
      defBtn.classList.toggle('hidden', cur.isBuiltin);
      defBtn.classList.toggle('btn-accent-soft', isDef);
      defBtn.innerHTML = `${ICONS.star}<span>${isDef ? '새 작품 기본값 해제' : '새 작품 기본값 지정'}</span>`;
      $('btnDeleteTemplate').classList.toggle('hidden', cur.isBuiltin);

      const folderList = cur.folders.map(f => `${f.name}(${(f.items || []).length})`).join(' · ');
      $('tplSummaryNote').innerHTML = `
        <div><strong>선택 템플릿 구성 (${cur.folders.length}개 폴더):</strong> ${escHtml(folderList || '빈 구조')}</div>
        <div style="margin-top:3px;color:var(--text-faint);">현재 분기(<strong>${escHtml(branch?.name || '')}</strong>)의 폴더·항목 구조를 템플릿으로 저장하거나 덮어씌울 수 있습니다.</div>`;
    };

    $('tplSelect').onchange = (e) => { state.selectedTemplateId = e.target.value; syncTemplateUI(); };

    $('btnSaveTemplate').onclick = () => {
      if (!branch) return;
      openSimpleFormModal('현재 구조를 템플릿으로 저장', [
        { id: 'name', label: '템플릿 이름 (같은 이름 입력 시 덮어쓰기)', value: `${work.title || '내 커스텀'} 템플릿`, placeholder: '예: 리루챗 기본 뼈대' },
        { id: 'mode', label: '저장 방식', type: 'select', value: 'full', options: [
          { value: 'full', label: '내용 포함 저장 (공통 규칙·상태창 등 유지)' },
          { value: 'skeleton', label: '구조만 저장 (폴더·항목 제목만, 내용 비움)' }
        ]},
        { id: 'setDefault', label: '새 작품 생성 시 기본 템플릿으로 자동 적용', type: 'checkbox', checked: true }
      ], ({ name, mode, setDefault }) => {
        const cleanName = name.trim();
        if (!cleanName) return toast('템플릿 이름을 입력해 주세요.');
        const folders = cloneFoldersFresh(branch.folders, mode === 'skeleton');
        const existing = state.templates.find(t => t.name === cleanName);
        let targetId;
        if (existing) {
          existing.folders = folders;
          existing.updatedAt = Date.now();
          targetId = existing.id;
        } else {
          const nt = { id: uid('tpl'), name: cleanName, folders, updatedAt: Date.now() };
          state.templates.unshift(nt);
          targetId = nt.id;
        }
        if (setDefault) state.defaultTemplateId = targetId;
        state.selectedTemplateId = targetId;
        persistTemplates();
        syncTemplateUI();
        toast(`'${cleanName}' 템플릿을 저장했습니다.${setDefault ? ' (새 작품 기본값 지정)' : ''}`);
      });
    };

    $('btnApplyTemplate').onclick = async () => {
      if (!branch) return;
      const target = resolveTemplateById(state.selectedTemplateId);
      if (!confirm(`현재 분기('${branch.name}')의 모든 폴더와 항목을\n'${target.name}' 구조로 덮어씌울까요?\n\n(덮어쓰기 전 현재 상태는 로컬 스냅샷에 자동 백업됩니다.)`)) return;
      await saveLocalSnapshot(work, `템플릿 덮어쓰기 직전 백업 (${branch.name})`);
      branch.folders = cloneFoldersFresh(target.folders);
      state.activeFolderId = null;
      state.activeItemId = null;
      scheduleWorkSave(work);
      renderSidebar();
      renderStatusbar();
      toast(`'${target.name}' 템플릿을 적용했습니다.`);
    };

    $('btnToggleDefaultTpl').onclick = () => {
      const cur = resolveTemplateById(state.selectedTemplateId);
      if (cur.isBuiltin) return;
      if (state.defaultTemplateId === cur.id) {
        state.defaultTemplateId = '';
        toast('새 작품 기본 템플릿 지정을 해제했습니다.');
      } else {
        state.defaultTemplateId = cur.id;
        toast(`이제 새 작품 생성 시 '${cur.name}' 템플릿으로 시작합니다.`);
      }
      persistTemplates();
      syncTemplateUI();
    };

    $('btnDeleteTemplate').onclick = () => {
      const cur = resolveTemplateById(state.selectedTemplateId);
      if (cur.isBuiltin || !confirm(`'${cur.name}' 템플릿을 삭제할까요?`)) return;
      state.templates = state.templates.filter(t => t.id !== cur.id);
      if (state.defaultTemplateId === cur.id) state.defaultTemplateId = '';
      state.selectedTemplateId = state.defaultTemplateId || state.templates[0]?.id || BUILTIN_TPL_ID;
      persistTemplates();
      syncTemplateUI();
      toast('템플릿을 삭제했습니다.');
    };

    syncTemplateUI();
    if (work._justCreated) { delete work._justCreated; setTimeout(() => $('charTitleInput')?.focus(), 40); }
  }

  /* Unified Card View (Lorebook Grid + Text Stacked Cards) */
  function renderCardsView(main, work, folder, isLore) {
    main.innerHTML = `
      <div class="main-header">
        <div class="breadcrumb">
          <span class="crumb-folder" title="${isLore ? '로어북 카드 보기' : '폴더 카드 보기'}">${isLore ? ICONS.grid : ICONS.rows}<span class="hide-xs">${isLore ? '로어북 카드 보기' : '폴더 카드 보기'}</span></span>
          <span class="crumb-sep">/</span>
          <strong class="crumb-folder-title" title="${escHtml(folder.name)}">${escHtml(folder.name)}</strong>
          <span class="crumb-count">(${folder.items.length}개)</span>
        </div>
        <div class="main-tools">
          <button class="btn btn-sm" id="btnCardAdd" title="${isLore ? '로어북 추가' : '항목 추가'}">${ICONS.plus}<span class="hide-xs">${isLore ? '로어북 추가' : '항목 추가'}</span></button>
          <button class="btn btn-sm" id="btnCardSubAction">${isLore ? `${ICONS.table}<span>CSV 내보내기</span>` : `${ICONS.copy}<span>폴더 전체 복사</span>`}</button>
        </div>
      </div>
      <div class="cards-scroll"><div class="${isLore ? 'lore-grid' : 'text-stack'}" id="cardsList"></div></div>`;

    $('btnCardAdd').onclick = () => {
      const it = mkItem(`${isLore ? '새 로어북' : '새 항목'} ${folder.items.length + 1}`, isLore ? 'lorebook' : 'text');
      folder.items.push(it);
      state.editingCardIds.add(it.id);
      scheduleWorkSave(work); renderSidebar(); renderCardsView(main, work, folder, isLore);
    };
    $('btnCardSubAction').onclick = () => {
      if (isLore) exportLorebookCsv(work, folder);
      else copyText(folder.items.map(it => `# ${it.title}\n${it.content || ''}`).join('\n\n---\n\n'), `'${folder.name}' 전체 내용을 복사했습니다.`);
    };

    const list = $('cardsList');
    if (!folder.items.length) {
      list.innerHTML = `<div style="padding:32px;color:var(--text-faint);font-size:13px;">${isLore ? '로어북 항목이 없습니다. 상단의 로어북 추가 버튼을 눌러보세요.' : '이 폴더에 항목이 없습니다.'}</div>`;
      return;
    }

    list.innerHTML = folder.items.map(it => {
      if (state.editingCardIds.has(it.id)) {
        return `
          <div class="item-card">
            <div class="card-edit-box">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                <input class="form-input" data-field="title" data-id="${it.id}" value="${escHtml(it.title)}" placeholder="항목 제목" style="flex:1;height:30px;font-weight:600;" />
                <button class="btn btn-primary btn-xs" data-act="done" data-id="${it.id}">${ICONS.check}<span>완료</span></button>
              </div>
              ${isLore ? `<input class="form-input" data-field="keywords" data-id="${it.id}" value="${escHtml(it.keywords || '')}" placeholder="키워드 (쉼표 구분)" style="height:29px;font-size:12.5px;" />` : ''}
              <textarea class="card-edit-textarea" ${isLore ? '' : 'style="min-height:220px;"'} data-field="content" data-id="${it.id}" placeholder="${isLore ? '로어북 내용 (마크다운 강조 지원)' : '프롬프트 내용'}">${escHtml(it.content || '')}</textarea>
            </div>
          </div>`;
      }
      const kws = isLore ? splitCsv(it.keywords) : [];
      return `
        <div class="item-card">
          <div class="card-head">
            <div class="card-head-top">
              <span class="card-title">${escHtml(it.title)}</span>
              ${isLore ? '' : `<span style="font-size:11.5px;color:var(--text-faint);margin-right:6px;">${fmtMetric(it.content)}</span>`}
              <div class="card-actions">
                <button class="tree-mini-btn" data-act="copy" data-id="${it.id}" title="복사">${ICONS.copy}</button>
                <button class="tree-mini-btn" data-act="edit" data-id="${it.id}" title="${isLore ? '카드에서 편집' : '바로 편집'}">${ICONS.edit}</button>
                <button class="tree-mini-btn" data-act="open" data-id="${it.id}" title="전체 에디터로 열기">${ICONS.external}</button>
                <button class="tree-mini-btn" data-act="del" data-id="${it.id}" title="삭제">${ICONS.trash}</button>
              </div>
            </div>
            ${isLore ? `<div class="card-kw-list">${kws.length ? kws.map(k => `<span class="kw-pill">${escHtml(k)}</span>`).join('') : '<span class="kw-pill empty">키워드 없음</span>'}</div>` : ''}
          </div>
          <div class="card-body">${renderMarkdownHighlightHtml(it.content)}</div>
        </div>`;
    }).join('');

    const rerender = () => renderCardsView(main, work, folder, isLore);
    list.onclick = (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const { act, id } = btn.dataset;
      const it = folder.items.find(x => x.id === id);
      if (!it) return;
      if (act === 'copy') copyText(it.content || '', `'${it.title}' 복사 완료`);
      else if (act === 'edit') { state.editingCardIds.add(id); rerender(); }
      else if (act === 'done') { state.editingCardIds.delete(id); renderSidebar(); renderStatusbar(); rerender(); }
      else if (act === 'open') { state.activeFolderId = folder.id; state.activeItemId = id; state.viewMode = 'editor'; renderAll(); }
      else if (act === 'del' && confirm(`'${it.title}' 항목을 삭제할까요?`)) {
        folder.items = folder.items.filter(x => x.id !== id);
        scheduleWorkSave(work); renderSidebar(); renderStatusbar(); rerender();
      }
    };
    list.oninput = (e) => {
      const { field, id } = e.target.dataset || {};
      const it = field && id && folder.items.find(x => x.id === id);
      if (!it) return;
      it[field] = e.target.value;
      scheduleWorkSave(work);
      if (field === 'content') renderStatusbar();
    };
  }

          <span class="lore-count" id="loreKwCount">${splitCsv(item.keywords).length}개</span>

      <div class="find-bar ${state.showEditorFind ? '' : 'hidden'}" id="editorFindBar">

            <span class="find-count" id="edFindCount"></span>
          </div>
          <div class="find-actions">
            <button type="button" class="tree-mini-btn" id="edFindPrev" title="이전 찾기 (Shift+Enter)">${ICONS.arrowUp}</button>
            <button type="button" class="tree-mini-btn" id="edFindNext" title="다음 찾기 (Enter)">${ICONS.arrowDown}</button>
            <button type="button" class="btn btn-ghost btn-xs ${state.showEditorReplace ? 'btn-accent-soft' : ''}" id="edToggleReplace" title="찾아바꾸기 (Ctrl+H)">바꾸기</button>
            <button type="button" class="tree-mini-btn" id="edFindClose" title="닫기 (Esc)">${ICONS.close}</button>
          </div>
        </div>
        <div class="find-row ${state.showEditorReplace ? '' : 'hidden'}" id="edReplaceRow">
          <input type="text" class="lore-input" id="edReplaceInput" value="${escHtml(state.editorReplaceText)}" placeholder="바꿀 내용 입력..." />
          <div class="find-actions">
            <button type="button" class="btn btn-xs" id="edReplaceOne">바꾸기</button>
            <button type="button" class="btn btn-xs btn-primary" id="edReplaceAll">모두 바꾸기</button>
          </div>
        </div>
      </div>
      <div class="editor-stage" id="editorStage">
        <div class="editor-pane" id="editorMount"></div>
        ${isCode && state.showPreview ? `
          <div class="split-resizer" id="splitResizer" title="드래그하여 크기 조절 (더블클릭 초기화)"></div>
          <div class="preview-pane" id="previewPane" style="--preview-w:${state.previewWidth}%;--preview-h:${state.previewHeight}%;">
            <div class="preview-head">
              <span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;">${ICONS.eye}<span>${item.type.toUpperCase()} 실시간 렌더링</span></span>
              ${item.type === 'jsx' ? `<input type="text" class="preview-props-input" id="jsxPropsInput" value="${escHtml(state.jsxPropsMap.get(item.id) || '')}" placeholder='props 예: ms="test"' title='테스트 props (예: ms="test" 또는 {"ms":"test"})' />` : ''}
              <button class="tree-mini-btn" id="btnRefreshPreview" title="새로고침">${ICONS.refresh}</button>
            </div>
            <iframe class="preview-iframe" id="codePreviewFrame" sandbox="allow-scripts"></iframe>
          </div>` : ''}
      </div>`;

    $('editorItemTitle').oninput = (e) => { item.title = e.target.value; scheduleWorkSave(work); renderSidebar(); };
    $('editorItemType').onchange = (e) => { item.type = e.target.value; scheduleWorkSave(work); renderAll(); };
    $('btnCopyItem').onclick = () => copyText(item.content || '', `'${item.title}' 내용을 복사했습니다.`);
    $('btnExportItemTxt').onclick = () => downloadFile(`${item.title || 'prompt'}.txt`, (isLore && item.keywords ? `[키워드] ${item.keywords}\n\n` : '') + (item.content || ''));

    if (isLore) {
      $('loreKeywordsInput').oninput = (e) => {
        item.keywords = e.target.value;
        $('loreKwCount').textContent = `${splitCsv(item.keywords).length}개`;
        scheduleWorkSave(work);
      };
    }
    if (isCode) {
      $('btnTogglePreview').onclick = () => { state.showPreview = !state.showPreview; renderMain(); };
      if ($('btnRefreshPreview')) $('btnRefreshPreview').onclick = () => updateCodePreview(item);
      if ($('jsxPropsInput')) {
        $('jsxPropsInput').oninput = (e) => {
          state.jsxPropsMap.set(item.id, e.target.value);
          clearTimeout(previewTimer);
          previewTimer = setTimeout(() => updateCodePreview(item), 260);
        };
      }
      const resizer = $('splitResizer'), stage = $('editorStage'), pane = $('previewPane');
      if (resizer && stage && pane) {
        const applySize = (pct, vertical) => {
          const v = Math.round(Math.min(vertical ? 75 : 78, Math.max(20, pct)) * 10) / 10;
          if (vertical) { state.previewHeight = v; pane.style.setProperty('--preview-h', `${v}%`); localStorage.setItem('ps_preview_h', String(v)); }
          else { state.previewWidth = v; pane.style.setProperty('--preview-w', `${v}%`); localStorage.setItem('ps_preview_w', String(v)); }
        };
        resizer.onpointerdown = (e) => {
          e.preventDefault();
          const vertical = isMobile();
          stage.classList.add('is-resizing');
          resizer.setPointerCapture(e.pointerId);
          const onMove = (ev) => {
            const r = stage.getBoundingClientRect();
            const pct = vertical ? ((r.bottom - ev.clientY) / r.height) * 100 : ((r.right - ev.clientX) / r.width) * 100;
            applySize(pct, vertical);
          };
          const onUp = () => {
            stage.classList.remove('is-resizing');
            resizer.onpointermove = resizer.onpointerup = resizer.onpointercancel = null;
            cmEditor?.refresh();
          };
          resizer.onpointermove = onMove;
          resizer.onpointerup = resizer.onpointercancel = onUp;
        };
        resizer.ondblclick = () => { applySize(isMobile() ? 45 : 46, isMobile()); cmEditor?.refresh(); };
      }
    }

    let findMarks = [], findMatches = [], findIdx = -1, suppressFindSync = false;
    const clearFindMarks = () => { findMarks.forEach(m => m.clear()); findMarks = []; };

    const collectMatches = (q) => {
      if (!q) return [];
      const ql = q.toLowerCase(), res = [];
      if (cmEditor) {
        for (let line = 0, n = cmEditor.lineCount(); line < n; line++) {
          const t = cmEditor.getLine(line).toLowerCase();
          for (let p = 0; (p = t.indexOf(ql, p)) !== -1; p += q.length) {
            res.push({ from: { line, ch: p }, to: { line, ch: p + q.length } });
          }
        }
      } else {
        const t = (item.content || '').toLowerCase();
        for (let p = 0; (p = t.indexOf(ql, p)) !== -1; p += q.length) res.push({ start: p, end: p + q.length });
      }
      return res;
    };

    const paintFind = (scroll = true) => {
      clearFindMarks();
      const cntEl = $('edFindCount');
      if (cntEl) cntEl.textContent = state.editorFindQuery ? (findMatches.length ? `${findIdx + 1}/${findMatches.length}` : '0/0') : '';
      if (!findMatches.length || findIdx < 0) return;
      if (cmEditor) {
        const maxM = 400, s = Math.max(0, Math.min(findIdx - 200, findMatches.length - maxM)), e = Math.min(findMatches.length, s + maxM);
        cmEditor.operation(() => {
          for (let i = s; i < e; i++) {
            findMarks.push(cmEditor.markText(findMatches[i].from, findMatches[i].to, { className: i === findIdx ? 'cm-find-current' : 'cm-find-match' }));
          }
        });
        if (scroll) cmEditor.scrollIntoView(findMatches[findIdx].from, 80);
      } else if (scroll && $('fallbackTa')) {
        const m = findMatches[findIdx];
        $('fallbackTa').setSelectionRange(m.start, m.end);
      }
    };

    const runFind = (keepIdx = false, scroll = true) => {
      findMatches = state.showEditorFind ? collectMatches(state.editorFindQuery) : [];
      findIdx = !findMatches.length ? -1 : (keepIdx && findIdx >= 0 ? Math.min(findIdx, findMatches.length - 1) : 0);
      paintFind(scroll);
    };

    const stepFind = (delta) => {
      if (!findMatches.length) runFind(false, true);
      if (!findMatches.length) return;
      findIdx = (findIdx + delta + findMatches.length) % findMatches.length;
      paintFind(true);
    };

    const onContentChange = (val) => {
      item.content = val;
      scheduleWorkSave(work);
      const mEl = $('editorItemMetric');
      if (mEl) mEl.textContent = fmtMetric(val);
      renderStatusbar();
      if (state.showEditorFind && !suppressFindSync) { clearTimeout(findSyncTimer); findSyncTimer = setTimeout(() => runFind(true, false), 150); }
      if (isCode && state.showPreview) { clearTimeout(previewTimer); previewTimer = setTimeout(() => updateCodePreview(item), 380); }
    };

    const replaceOne = () => {
      if (!findMatches.length || findIdx < 0) return;
      const rep = state.editorReplaceText, m = findMatches[findIdx];
      suppressFindSync = true;
      if (cmEditor) {
        cmEditor.replaceRange(rep, m.from, m.to);
      } else if ($('fallbackTa')) {
        const v = item.content || '';
        $('fallbackTa').value = v.slice(0, m.start) + rep + v.slice(m.end);
        onContentChange($('fallbackTa').value);
      }
      suppressFindSync = false;
      runFind(true, true);
    };

    const replaceAll = () => {
      if (!findMatches.length) return;
      const rep = state.editorReplaceText, cnt = findMatches.length;
      suppressFindSync = true;
      if (cmEditor) {
        cmEditor.operation(() => {
          for (let i = findMatches.length - 1; i >= 0; i--) cmEditor.replaceRange(rep, findMatches[i].from, findMatches[i].to);
        });
      } else if ($('fallbackTa')) {
        let v = item.content || '';
        for (let i = findMatches.length - 1; i >= 0; i--) v = v.slice(0, findMatches[i].start) + rep + v.slice(findMatches[i].end);
        $('fallbackTa').value = v;
        onContentChange(v);
      }
      suppressFindSync = false;
      runFind(false, false);
      toast(`${cnt}건을 모두 바꿨습니다.`);
    };

    const setFindOpen = (open, withReplace = null) => {
      state.showEditorFind = open;
      if (withReplace !== null) state.showEditorReplace = withReplace;
      $('editorFindBar')?.classList.toggle('hidden', !open);
      $('btnToggleFind')?.classList.toggle('btn-accent-soft', open);
      $('edReplaceRow')?.classList.toggle('hidden', !state.showEditorReplace);
      $('edToggleReplace')?.classList.toggle('btn-accent-soft', state.showEditorReplace);
      if (open) {
        const sel = cmEditor?.getSelection();
        if (sel && !sel.includes('\n') && sel.length <= 80) {
          state.editorFindQuery = sel;
          if ($('edFindInput')) $('edFindInput').value = sel;
        }
        runFind(false, true);
        const targetInp = withReplace && state.editorFindQuery ? $('edReplaceInput') : $('edFindInput');
        targetInp?.focus(); targetInp?.select();
      } else {
        clearFindMarks(); findMatches = []; findIdx = -1;
        cmEditor?.focus();
      }
      cmEditor?.refresh();
    };

    editorFindCtrl = { open: (rep = false) => setFindOpen(true, rep ? true : null), close: () => setFindOpen(false) };

    $('btnToggleFind').onclick = () => setFindOpen(!state.showEditorFind);
    $('edFindClose').onclick = () => setFindOpen(false);
    $('edToggleReplace').onclick = () => {
      state.showEditorReplace = !state.showEditorReplace;
      $('edReplaceRow').classList.toggle('hidden', !state.showEditorReplace);
      $('edToggleReplace').classList.toggle('btn-accent-soft', state.showEditorReplace);
      if (state.showEditorReplace) $('edReplaceInput')?.focus();
      cmEditor?.refresh();
    };
    $('edFindInput').oninput = (e) => { state.editorFindQuery = e.target.value; runFind(false, true); };
    $('edFindInput').onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { e.preventDefault(); setFindOpen(false); }
    };
    $('edReplaceInput').oninput = (e) => { state.editorReplaceText = e.target.value; };
    $('edReplaceInput').onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); replaceOne(); }
      else if (e.key === 'Escape') { e.preventDefault(); setFindOpen(false); }
    };
    $('edFindPrev').onclick = () => stepFind(-1);
    $('edFindNext').onclick = () => stepFind(1);
    $('edReplaceOne').onclick = replaceOne;
    $('edReplaceAll').onclick = replaceAll;

    const mount = $('editorMount');
    if (window.CodeMirror) {
      cmEditor = CodeMirror(mount, {
        value: item.content || '',
        mode: getEditorMode(item),
        lineNumbers: state.showLineNumbers,
        lineWrapping: true, tabSize: 2,
        inputStyle: isTouchDevice() ? 'contenteditable' : 'textarea'
      });
      if (isCode) cmEditor.getWrapperElement().classList.add('cm-code-mode');
      cmEditor.on('change', () => onContentChange(cmEditor.getValue()));
    } else {
      mount.innerHTML = `<textarea class="fallback-textarea" id="fallbackTa">${escHtml(item.content || '')}</textarea>`;
      $('fallbackTa').oninput = (e) => onContentChange(e.target.value);
    }
    if (state.showEditorFind) runFind(false, false);
    if (isCode && state.showPreview) updateCodePreview(item);
  }

  function runJsxInIframe(rawCode, rawProps) {
    const pvToast = (msg) => {
      let wrap = document.getElementById('__pv_toasts__');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.id = '__pv_toasts__';
        wrap.className = 'pv-toast-wrap';
        document.body.appendChild(wrap);
      }
      const el = document.createElement('div');
      el.className = 'pv-toast';
      el.textContent = String(msg ?? '');
      wrap.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .2s'; }, 2200);
      setTimeout(() => el.remove(), 2450);
    };
    const clip = (v) => { const s = String(v ?? '').trim(); return s.length > 60 ? s.slice(0, 60) + '…' : s; };
    Object.assign(window, {
      showNotification: (msg) => { pvToast(msg || '알림'); },
      sendMessage: (msg) => { pvToast('[sendMessage] ' + (clip(msg) || '(빈 메시지)')); return Promise.resolve(); },
      sendToAI: (msg) => { pvToast('[sendToAI] ' + (clip(msg) || '(빈 메시지)')); return Promise.resolve(); },
      reroll: () => { pvToast('[reroll] 실행됨 (미리보기 생략)'); return Promise.resolve(); },
      randomInt: (min, max) => {
        const a = Math.ceil(Number(min)), b = Math.floor(Number(max));
        if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
        const lo = Math.min(a, b), hi = Math.max(a, b);

      const stubNames = [];
      src = src.replace(/^\s*import\s+([\s\S]*?)\s+from\s+['"]([^'"]+)['"];?/gm, (_, clause, mod) => {

        src = src.replace(/export\s+default\s+function\s+([A-Za-z_$][\w$]*)/, (_, n) => { target = n; return 'function ' + n; });
      } else if (/export\s+default\s+class\s+([A-Za-z_$][\w$]*)/.test(src)) {

        : ('const __CANDS__ = [' + candNames.map(n => '(()=>{try{return [' + JSON.stringify(n) + ',' + n + '];}catch{return null;}})()').join(',') + ']'

            + '\nconst __PASCAL__ = __CANDS__.filter(x => /^[A-Z]/.test(x[0]));'
            + '\nconst __POOL__ = __PASCAL__.length ? __PASCAL__ : __CANDS__;'

            + '\nconst __T__ = __PICK__[1];');

      const elExpr = !pStr
        ? 'React.isValidElement(__T__) ? __T__ : <__T__ />'

  function renderStatusbar() {

    if (isHome() || !work || !branch) { bar.classList.add('hidden'); return closeTokenPopover(); }
    bar.classList.remove('hidden');

    $('tokenTrack').innerHTML = stats.folders
      .filter(f => !f.excluded && f.tokens > 0)
      .map(f => `<div class="token-seg" style="width:${(f.tokens / denom * 100).toFixed(2)}%;background:${f.color};" title="${escHtml(f.name)}: ${fmtNum(f.chars)}자 (${fmtNum(f.tokens)} 토큰)"></div>`)
      .join('');

    sumEl.innerHTML = `<strong>${fmtNum(stats.chars)}자</strong><span>입력</span><span class="tok-num">${fmtNum(stats.tokens)} 토큰</span>`;
    if (state.showTokenPopover) renderTokenPopover(stats, branch);

  /* ================= DRAG & DROP + ORDERING LOGIC ================= */
  function clearDragVisuals() {
    $('treeContainer').querySelectorAll('.dragging,.drag-over-top,.drag-over-bottom,.drag-over-inside')
      .forEach(el => el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom', 'drag-over-inside'));
  }

  function adaptItemTypeForFolder(item, targetFolder) {
    if (targetFolder.kind === 'lorebook' && item.type === 'text') item.type = 'lorebook';
    else if (targetFolder.kind === 'text' && item.type === 'lorebook') item.type = 'text';
    else if (targetFolder.kind === 'code' && item.type !== 'html' && item.type !== 'jsx') item.type = defaultItemType(targetFolder);
  }

  function moveFolder(branch, fromId, toId, placeAfter) {
    const fromIdx = branch.folders.findIndex(f => f.id === fromId);
    let toIdx = branch.folders.findIndex(f => f.id === toId);
    if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return false;
    const [moved] = branch.folders.splice(fromIdx, 1);
    toIdx = branch.folders.findIndex(f => f.id === toId);
    branch.folders.splice(placeAfter ? toIdx + 1 : toIdx, 0, moved);
    return true;
  }

  function moveItem(branch, fromFid, itemId, toFid, toItemId = null, placeAfter = false) {
    const srcFolder = branch.folders.find(f => f.id === fromFid);
    const dstFolder = branch.folders.find(f => f.id === toFid);
    if (!srcFolder || !dstFolder) return false;
    const fromIdx = srcFolder.items.findIndex(i => i.id === itemId);
    if (fromIdx < 0 || (fromFid === toFid && itemId === toItemId)) return false;

    const [moved] = srcFolder.items.splice(fromIdx, 1);
    if (fromFid !== toFid) adaptItemTypeForFolder(moved, dstFolder);

    if (toItemId) {
      const targetIdx = dstFolder.items.findIndex(i => i.id === toItemId);
      dstFolder.items.splice(targetIdx < 0 ? dstFolder.items.length : (placeAfter ? targetIdx + 1 : targetIdx), 0, moved);
    } else {
      dstFolder.items.push(moved);
      dstFolder.collapsed = false;
    }
    if (state.activeItemId === itemId) state.activeFolderId = dstFolder.id;
    return true;
  }

  function bindSidebarDragAndDrop() {
    const tree = $('treeContainer');
    const isAfterMid = (el, y) => { const r = el.getBoundingClientRect(); return y > r.top + r.height / 2; };

    tree.addEventListener('dragstart', (e) => {
      if (state.searchQuery.trim()) return e.preventDefault();
      const itemEl = e.target.closest('.tree-item[data-iselect]');
      const folderEl = e.target.closest('.tree-folder-row[data-ftoggle]');
      if (itemEl) {
        dragState = { kind: 'item', folderId: itemEl.dataset.fid, itemId: itemEl.dataset.iselect };
        itemEl.classList.add('dragging');
      } else if (folderEl) {
        dragState = { kind: 'folder', folderId: folderEl.dataset.ftoggle };
        folderEl.classList.add('dragging');
      } else return;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragState.itemId || dragState.folderId);
    });

    tree.addEventListener('dragover', (e) => {
      if (!dragState) return;
      const itemEl = e.target.closest('.tree-item[data-iselect]');
      const folderEl = e.target.closest('.tree-folder-row[data-ftoggle]');
      if (!itemEl && !folderEl) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearDragVisuals();

      if (dragState.kind === 'folder' && folderEl && folderEl.dataset.ftoggle !== dragState.folderId) {
        folderEl.classList.add(isAfterMid(folderEl, e.clientY) ? 'drag-over-bottom' : 'drag-over-top');
      } else if (dragState.kind === 'item') {
        if (itemEl && itemEl.dataset.iselect !== dragState.itemId) {
          itemEl.classList.add(isAfterMid(itemEl, e.clientY) ? 'drag-over-bottom' : 'drag-over-top');
        } else if (folderEl) {
          folderEl.classList.add('drag-over-inside');
        }
      }
    });

    tree.addEventListener('drop', (e) => {
      if (!dragState) return;
      e.preventDefault();
      const work = getActiveWork(), branch = getActiveBranch(work);
      const itemEl = e.target.closest('.tree-item[data-iselect]');
      const folderEl = e.target.closest('.tree-folder-row[data-ftoggle]');
      let changed = false, dstFid = '';

      if (branch) {
        if (dragState.kind === 'folder' && folderEl) {
          changed = moveFolder(branch, dragState.folderId, folderEl.dataset.ftoggle, isAfterMid(folderEl, e.clientY));
        } else if (dragState.kind === 'item' && (itemEl || folderEl)) {
          dstFid = itemEl ? itemEl.dataset.fid : folderEl.dataset.ftoggle;
          changed = moveItem(branch, dragState.folderId, dragState.itemId, dstFid, itemEl ? itemEl.dataset.iselect : null, itemEl ? isAfterMid(itemEl, e.clientY) : true);
        }
      }
      const movedAcross = changed && dragState.kind === 'item' && dstFid && dstFid !== dragState.folderId;
      clearDragVisuals();
      dragState = null;

      if (changed && work) {
        scheduleWorkSave(work);
        renderSidebar();
        renderStatusbar();
        if (state.viewMode !== 'charInfo') renderMain();
        if (movedAcross) toast(`'${branch.folders.find(f => f.id === dstFid)?.name}' 폴더로 이동했습니다.`);
      }
    });

    tree.addEventListener('dragend', () => { clearDragVisuals(); dragState = null; });
  }

  /* ================= EXPORT & TEXT SERIALIZER ================= */
  const csvCell = (v = '') => `"${String(v).replace(/"/g, '""')}"`;

  function serializeWorkText(work, isExport = false) {
    const br = getActiveBranch(work);
    const out = [`제목: ${work.title || ''}`, `소개: ${work.summary || ''}`, `태그: ${(work.tags || []).join(', ')}`];
    if (isExport) out.push(`분기: ${br?.name || ''}`, '========================================');
    for (const f of (br?.folders || [])) {
      out.push(isExport ? `\n## [${f.name}]` : `\n[${f.name}]`);
      for (const it of f.items) {
        out.push(isExport ? `\n### ${it.title}` : `--- ${it.title} ---`);
        if (it.keywords) out.push(`키워드: ${it.keywords}`);
        out.push(it.content || '');
      }
    }
    return out.join('\n');
  }

  function exportLorebookCsv(work, specificFolder = null) {
    const folders = specificFolder ? [specificFolder] : getActiveBranch(work).folders.filter(f => f.kind === 'lorebook');
    const rows = ['키워드,내용'];
    for (const f of folders) for (const it of f.items) rows.push(`${csvCell(it.keywords || it.title)},${csvCell(it.content || '')}`);
    if (rows.length === 1) return toast('내보낼 로어북 항목이 없습니다.');
    downloadFile(`${work.title || 'lorebook'}_lorebook.csv`, '\uFEFF' + rows.join('\r\n'), 'text/csv;charset=utf-8');
    toast('로어북 CSV를 내보냈습니다.');
  }

  function exportWorkTxt(work) {
    downloadFile(`${work.title || 'work'}_${getActiveBranch(work).name}.txt`, serializeWorkText(work, true));
    toast('작품 전체 TXT를 내보냈습니다.');

  /* ================= GITHUB SYNC & HISTORY DIFF ================= */
  async function ensureMasterPass() {
    if (state.masterPass) return state.masterPass;
    const p = prompt('암호화/복호화에 사용할 마스터 비밀번호를 입력하세요:');
    if (!p) throw new Error('비밀번호가 필요합니다.');
    state.masterPass = p;
    persistConfig();
    return p;
  }

  async function decodeRemoteWork(b64Content) {
    const obj = JSON.parse(b64ToUtf8(b64Content));
    return obj.__encrypted ? decryptObj(obj, await ensureMasterPass()) : obj;
  }

  async function pushWorkToGitHub(work, { skipRender = false } = {}) {
    clearTimeout(saveTimers.get(work.id));
    saveTimers.delete(work.id);
    if (work.profile?.assetPath) {
      const rec = await idb('assets', 'get', work.profile.assetPath);
      if (rec?.dirty && rec.dataUrl) {
        await ghPutFile(work.profile.assetPath, rec.dataUrl.split(',')[1], `Update asset ${work.profile.assetPath}`);
        rec.dirty = false;
        await idb('assets', 'put', rec);
      }
    }
    const cleanWork = { ...work, dirty: false };
    const payload = cleanWork.encrypted ? await encryptObj(cleanWork, await ensureMasterPass()) : cleanWork;
    const msg = `Save ${cleanWork.encrypted ? '[Encrypted]' : (cleanWork.title || cleanWork.id)} (${new Date().toLocaleString('ko-KR')})`;
    await ghPutFile(`works/${work.id}.json`, utf8ToB64(JSON.stringify(payload, null, 2)), msg);
    work.dirty = false;
    await idb('works', 'put', work);
    await saveLocalSnapshot(work, 'GitHub 저장 시점');
    if (!skipRender) { updateTopbarStatusDot(); if (isHome()) renderMain(); else renderStatusbar(); }
  }

  async function pullAllFromGitHub() {
    const branch = ghBranch();
    const list = await ghGetFile('works', branch);
    if (!Array.isArray(list)) return toast('원격 레포에 works/ 폴더가 아직 없습니다.');
    let loaded = 0;
    for (const f of list.filter(x => x.type === 'file' && x.name.endsWith('.json'))) {
      const file = await ghGetFile(`works/${f.name}`, branch);
      if (!file?.content) continue;
      const obj = await decodeRemoteWork(file.content);
      obj.dirty = false;
      state.deletedQueue = state.deletedQueue.filter(d => d.id !== obj.id);
      saveDeletedQueue();
      await idb('works', 'put', obj);
      const idx = state.works.findIndex(w => w.id === obj.id);
      if (idx >= 0) state.works[idx] = obj; else state.works.push(obj);
      loaded++;
    }
    if (state.works.length && !state.works.some(w => w.id === state.activeWorkId)) state.activeWorkId = state.works[0].id;
    renderAll();
    toast(`GitHub에서 ${loaded}개 작품을 불러왔습니다.`);
  }

  function renderSimpleDiff(oldText, newText) {
    const a = oldText.split('\n'), b = newText.split('\n'), out = [];
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      if (a[i] === b[i]) { if (a[i] !== undefined) out.push(`<span class="diff-same">  ${escHtml(a[i])}</span>`); }
      else {
        if (a[i] !== undefined) out.push(`<span class="diff-del">- ${escHtml(a[i])}</span>`);
        if (b[i] !== undefined) out.push(`<span class="diff-add">+ ${escHtml(b[i])}</span>`);
      }
    }
    return out.join('') || '<span class="diff-same">변경 사항이 없습니다.</span>';
  }

  async function openHistoryModal() {
    const work = getActiveWork();
    if (!work) return;
    selectedHistoryPayload = null;
    $('btnRestoreVersion').disabled = true;
    $('diffTitle').textContent = '버전을 선택하세요';
    $('diffOutput').textContent = '로컬 스냅샷과 GitHub 커밋 이력을 불러오는 중...';
    toggleModal('modalHistory', true);

    const entries = (await idb('snapshots', 'getAll'))
      .filter(s => s.workId === work.id).sort((a, b) => b.createdAt - a.createdAt)
      .map(s => ({ source: '로컬', label: s.note, date: new Date(s.createdAt).toLocaleString('ko-KR'), data: s.data }));

    if (isGhReady()) {
      try {
        const commits = await ghRequest(`commits?path=works/${work.id}.json&per_page=15`);
        commits.forEach(c => entries.push({ source: 'GitHub', label: c.commit.message, date: new Date(c.commit.author.date).toLocaleString('ko-KR'), sha: c.sha }));
      } catch {}
    }

    const listEl = $('historyList');
    if (!entries.length) {
      listEl.innerHTML = '<div style="padding:16px;color:var(--text-faint);font-size:12.5px;">저장된 이전 이력이 아직 없습니다.</div>';
      $('diffOutput').textContent = 'GitHub 저장 시 자동으로 버전 이력이 기록됩니다.';
      return;
    }

    listEl.innerHTML = entries.map((e, i) => `
      <div class="history-item" data-hidx="${i}">
        <div style="font-size:11px;font-weight:600;color:var(--accent);">${e.source} · ${escHtml(e.date)}</div>
        <div style="font-size:12.5px;margin-top:2px;color:var(--text-main);">${escHtml(e.label)}</div>
      </div>`).join('');

    listEl.onclick = async (e) => {
      const el = e.target.closest('.history-item');
      if (!el) return;
      listEl.querySelectorAll('.history-item').forEach(x => x.classList.toggle('active', x === el));
      const entry = entries[Number(el.dataset.hidx)];
      $('diffOutput').textContent = '버전 데이터를 불러오는 중...';
      try {
        const oldWork = entry.data || await decodeRemoteWork((await ghGetFile(`works/${work.id}.json`, entry.sha)).content);
        selectedHistoryPayload = oldWork;
        $('diffTitle').textContent = `${entry.source} (${entry.date}) vs 현재`;
        $('diffOutput').innerHTML = renderSimpleDiff(serializeWorkText(oldWork), serializeWorkText(work));
        $('btnRestoreVersion').disabled = false;
      } catch (err) {
        $('diffOutput').textContent = `불러오기 실패: ${err.message}`;
      }
    };
  }

      e.stopPropagation();
      state.showTokenPopover = !state.showTokenPopover;
      if (state.showTokenPopover) renderStatusbar(); else closeTokenPopover();
    };

    $('btnSaveSettings').onclick = () => {
      CFG_TEXT_MAP.forEach(([id, k]) => { state.config[k] = $(id).value.trim(); });
      if (!state.config.branch) state.config.branch = 'main';
      state.config.rememberPass = $('cfgRememberPass').checked;
      state.masterPass = $('cfgPass').value;
      persistConfig();
      toggleModal('modalSettings', false);
      renderTopbar();
      toast('연동 설정을 저장했습니다.');
    };

    $('btnGitSave').onclick = async () => {
      const w = getActiveWork();
      if (!w || state.isSyncing) return;
      const btn = $('btnGitSave');
      state.isSyncing = true;
      btn.disabled = true;
      try {
        toast('GitHub에 저장 중...');
        await pushWorkToGitHub(w);
        const delCnt = await flushDeletedToGitHub();
        toast(delCnt ? `GitHub 저장 완료! (원격 삭제 ${delCnt}건 반영)` : 'GitHub 저장 완료!');
      } catch (e) { toast(e.message); }
      finally { state.isSyncing = false; btn.disabled = false; updateTopbarStatusDot(); }
    };

    $('btnPushAll').onclick = async () => {
      if (state.isSyncing) return;
      const dirtyWorks = state.works.filter(w => w.dirty);
      if (!dirtyWorks.length && !state.deletedQueue.length) return toast('변경된 작품이 없습니다.');
      const btn = $('btnPushAll');
      state.isSyncing = true;
      btn.disabled = true;
      try {
        toast('변경된 항목 GitHub 반영 중...');
        for (const w of dirtyWorks) await pushWorkToGitHub(w, { skipRender: true });
        const delCnt = await flushDeletedToGitHub();
        const parts = [];
        if (dirtyWorks.length) parts.push(`수정된 ${dirtyWorks.length}개 업로드`);
        if (delCnt) parts.push(`원격 삭제 ${delCnt}건`);
        toast(parts.length ? `${parts.join(' · ')} 완료!` : '동기화 완료!');
      } catch (e) { toast(e.message); }
      finally {
        state.isSyncing = false;
        btn.disabled = false;
        updateTopbarStatusDot();
        if (isHome()) renderMain(); else renderStatusbar();
      }
    };

    $('btnPullAll').onclick = async () => {
      try { await pullAllFromGitHub(); toggleModal('modalSettings', false); }
      catch (e) { toast(e.message); }
    };

    $('btnRestoreVersion').onclick = async () => {
      if (!selectedHistoryPayload || !confirm('선택한 과거 버전으로 현재 작품을 덮어쓸까요?')) return;
      const idx = state.works.findIndex(w => w.id === selectedHistoryPayload.id);
      if (idx < 0) return;
      const restored = { ...clone(selectedHistoryPayload), dirty: true };
      state.works[idx] = restored;
      await idb('works', 'put', restored);
      toggleModal('modalHistory', false);
      state.viewMode = 'charInfo';
      renderAll();
      toast('선택한 버전으로 복구했습니다.');
    };

    // Sidebar Search & Controls
    $('searchInput').oninput = (e) => { state.searchQuery = e.target.value; renderSidebar(); };
    $('btnClearSearch').onclick = () => { state.searchQuery = $('searchInput').value = ''; renderSidebar(); $('searchInput').focus(); };
    $('segCurrent').onclick = () => { state.searchScope = 'current'; renderSidebar(); };
    $('segAll').onclick = () => { state.searchScope = 'all'; renderSidebar(); };

    $('btnAddFolder').onclick = () => {
      const work = getActiveWork(), branch = getActiveBranch(work);
      if (!branch) return;
      openSimpleFormModal('새 폴더 추가', [
        { id: 'name', label: '폴더 이름', placeholder: '예: NPC 설정, 시스템 프롬프트' },
        { id: 'kind', label: '폴더 유형', type: 'select', value: 'text', options: FOLDER_KINDS }
      ], ({ name, kind }) => {
        if (!name.trim()) return;
        branch.folders.push(mkFolder(name.trim(), kind, false, []));
        scheduleWorkSave(work); renderSidebar(); renderStatusbar();
      });
    };

    $('btnExportCsv').onclick = () => { const w = getActiveWork(); if (w) exportLorebookCsv(w); };
    $('btnExportTxt').onclick = () => { const w = getActiveWork(); if (w) exportWorkTxt(w); };

    // Delegated Sidebar Tree Events
    $('treeContainer').onclick = (e) => {
      const work = getActiveWork(), branch = getActiveBranch(work);
      const hit = e.target.closest('.search-hit');
      if (hit) {
        state.activeWorkId = hit.dataset.w; state.activeFolderId = hit.dataset.f; state.activeItemId = hit.dataset.i;
        state.viewMode = 'editor'; closeSidebarOnMobile(); return renderAll();
      }
      if (e.target.closest('#navCharInfo')) { state.viewMode = 'charInfo'; closeSidebarOnMobile(); return renderAll(); }
      if (!work || !branch) return;

      const btn = e.target.closest('button[data-act]');
      if (btn) {
        e.stopPropagation();
        const { act, fid, ctype, iid } = btn.dataset;
        const f = branch.folders.find(x => x.id === fid);
        if (!f) return;
        if (act === 'fmenu') return toggleDropdown(btn, (a) => openFolderMenu(a, f));
        if (act === 'imenu') { const it = f.items.find(x => x.id === iid); if (it) toggleDropdown(btn, (a) => openItemMenu(a, f, it)); return; }
        closeDropdown();
        if (act === 'cards') { state.activeFolderId = fid; state.viewMode = ctype; state.editingCardIds.clear(); closeSidebarOnMobile(); return renderAll(); }
        if (act === 'fadd') {
          const it = mkItem(`새 항목 ${f.items.length + 1}`, defaultItemType(f));
          f.items.push(it); f.collapsed = false;
          state.activeFolderId = fid; state.activeItemId = it.id; state.viewMode = 'editor';
          scheduleWorkSave(work); return renderAll();
        }
        return;
      }

      const fRow = e.target.closest('[data-ftoggle]');
      if (fRow) {
        const f = branch.folders.find(x => x.id === fRow.dataset.ftoggle);
        if (f) { f.collapsed = !f.collapsed; scheduleWorkSave(work, false, false); renderSidebar(); }
        return;
      }
      const iRow = e.target.closest('[data-iselect]');
      if (iRow) {
        state.activeFolderId = iRow.dataset.fid; state.activeItemId = iRow.dataset.iselect;
        state.viewMode = 'editor'; closeSidebarOnMobile(); renderAll();
      }
    };

    bindSidebarDragAndDrop();

    // Modals, Dropdowns & Shortcuts
    document.querySelectorAll('[data-close-modal]').forEach(b => { b.onclick = () => toggleModal(b.dataset.closeModal, false); });
    document.querySelectorAll('.modal-backdrop').forEach(mb => { mb.onclick = (e) => { if (e.target === mb) mb.classList.remove('open'); }; });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown-menu')) closeDropdown();
      if (!e.target.closest('#tokenPopoverRoot') && !e.target.closest('#statusbar')) closeTokenPopover();
    });
    document.addEventListener('keydown', async (e) => {
      const mod = e.ctrlKey || e.metaKey;
      const key = e.key.toLowerCase();
      if (mod && e.shiftKey && key === 'f') {
        e.preventDefault();
        if (isHome()) $('homeSearchInput')?.focus();
        else { state.sidebarCollapsed = false; renderSidebar(); $('searchInput').focus(); }
      } else if (mod && !e.shiftKey && (key === 'f' || key === 'h') && state.viewMode === 'editor' && editorFindCtrl) {
        e.preventDefault();
        editorFindCtrl.open(key === 'h');
      } else if (mod && key === 's' && !isHome()) {
        e.preventDefault();
        const w = getActiveWork();
        if (w) { await idb('works', 'put', w); await saveLocalSnapshot(w, '로컬 스냅샷 저장 (Ctrl+S)'); toast('로컬 스냅샷이 저장되었습니다.'); }
      } else if (e.key === 'Escape') {
        if (state.viewMode === 'editor' && state.showEditorFind && editorFindCtrl) editorFindCtrl.close();
        closeDropdown(); closeTokenPopover();
        document.querySelectorAll('.modal-backdrop.open').forEach(m => m.classList.remove('open'));
      }
    });
  }

  /* ================= BOOTSTRAP ================= */
  async function init() {
    loadConfig(); initStaticUI(); applyTheme(); bindGlobalEvents();
    const works = await idb('works', 'getAll');
    if (works.length) {
      state.works = works.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    } else {
      const sample = createWorkObject({ title: '예시 작품', summary: '눌러보세요!', tags: ['테스트', '태그'], withSample: true });
      state.works = [sample];
      await idb('works', 'put', sample);
    }
    state.activeWorkId = state.works[0].id;
    state.viewMode = 'home';
    renderAll();
  }

  init();
})();
</script>
</body>
</html>

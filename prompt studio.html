<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>프롬프트 아카이브 스튜디오</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       Design Tokens: Light (default) & Eye-Friendly Dark Mode
       ========================================================= */
    :root {
      --bg-app: #ffffff;
      --bg-sidebar: #f7f8fa;
      --bg-subtle: #f3f4f6;
      --bg-hover: #eceef2;
      --bg-active: #e8f1fb;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text-main: #1f2937;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --text-faint: #9ca3af;
      --accent: #1f8a4c;
      --accent-hover: #176f3c;
      --accent-soft: #e6f4ec;
      --accent-text: #156235;
      --blue-active: #1d4ed8;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --diff-add-bg: #ecfdf5;
      --diff-add-text: #065f46;
      --diff-del-bg: #fef2f2;
      --diff-del-text: #991b1b;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.1);
      --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "D2Coding", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sidebar-width: 276px;
    }

    [data-theme="dark"] {
      --bg-app: #131518;
      --bg-sidebar: #1a1d21;
      --bg-subtle: #20242a;
      --bg-hover: #262b33;
      --bg-active: #1e2a3a;
      --border: #2a2f37;
      --border-strong: #3a414c;
      --text-main: #e5e7eb;
      --text-secondary: #cbd5e1;
      --text-muted: #9ca3af;
      --text-faint: #6b7280;
      --accent: #229a56;
      --accent-hover: #1d854a;
      --accent-soft: #152b1f;
      --accent-text: #6ee7a0;
      --blue-active: #60a5fa;
      --amber: #f59e0b;
      --amber-soft: #2e2412;
      --danger: #f87171;
      --danger-soft: #31191a;
      --diff-add-bg: #112a1f;
      --diff-add-text: #86efac;
      --diff-del-bg: #2e1618;
      --diff-del-text: #fca5a5;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Subtle custom scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-faint);
    }

    /* =========================================================
       Core Layout Shell
       ========================================================= */
    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-app);
    }

    .topbar {
      height: 48px;
      min-height: 48px;
      background: var(--bg-app);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 8px;
      z-index: 30;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .workspace-body {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Collapsible Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease, min-width 0.2s ease, transform 0.22s ease;
      overflow: hidden;
      z-index: 25;
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      border-right-width: 0;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(84vw, 310px);
        min-width: min(84vw, 310px);
        z-index: 45;
        transform: translateX(-100%);
        box-shadow: var(--shadow-md);
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .sidebar.collapsed {
        width: min(84vw, 310px);
        min-width: min(84vw, 310px);
        border-right-width: 1px;
      }
      .sidebar-backdrop.visible {
        display: block;
        opacity: 1;
      }
    }

    /* Main Editor Area */
    .main-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
    }

    /* Bottom Status Bar */
    .statusbar {
      height: 30px;
      min-height: 30px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 12px;
      color: var(--text-muted);
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
    }

    /* =========================================================
       Minimal Buttons, Inputs & Controls
       ========================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-app);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }
    .btn:active {
      transform: translateY(0.5px);
    }
    .btn-ghost {
      border-color: transparent;
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover {
      background: var(--bg-hover);
      border-color: transparent;
      color: var(--text-main);
    }
    .btn-icon {
      width: 34px;
      height: 34px;
      padding: 0;
    }
    .btn-sm {
      height: 28px;
      padding: 0 8px;
      font-size: 12px;
      border-radius: 6px;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #ffffff;
    }
    .btn-danger {
      background: var(--danger-soft);
      border-color: transparent;
      color: var(--danger);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #ffffff;
    }
    .btn-encrypt-on {
      background: var(--amber-soft);
      border-color: rgba(217, 119, 6, 0.35);
      color: var(--amber);
    }
    .btn-encrypt-on:hover {
      background: var(--amber-soft);
      border-color: var(--amber);
    }

    .input-field, .select-field {
      height: 34px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-app);
      color: var(--text-main);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .input-field:focus, .select-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(31, 138, 76, 0.14);
    }
    .input-sm {
      height: 29px;
      font-size: 12.5px;
      padding: 0 8px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-amber { background: var(--amber); }
    .dot-green { background: var(--accent); }
    .dot-muted { background: var(--text-faint); }

    /* Segmented Control */
    .segmented {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 2px;
      border-radius: 7px;
      border: 1px solid var(--border);
    }
    .segmented button {
      height: 25px;
      padding: 0 9px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .segmented button.active {
      background: var(--bg-app);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    /* =========================================================
       Sidebar Tree Styles
       ========================================================= */
    .tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 20px;
    }

    .tree-folder-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      user-select: none;
      position: relative;
    }
    .tree-folder-row:hover {
      background: var(--bg-hover);
    }

    .tree-item-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px 6px 26px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      user-select: none;
      margin-top: 1px;
    }
    .tree-item-row:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }
    .tree-item-row.active {
      background: var(--bg-active);
      color: var(--blue-active);
      font-weight: 600;
    }

    .tree-row-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .tree-folder-row:hover .tree-row-actions,
    .tree-item-row:hover .tree-row-actions,
    .tree-item-row.active .tree-row-actions {
      opacity: 1;
    }
    @media (hover: none) {
      .tree-row-actions { opacity: 1; }
    }

    .mini-icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .mini-icon-btn:hover {
      background: var(--bg-app);
      color: var(--text-main);
    }

    /* =========================================================
       Editor & Synchronized Line Gutter
       ========================================================= */
    .editor-split-container {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .editor-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-app);
    }

    .editor-code-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .line-gutter {
      width: 48px;
      min-width: 48px;
      background: var(--bg-app);
      border-right: 1px solid var(--border);
      padding: 16px 8px 40px 4px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 24px;
      color: var(--text-faint);
      user-select: none;
      overflow: hidden;
    }

    .gutter-line {
      display: block;
      padding-right: 4px;
    }

    .editor-textarea {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      background: var(--bg-app);
      color: var(--text-main);
      padding: 16px 20px 40px 16px;
      font-size: 14px;
      line-height: 24px;
      font-family: var(--font-sans);
      tab-size: 2;
      overflow-y: auto;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .editor-textarea.code-mode {
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 24px;
      white-space: pre;
      overflow-x: auto;
    }

    /* Hidden mirror for accurate wrapped-line gutter heights */
    .line-mirror {
      position: absolute;
      top: 0;
      left: -99999px;
      visibility: hidden;
      pointer-events: none;
      font-size: 14px;
      line-height: 24px;
      font-family: var(--font-sans);
      padding: 0 20px 0 16px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* Splitter */
    .split-divider {
      width: 5px;
      background: var(--border);
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s ease;
      position: relative;
    }
    .split-divider:hover, .split-divider.dragging {
      background: var(--accent);
    }

    /* Live Preview Pane */
    .preview-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-subtle);
      border-left: 1px solid var(--border);
    }

    .preview-header {
      height: 36px;
      min-height: 36px;
      padding: 0 10px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .preview-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 10px;
      overflow: auto;
    }

    .preview-frame-wrap {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: width 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .preview-frame-wrap.mobile-frame {
      width: 390px;
      max-width: 100%;
    }
    .preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    @media (max-width: 767px) {
      .editor-split-container.stacked-split {
        flex-direction: column;
      }
      .split-divider {
        display: none;
      }
      .preview-pane {
        border-left: none;
        border-top: 1px solid var(--border);
      }
      .line-gutter {
        width: 38px;
        min-width: 38px;
        padding: 14px 4px 40px 2px;
      }
      .editor-textarea {
        padding: 14px 12px 40px 10px;
      }
    }

    /* =========================================================
       Popovers, Dropdowns & Modals
       ========================================================= */
    .dropdown-menu {
      position: fixed;
      min-width: 185px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 9px;
      box-shadow: var(--shadow-md);
      padding: 5px;
      z-index: 80;
    }
    .dropdown-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }
    .dropdown-item:hover {
      background: var(--bg-hover);
    }
    .dropdown-item.danger {
      color: var(--danger);
    }
    .dropdown-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 100;
      backdrop-filter: blur(2px);
    }
    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 90dvh;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-card.modal-lg {
      max-width: 880px;
      height: min(84dvh, 720px);
    }
    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      background: var(--bg-sidebar);
    }

    /* Diff Viewer */
    .diff-box {
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.6;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      background: var(--bg-app);
    }
    .diff-line {
      display: flex;
      padding: 1px 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .diff-line.add {
      background: var(--diff-add-bg);
      color: var(--diff-add-text);
    }
    .diff-line.del {
      background: var(--diff-del-bg);
      color: var(--diff-del-text);
    }
    .diff-sign {
      width: 18px;
      flex-shrink: 0;
      user-select: none;
      opacity: 0.75;
    }

    /* Toast Notification */
    .toast-stack {
      position: fixed;
      bottom: 42px;
      right: 14px;
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(92vw, 340px);
    }
    .toast {
      background: var(--text-main);
      color: var(--bg-app);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.18s ease;
    }
    .toast.error {
      background: var(--danger);
      color: #ffffff;
    }
    .toast.success {
      background: var(--accent);
      color: #ffffff;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hide-mobile { display: inline; }
    @media (max-width: 680px) {
      .hide-mobile { display: none; }
    }
    .hide-tablet { display: inline; }
    @media (max-width: 960px) {
      .hide-tablet { display: none; }
    }

    .search-highlight {
      background: var(--amber-soft);
      color: var(--amber);
      border-radius: 2px;
      padding: 0 2px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top Header Bar -->
    <header class="topbar">
      <div class="topbar-group">
        <button id="btnToggleSidebar" class="btn btn-ghost btn-icon" title="사이드바 접기/열기" aria-label="사이드바 토글"></button>

        <!-- Work Switcher -->
        <button id="btnWorkSwitcher" class="btn" title="작품 전환 및 관리" style="max-width: 200px;">
          <span id="topWorkThumb" class="w-5 h-5 rounded overflow-hidden flex items-center justify-center flex-shrink-0" style="background: var(--bg-subtle); border: 1px solid var(--border);"></span>
          <span id="topWorkTitle" class="truncate font-semibold">작품 불러오는 중</span>
          <span id="iconWorkChevron" class="flex-shrink-0 opacity-60"></span>
        </button>

        <!-- Platform Branch Selector -->
        <button id="btnBranchMenu" class="btn" title="플랫폼 버전 분기 전환 및 관리" style="max-width: 155px;">
          <span id="iconBranch" class="flex-shrink-0 opacity-75"></span>
          <span id="topBranchName" class="truncate">기본 (공통)</span>
          <span id="iconBranchChevron" class="flex-shrink-0 opacity-60"></span>
        </button>

        <!-- History / Diff -->
        <button id="btnHistory" class="btn btn-ghost" title="GitHub 커밋 및 로컬 스냅샷 비교">
          <span id="iconHistory"></span>

      function uid(prefix) {
        return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      function deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatNumber(n) {
        return Number(n || 0).toLocaleString('ko-KR');
      }

      function formatDateTime(iso) {

        if (isNaN(d.getTime())) return iso;
        const pad = (v) => String(v).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      // Practical bilingual Korean/English token estimation
      function estimateTokens(text) {
        if (!text) return 0;
        let tokens = 0;
        for (let i = 0; i < text.length; i++) {
          const code = text.charCodeAt(i);
          if (code >= 0xac00 && code <= 0xd7a3) {
            tokens += 0.65; // Hangul syllable
          } else if (code > 127) {
            tokens += 0.8;  // Other multibyte
          } else if (code === 10 || code === 32 || code === 9) {
            tokens += 0.22; // Whitespace
          } else if ((code >= 48 && code <= 57) || (code >= 65 && code <= 90) || (code >= 97 && code <= 122)) {
            tokens += 0.27; // ASCII alphanumeric
          } else {
            tokens += 0.45; // Punctuation / code symbols
          }
        }
        return Math.ceil(tokens);
      }

      // Chunked UTF-8 safe Base64 helpers (safe for large Korean prompts)
      function bytesToBase64(bytes) {
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(binary);
      }

      function base64ToBytes(base64) {
        const clean = String(base64 || '').replace(/\s/g, '');
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function utf8ToBase64(str) {
        return bytesToBase64(new TextEncoder().encode(str));
      }

      function base64ToUtf8(b64) {
        return new TextDecoder('utf-8').decode(base64ToBytes(b64));
      }

      // RFC-4180 CSV field escaper
      function escapeCsvCell(val) {
        const s = String(val == null ? '' : val);
        if (/[",\r\n]/.test(s)) {
          return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }

      function downloadFile(filename, content, mimeType) {
        const blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 120);
      }

      async function copyTextToClipboard(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) {}
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (_) {
          return false;
        }
      }

      function sanitizeFilename(name) {
        return String(name || 'export').replace(/[\\/:*?"<>|]/g, '_').trim() || 'export';
      }

      /* =========================================================
         3. Client-Side Web Crypto API (PBKDF2 + AES-GCM 256)
         ========================================================= */
      const CryptoEngine = {
        async deriveKey(password, saltBytes) {
          const keyMaterial = await crypto.subtle.importKey(
            'raw',
            new TextEncoder().encode(password),
            'PBKDF2',
            false,
            ['deriveKey']
          );
          return crypto.subtle.deriveKey(
            {
              name: 'PBKDF2',
              salt: saltBytes,
              iterations: 150000,
              hash: 'SHA-256'
            },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
          );
        },

        async encryptPayload(workObj, password) {
          if (!password) throw new Error('암호화 마스터 비밀번호가 필요합니다.');
          const salt = crypto.getRandomValues(new Uint8Array(16));
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const key = await this.deriveKey(password, salt);
          const plainBytes = new TextEncoder().encode(JSON.stringify(workObj));
          const cipherBuffer = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plainBytes);
          return {
            encrypted: true,
            v: 1,
            id: workObj.id,
            titleHint: workObj.title,
            updatedAt: workObj.updatedAt,
            salt: bytesToBase64(salt),
            iv: bytesToBase64(iv),
            data: bytesToBase64(new Uint8Array(cipherBuffer))
          };
        },

        async decryptPayload(envelope, password) {
          if (!password) throw new Error('복호화 비밀번호가 필요합니다.');
          try {
            const salt = base64ToBytes(envelope.salt);
            const iv = base64ToBytes(envelope.iv);
            const cipherBytes = base64ToBytes(envelope.data);
            const key = await this.deriveKey(password, salt);
            const plainBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipherBytes);
            return JSON.parse(new TextDecoder('utf-8').decode(plainBuffer));
          } catch (_) {
            throw new Error('비밀번호가 일치하지 않거나 암호화 데이터가 손상되었습니다.');
          }
        }
      };

      /* =========================================================
         4. IndexedDB Storage Layer (with localStorage fallback)
         ========================================================= */
      const Storage = {
        db: null,
        useFallback: false,
        DB_NAME: 'PromptArchiveStudioDB',
        DB_VERSION: 1,

        async init() {
          return new Promise((resolve) => {
            if (!window.indexedDB) {
              this.useFallback = true;
              resolve();
              return;
            }
            try {
              const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
              req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('works')) {
                  db.createObjectStore('works', { keyPath: 'id' });
                }
                if (!db.objectStoreNames.contains('snapshots')) {
                  const snapStore = db.createObjectStore('snapshots', { keyPath: 'id' });
                  snapStore.createIndex('workId', 'workId', { unique: false });
                }
                if (!db.objectStoreNames.contains('meta')) {
                  db.createObjectStore('meta', { keyPath: 'key' });
                }
              };
              req.onsuccess = (e) => {
                this.db = e.target.result;
                resolve();
              };
              req.onerror = () => {
                this.useFallback = true;
                resolve();
              };
            } catch (_) {
              this.useFallback = true;
              resolve();
            }
          });
        },

        _lsRead(storeName) {
          try {
            return JSON.parse(localStorage.getItem('pa_fb_' + storeName) || '[]');
          } catch (_) {
            return [];
          }
        },
        _lsWrite(storeName, arr) {
          try {
            localStorage.setItem('pa_fb_' + storeName, JSON.stringify(arr));
          } catch (_) {}
        },

        async getAll(storeName) {
          if (this.useFallback) return this._lsRead(storeName);
          return new Promise((resolve, reject) => {
            const tx = this.db.transaction(storeName, 'readonly');
            const req = tx.objectStore(storeName).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
          });
        },

        async put(storeName, value) {
          if (this.useFallback) {
            const keyField = storeName === 'meta' ? 'key' : 'id';
            const arr = this._lsRead(storeName).filter((x) => x[keyField] !== value[keyField]);
            arr.push(value);
            this._lsWrite(storeName, arr);
            return;
          }
          return new Promise((resolve, reject) => {
            const tx = this.db.transaction(storeName, 'readwrite');
            tx.objectStore(storeName).put(value);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        },

        async delete(storeName, key) {
          if (this.useFallback) {
            const keyField = storeName === 'meta' ? 'key' : 'id';
            const arr = this._lsRead(storeName).filter((x) => x[keyField] !== key);
            this._lsWrite(storeName, arr);
            return;
          }
          return new Promise((resolve, reject) => {
            const tx = this.db.transaction(storeName, 'readwrite');
            tx.objectStore(storeName).delete(key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        },

        async getMeta(key, defaultValue) {
          const all = await this.getAll('meta');
          const found = all.find((x) => x.key === key);
          return found ? found.value : defaultValue;
        },

        async setMeta(key, value) {
          await this.put('meta', { key, value });
        },

        async getSnapshotsByWork(workId) {
          const all = await this.getAll('snapshots');
          return all
            .filter((s) => s.workId === workId)
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        },

        async addSnapshot(work, message, branchName) {
          const cleanWork = stripRuntimeFields(work);
          const snap = {
            id: uid('snap'),
            workId: work.id,
            timestamp: new Date().toISOString(),
            message: message || '로컬 스냅샷 저장',
            branchName: branchName || '',
            data: cleanWork
          };
          await this.put('snapshots', snap);
          // Keep latest 40 snapshots per work
          const existing = await this.getSnapshotsByWork(work.id);
          if (existing.length > 40) {
            for (const old of existing.slice(40)) {
              await this.delete('snapshots', old.id);
            }
          }
          return snap;
        }
      };

      function stripRuntimeFields(work) {
        const clone = deepClone(work);
        delete clone._baseline;
        return clone;
      }

      function buildBaselineSnapshot(work) {
        const map = {};
        for (const brId of Object.keys(work.branches || {})) {
          const br = work.branches[brId];
          for (const f of br.folders || []) {
            for (const it of f.items || []) {
              map[`${brId}::${it.id}`] = {
                name: it.name,
                type: it.type,
                keywords: it.keywords || '',
                content: it.content || ''
              };
            }
          }
        }
        return map;
      }

        return State.works.find((w) => w.id === State.activeWorkId) || State.works[0] || null;
      }

      function getActiveBranch(work) {
        const w = work || getActiveWork();
        if (!w || !w.branches) return null;
        return w.branches[w.activeBranchId] || Object.values(w.branches)[0] || null;
      }

      function getActiveFolderAndItem() {
        const br = getActiveBranch();
        if (!br) return { folder: null, item: null };
        for (const f of br.folders) {
          for (const it of f.items) {
            if (it.id === State.activeItemId) {
              return { folder: f, item: it };
            }
          }
        }
        // Fallback to first available item
        for (const f of br.folders) {
          if (f.items.length > 0) {
            State.activeFolderId = f.id;
            State.activeItemId = f.items[0].id;
            return { folder: f, item: f.items[0] };
          }
        }
        return { folder: null, item: null };
      }

      function isItemDirty(work, branchId, item) {
        if (!work || !work._baseline) return false;
        const base = work._baseline[`${branchId}::${item.id}`];
        if (!base) return true;
        return (
          base.content !== (item.content || '') ||
          base.keywords !== (item.keywords || '') ||
          base.name !== item.name ||
          base.type !== item.type
        );
      }

      function isWorkDirty(work) {
        if (!work || !work._baseline) return false;
        for (const brId of Object.keys(work.branches || {})) {
          const br = work.branches[brId];
          for (const f of br.folders || []) {
            for (const it of f.items || []) {
              if (isItemDirty(work, brId, it)) return true;
            }
          }
        }
        return false;
      }

        if (State.sessionPassword) return State.sessionPassword;
        if (State.rememberPassword) {

            return saved;
          }

        State.sessionPassword = pw || '';
        State.rememberPassword = !!remember;

      function showToast(message, type) {
        const stack = document.getElementById('toastStack');
        const el = document.createElement('div');
        el.className = 'toast' + (type ? ' ' + type : '');
        const icon = type === 'error' ? ICONS.x : type === 'success' ? ICONS.check : ICONS.fileText;
        el.innerHTML = `<span class="flex-shrink-0">${icon}</span><span>${escapeHtml(message)}</span>`;
        stack.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.2s ease';
          setTimeout(() => el.remove(), 220);
        }, 2800);
      }

      function closeDropdown() {
        document.getElementById('dropdownRoot').innerHTML = '';
      }

      function openDropdown(anchorEl, itemsHtml, alignRight) {
        closeDropdown();
        const root = document.getElementById('dropdownRoot');
        const menu = document.createElement('div');
        menu.className = 'dropdown-menu';
        menu.innerHTML = itemsHtml;
        root.appendChild(menu);

        const rect = anchorEl.getBoundingClientRect();
        const menuRect = menu.getBoundingClientRect();
        let top = rect.bottom + 5;
        let left = alignRight ? rect.right - menuRect.width : rect.left;

        if (left + menuRect.width > window.innerWidth - 8) {
          left = window.innerWidth - menuRect.width - 8;
        }
        if (left < 8) left = 8;
        if (top + menuRect.height > window.innerHeight - 8) {
          top = Math.max(8, rect.top - menuRect.height - 5);
        }

        menu.style.top = top + 'px';
        menu.style.left = left + 'px';
        return menu;
      }

      /* =========================================================
         8. GitHub REST API Client
         ========================================================= */
      const GitHubAPI = {
        headers() {
          return {
            'Authorization': 'Bearer ' + State.github.token.trim(),
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
        },

        baseUrl() {
          const owner = encodeURIComponent(State.github.owner.trim());
          const repo = encodeURIComponent(State.github.repo.trim());
          return `https://api.github.com/repos/${owner}/${repo}`;
        },

        async verifyRepo() {
          const res = await fetch(this.baseUrl(), { headers: this.headers() });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `GitHub 연결 실패 (HTTP ${res.status})`);
          }
          return res.json();
        },

        async getFile(path, ref) {
          const q = ref ? `?ref=${encodeURIComponent(ref)}` : `?ref=${encodeURIComponent(State.github.branch || 'main')}`;
          const res = await fetch(`${this.baseUrl()}/contents/${path}${q}`, {
            headers: this.headers(),
            cache: 'no-store'
          });
          if (res.status === 404) return null;
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `파일 조회 실패 (HTTP ${res.status})`);
          }
          return res.json();
        },

        async listWorksDir() {
          const branch = encodeURIComponent(State.github.branch || 'main');
          const res = await fetch(`${this.baseUrl()}/contents/works?ref=${branch}`, {
            headers: this.headers(),
            cache: 'no-store'
          });
          if (res.status === 404) return [];
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `목록 조회 실패 (HTTP ${res.status})`);
          }
          const data = await res.json();
          return Array.isArray(data) ? data.filter((f) => f.type === 'file' && f.name.endsWith('.json')) : [];
        },

        async pushWork(work, commitMessage) {
          const path = `works/${work.id}.json`;
          const cleanWork = stripRuntimeFields(work);
          let payloadObj = cleanWork;

          if (cleanWork.encrypted) {
            const pw = await ensurePasswordDialog('이 작품은 암호화 저장이 켜져 있습니다. GitHub에 올리기 전에 마스터 비밀번호를 입력하세요.');
            if (!pw) return { cancelled: true };
            payloadObj = await CryptoEngine.encryptPayload(cleanWork, pw);
          }

          const jsonText = JSON.stringify(payloadObj, null, 2);
          const contentB64 = utf8ToBase64(jsonText);

          // Check existing SHA for update
          const existing = await this.getFile(path);
          const body = {
            message: commitMessage || `Update ${work.title} - ${formatDateTime(new Date().toISOString())}`,
            content: contentB64,
            branch: State.github.branch || 'main'
          };
          if (existing && existing.sha) {
            body.sha = existing.sha;
          }

          const res = await fetch(`${this.baseUrl()}/contents/${path}`, {
            method: 'PUT',
            headers: {
              ...this.headers(),
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `커밋 저장 실패 (HTTP ${res.status})`);
          }
          return res.json();
        },

        async pullAllWorks() {
          const files = await this.listWorksDir();
          const pulled = [];
          let decryptSkipped = 0;

          for (const f of files) {
            const fileObj = await this.getFile(`works/${f.name}`);
            if (!fileObj || !fileObj.content) continue;
            const rawJson = JSON.parse(base64ToUtf8(fileObj.content));

            if (rawJson && rawJson.encrypted) {
              const pw = await ensurePasswordDialog(`암호화된 작품(${rawJson.titleHint || f.name})을 불러오려면 마스터 비밀번호가 필요합니다.`);
              if (!pw) {
                decryptSkipped++;
                continue;
              }
              const decrypted = await CryptoEngine.decryptPayload(rawJson, pw);
              decrypted._baseline = buildBaselineSnapshot(decrypted);
              pulled.push(decrypted);
            } else if (rawJson && rawJson.id && rawJson.branches) {
              rawJson._baseline = buildBaselineSnapshot(rawJson);
              pulled.push(rawJson);
            }
          }
          return { pulled, decryptSkipped };
        },

        async getCommits(workId) {
          const path = encodeURIComponent(`works/${workId}.json`);
          const sha = encodeURIComponent(State.github.branch || 'main');
          const res = await fetch(`${this.baseUrl()}/commits?path=${path}&sha=${sha}&per_page=30`, {
            headers: this.headers(),
            cache: 'no-store'
          });
          if (res.status === 404) return [];
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `커밋 히스토리 조회 실패 (HTTP ${res.status})`);
          }
          return res.json();
        },

        async getWorkAtCommit(workId, commitSha) {
          const fileObj = await this.getFile(`works/${workId}.json`, commitSha);
          if (!fileObj || !fileObj.content) {
            throw new Error('해당 커밋에서 작품 파일을 찾을 수 없습니다.');
          }
          const rawJson = JSON.parse(base64ToUtf8(fileObj.content));
          if (rawJson && rawJson.encrypted) {
            const pw = await ensurePasswordDialog('이 과거 커밋은 암호화되어 있습니다. 비교를 위해 마스터 비밀번호를 입력하세요.');
            if (!pw) return null;
            return await CryptoEngine.decryptPayload(rawJson, pw);
          }
          return rawJson;
        }
      };

      /* =========================================================
         9. Line-by-Line Diff Engine (LCS)
         ========================================================= */
      function computeLineDiff(oldText, newText) {
        const a = String(oldText || '').split('\n');
        const b = String(newText || '').split('\n');
        const m = a.length;
        const n = b.length;

        // Guard against huge O(n*m) matrices: fallback to simple diff if extremely large
        if (m * n > 250000) {
          const out = [];
          const maxLen = Math.max(m, n);
          for (let i = 0; i < maxLen; i++) {
            if (a[i] === b[i]) {
              out.push({ type: 'same', text: a[i] });
            } else {
              if (i < m) out.push({ type: 'del', text: a[i] });
              if (i < n) out.push({ type: 'add', text: b[i] });
            }
          }
          return out;
        }

        const dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));
        for (let i = m - 1; i >= 0; i--) {
          for (let j = n - 1; j >= 0; j--) {
            if (a[i] === b[j]) {
              dp[i][j] = dp[i + 1][j + 1] + 1;
            } else {
              dp[i][j] = dp[i + 1][j] >= dp[i][j + 1] ? dp[i + 1][j] : dp[i][j + 1];
            }
          }
        }

        const result = [];
        let i = 0, j = 0;
        while (i < m && j < n) {
          if (a[i] === b[j]) {
            result.push({ type: 'same', text: a[i] });
            i++; j++;
          } else if (dp[i + 1][j] >= dp[i][j + 1]) {
            result.push({ type: 'del', text: a[i] });
            i++;
          } else {
            result.push({ type: 'add', text: b[j] });
            j++;
          }
        }
        while (i < m) { result.push({ type: 'del', text: a[i++] }); }
        while (j < n) { result.push({ type: 'add', text: b[j++] }); }
        return result;
      }

      function buildJsxSrcdoc(userCode) {
        const closeScript = '<' + '/script>';
        const encodedCode = JSON.stringify(userCode || '');
        return `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script src="https://cdn.tailwindcss.com">${closeScript}
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">${closeScript}
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">${closeScript}
  <script src="https://unpkg.com/@babel/standalone/babel.min.js">${closeScript}
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1f2937;
      background: #ffffff;
    }
    .jsx-error {
      margin: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function() {
      const rootEl = document.getElementById('root');
      function showErr(title, err) {
        rootEl.innerHTML = '<div class="jsx-error"><strong>' + title + '</strong>\\n\\n' +
          String(err && (err.message || err) || '알 수 없는 오류')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
      }

      if (!window.React || !window.ReactDOM || !window.Babel) {
        showErr('JSX 런타임 로드 실패', 'React 또는 Babel CDN을 불러오지 못했습니다. 네트워크 연결을 확인하세요.');
        return;
      }

      const raw = ${encodedCode}.trim();
      if (!raw) {
        rootEl.innerHTML = '<div style="padding:24px;text-align:center;color:#9ca3af;font-size:13px;">JSX 코드를 입력하면 이곳에 실시간으로 렌더링됩니다.</div>';
        return;
      }

      try {
        // Strip import statements (React hooks are injected into scope automatically)
        let code = raw.replace(/^\\s*import\\s+[\\s\\S]*?from\\s+['"][^'"]+['"];?\\s*$/gm, '');
        code = code.replace(/^\\s*import\\s+['"][^'"]+['"];?\\s*$/gm, '');

        let targetName = null;

        // Pattern 1: export default function CompName
        const mFunc = code.match(/export\\s+default\\s+function\\s+([A-Z][A-Za-z0-9_]*)/);
        if (mFunc) {
          targetName = mFunc[1];
          code = code.replace(/export\\s+default\\s+function\\s+/, 'function ');
        }
        // Pattern 2: export default function(...) or export default (...) =>
        else if (/export\\s+default\\s+(?:function\\s*\\(|\\(|[a-zA-Z0-9_]+\\s*=>)/.test(code)) {
          targetName = '__DefaultExport';
          code = code.replace(/export\\s+default\\s+/, 'const __DefaultExport = ');
        }
        // Pattern 3: export default CompName;
        else {
          const mRef = code.match(/export\\s+default\\s+([A-Z][A-Za-z0-9_]*)\\s*;?/);
          if (mRef) {
            targetName = mRef[1];
            code = code.replace(/export\\s+default\\s+[A-Z][A-Za-z0-9_]*\\s*;?/, '');
          }
        }

        // Remove remaining named export keywords
        code = code.replace(/^\\s*export\\s+(?=(?:const|let|var|function|class)\\s)/gm, '');

        // Pattern 4: Bare JSX fragment or element
        const trimmed = code.trim();
        if (!targetName && trimmed.startsWith('<')) {
          code = 'function __BareJSX() { return (\\n' + trimmed + '\\n); }';
          targetName = '__BareJSX';
        }

        // Pattern 5: Auto-detect last capitalized function or const component
        if (!targetName) {
          const matches = [...code.matchAll(/(?:function|const|let|var)\\s+([A-Z][A-Za-z0-9_]*)\\b/g)];
          if (matches.length > 0) {
            targetName = matches[matches.length - 1][1];
          }
        }

        if (!targetName) {
          throw new Error('렌더링할 React 컴포넌트를 찾지 못했습니다. (예: function App() { return <div>...</div> } 또는 바로 JSX 태그를 작성하세요.)');
        }

        const wrapped = code + '\\nreturn ' + targetName + ';';
        const compiled = Babel.transform(wrapped, { presets: ['react'] }).code;

        const {
          useState, useEffect, useMemo, useRef, useCallback, useReducer, useContext, createContext, Fragment
        } = React;

        const factory = new Function(
          'React', 'useState', 'useEffect', 'useMemo', 'useRef', 'useCallback', 'useReducer', 'useContext', 'createContext', 'Fragment',
          compiled
        );
        const Comp = factory(React, useState, useEffect, useMemo, useRef, useCallback, useReducer, useContext, createContext, Fragment);

        class ErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state = { error: null }; }
          static getDerivedStateFromError(error) { return { error }; }
          render() {
            if (this.state.error) {
              return React.createElement('div', { className: 'jsx-error' },
                'JSX 런타임 오류\\n\\n' + (this.state.error.message || String(this.state.error))
              );
            }
            return this.props.children;
          }
        }

        const root = ReactDOM.createRoot(rootEl);
        root.render(
          React.createElement(ErrorBoundary, null,
            typeof Comp === 'function' ? React.createElement(Comp) : Comp
          )
        );
      } catch (err) {
        showErr('JSX 컴파일 오류', err);
      }
    })();
  ${closeScript}
</body>
</html>`;
      }

      /* =========================================================
         11. Synchronized Line-Number Gutter (Supports Wrapped Text)
         ========================================================= */
      function updateLineNumbers() {
        const ta = document.getElementById('editorTextarea');
        const gutter = document.getElementById('lineGutter');
        const mirror = document.getElementById('lineMirror');
        if (!ta || !gutter) return;

        const lines = (ta.value || '').split('\n');
        const isCode = ta.classList.contains('code-mode');

        if (isCode) {
          // Non-wrapped monospace: exact 24px per line
          let html = '';
          for (let i = 1; i <= lines.length; i++) {
            html += `<span class="gutter-line" style="height:24px;">${i}</span>`;
          }
          gutter.innerHTML = html;
          gutter.scrollTop = ta.scrollTop;
          return;
        }

        // Wrapped prose mode: measure exact visual height per logical line
        const targetWidth = ta.clientWidth;
        if (targetWidth <= 0) return;
        mirror.style.width = targetWidth + 'px';

        // Fast path for very large docs (> 1200 lines) to keep typing 60fps
        if (lines.length > 1200) {
          let html = '';
          for (let i = 1; i <= lines.length; i++) {
            html += `<span class="gutter-line" style="height:24px;">${i}</span>`;
          }
          gutter.innerHTML = html;
          gutter.scrollTop = ta.scrollTop;
          return;
        }

        const frag = document.createDocumentFragment();
        mirror.innerHTML = '';
        const spans = [];
        for (let i = 0; i < lines.length; i++) {
          const div = document.createElement('div');
          div.textContent = lines[i] || '\u200b';
          mirror.appendChild(div);
          spans.push(div);
        }

        for (let i = 0; i < spans.length; i++) {
          const h = Math.max(24, spans[i].offsetHeight);
          const s = document.createElement('span');
          s.className = 'gutter-line';
          s.style.height = h + 'px';
          s.textContent = String(i + 1);
          frag.appendChild(s);
        }

        gutter.innerHTML = '';
        gutter.appendChild(frag);
        gutter.scrollTop = ta.scrollTop;
      }

      function scheduleLineNumbers() {
        clearTimeout(State.mirrorTimer);
        State.mirrorTimer = setTimeout(updateLineNumbers, 35);
      }

      function exportLorebookCsv(specificFolderId) {
        const work = getActiveWork();
        const br = getActiveBranch(work);
        if (!work || !br) return;

        const rows = [];
        for (const f of br.folders) {
          if (specificFolderId && f.id !== specificFolderId) continue;
          for (const it of f.items) {
            if (specificFolderId || f.type === 'lorebook' || it.type === 'lorebook') {
              const kw = (it.keywords || it.name || '').trim();
              const content = (it.content || '').trim();
              rows.push([kw, content]);
            }
          }
        }

        if (rows.length === 0) {
          showToast('내보낼 로어북 항목이 없습니다.', 'error');
          return;
        }

        const csvLines = ['키워드,내용'];
        for (const [kw, content] of rows) {
          csvLines.push(`${escapeCsvCell(kw)},${escapeCsvCell(content)}`);
        }

        // UTF-8 BOM ensures clean Korean display in Excel & Google Sheets
        const bomContent = '\uFEFF' + csvLines.join('\r\n');
        const fname = `${sanitizeFilename(work.title)}_${sanitizeFilename(br.name)}_로어북.csv`;
        downloadFile(fname, bomContent, 'text/csv;charset=utf-8');
        showToast(`로어북 ${rows.length}개 항목을 CSV로 내보냈습니다.`, 'success');
      }

      function renderSearchResults(container, query) {
        const lower = query.toLowerCase();
        const worksToSearch = State.searchScope === 'all' ? State.works : [getActiveWork()].filter(Boolean);
        const matches = [];

        for (const w of worksToSearch) {
          for (const br of Object.values(w.branches || {})) {
            for (const f of br.folders || []) {
              for (const it of f.items || []) {
                const hayTitle = (it.name || '').toLowerCase();
                const hayKw = (it.keywords || '').toLowerCase();
                const hayContent = (it.content || '').toLowerCase();
                const idx = hayContent.indexOf(lower);
                if (hayTitle.includes(lower) || hayKw.includes(lower) || idx !== -1) {
                  let snippet = '';
                  if (idx !== -1) {
                    const start = Math.max(0, idx - 22);
                    const end = Math.min(it.content.length, idx + query.length + 38);
                    snippet = (start > 0 ? '...' : '') + it.content.slice(start, end) + (end < it.content.length ? '...' : '');
                  } else if (hayKw.includes(lower)) {
                    snippet = '키워드: ' + it.keywords;
                  } else {
                    snippet = (it.content || '').slice(0, 60);
                  }
                  matches.push({ work: w, branch: br, folder: f, item: it, snippet });
                }
              }
            }
          }
        }

        if (matches.length === 0) {
          container.innerHTML = `<div class="p-4 text-xs text-center" style="color: var(--text-faint);">"${escapeHtml(query)}"에 해당하는 검색 결과가 없습니다.</div>`;
          return;
        }

        const highlight = (txt) => {
          const safe = escapeHtml(txt);
          const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
          return safe.replace(re, '<span class="search-highlight">$1</span>');
        };

        container.innerHTML = `
          <div class="px-2 py-1 text-[11px] font-medium" style="color: var(--text-muted);">검색 결과 ${matches.length}건</div>
          ${matches.map((m) => `
            <div class="p-2 rounded-lg cursor-pointer mb-1 border border-transparent hover:border-[var(--border)]" style="background: var(--bg-app);" data-action="jump-search" data-work-id="${m.work.id}" data-branch-id="${m.branch.id}" data-folder-id="${m.folder.id}" data-item-id="${m.item.id}">
              <div class="text-[11px] truncate mb-0.5" style="color: var(--text-faint);">
                ${escapeHtml(m.work.title)} / ${escapeHtml(m.branch.name)} / ${escapeHtml(m.folder.name)}
              </div>
              <div class="text-xs font-semibold truncate mb-0.5">${highlight(m.item.name)}</div>
              <div class="text-[11.5px] line-clamp-2" style="color: var(--text-muted);">${highlight(m.snippet)}</div>
            </div>
          `).join('')}
        `;
      }

      function applyViewModeLayout(isCode) {
        const container = document.getElementById('editorSplitContainer');
        const editorPane = document.getElementById('editorPane');
        const previewPane = document.getElementById('previewPane');
        const divider = document.getElementById('splitDivider');
        const switcher = document.getElementById('codeViewSwitch');

        switcher.querySelectorAll('button').forEach((b) => {
          b.classList.toggle('active', b.dataset.mode === State.viewMode);
        });

        if (!isCode) {
          editorPane.classList.remove('hidden');
          editorPane.style.flex = '1';
          previewPane.classList.add('hidden');
          divider.classList.add('hidden');
          container.classList.remove('stacked-split');
          return;
        }

        const isMobile = window.innerWidth < 768;
        container.classList.toggle('stacked-split', isMobile && State.viewMode === 'split');

        if (State.viewMode === 'editor') {
          editorPane.classList.remove('hidden');
          editorPane.style.flex = '1';
          previewPane.classList.add('hidden');
          divider.classList.add('hidden');
        } else if (State.viewMode === 'preview') {
          editorPane.classList.add('hidden');
          previewPane.classList.remove('hidden');
          previewPane.style.flex = '1';
          divider.classList.add('hidden');
        } else {
          // Split mode
          editorPane.classList.remove('hidden');
          previewPane.classList.remove('hidden');
          divider.classList.toggle('hidden', isMobile);
          if (!editorPane.style.flex || editorPane.style.flex === '1') {
            editorPane.style.flex = '1 1 50%';
            previewPane.style.flex = '1 1 50%';
          }
        }
      }

      function persistWorkDebounced(work) {
        if (!work) return;
        work.updatedAt = new Date().toISOString();
        clearTimeout(State.autoSaveTimer);
        State.autoSaveTimer = setTimeout(async () => {
          await Storage.put('works', work);
        }, 350);
      }

      async function persistWorkImmediate(work) {
        if (!work) return;
        work.updatedAt = new Date().toISOString();
        await Storage.put('works', work);
      }

      async function saveLocalSnapshot(customMsg) {
        const work = getActiveWork();
        const br = getActiveBranch(work);
        if (!work) return;
        const msg = customMsg || `로컬 저장 (${br ? br.name : ''}) - ${formatDateTime(new Date().toISOString())}`;
        work._baseline = buildBaselineSnapshot(work);
        await persistWorkImmediate(work);
        await Storage.addSnapshot(work, msg, br ? br.name : '');
        renderTreeOrSearch();
        renderStatusBar();
        showToast('로컬 스냅샷이 저장되었습니다.', 'success');
      }

        });
      }

      function compressImageFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const maxDim = 220;
              let w = img.width, h = img.height;
              if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              let dataUrl = canvas.toDataURL('image/webp', 0.8);
              if (!dataUrl.startsWith('data:image/webp')) {
                dataUrl = canvas.toDataURL('image/jpeg', 0.82);
              }
              resolve(dataUrl);
            };
            img.onerror = reject;
            img.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

          <button class="dropdown-item" data-branch-act="create">
            <span class="flex items-center gap-2">${ICONS.plus}<span>현재 분기 복제하여 새 분기</span></span>
          </button>
          <button class="dropdown-item" data-branch-act="rename">
            <span class="flex items-center gap-2">${ICONS.edit}<span>현재 분기 이름 변경</span></span>
          </button>
          <button class="dropdown-item danger" data-branch-act="delete">
            <span class="flex items-center gap-2">${ICONS.trash}<span>현재 분기 삭제</span></span>
          </button>
        `;

        const menu = openDropdown(anchorEl, html, false);
        menu.querySelectorAll('[data-switch-branch]').forEach((btn) => {
          btn.onclick = async () => {
            work.activeBranchId = btn.dataset.switchBranch;
            State.activeItemId = null;
            await persistWorkImmediate(work);
            closeDropdown();
            renderAll();
          };
        });

        menu.querySelector('[data-branch-act="create"]').onclick = async () => {
          closeDropdown();
          const name = await promptDialog({
            title: '새 플랫폼 버전 분기 만들기',
            label: '분기 이름 (현재 분기 내용을 그대로 복제합니다)',
            placeholder: '예: 리루챗 버전, 티팟 경량판',
            confirmText: '분기 생성'
          });
          if (!name) return;
          const curBr = getActiveBranch(work);
          const newId = uid('br');
          work.branches[newId] = {
            id: newId,
            name,
            folders: curBr ? deepClone(curBr.folders) : createBlankTemplateFolders()
          };
          work.activeBranchId = newId;
          State.activeItemId = null;
          await persistWorkImmediate(work);
          renderAll();
          showToast(`"${name}" 분기가 생성되었습니다.`, 'success');
        };

        menu.querySelector('[data-branch-act="rename"]').onclick = async () => {
          closeDropdown();
          const curBr = getActiveBranch(work);
          if (!curBr) return;
          const name = await promptDialog({
            title: '분기 이름 변경',
            label: '새 분기 이름',
            value: curBr.name,
            confirmText: '변경'
          });
          if (!name) return;
          curBr.name = name;
          await persistWorkImmediate(work);
          renderAll();
        };

        menu.querySelector('[data-branch-act="delete"]').onclick = async () => {
          closeDropdown();
          const keys = Object.keys(work.branches);
          if (keys.length <= 1) {
            showToast('최소 1개의 분기가 필요합니다.', 'error');
            return;
          }
          const curBr = getActiveBranch(work);
          const ok = await confirmDialog({
            title: '분기 삭제',
            message: `"${curBr.name}" 분기와 포함된 모든 프롬프트를 삭제할까요?`,
            confirmText: '삭제',
            danger: true
          });
          if (!ok) return;
          delete work.branches[curBr.id];
          work.activeBranchId = Object.keys(work.branches)[0];
          State.activeItemId = null;
          await persistWorkImmediate(work);
          renderAll();
          showToast('분기가 삭제되었습니다.');
        };
      }

      function openSaveModal() {
        const work = getActiveWork();
        const br = getActiveBranch(work);
        if (!work) return;
        const defaultMsg = `Update ${work.title} (${br ? br.name : ''}) - ${formatDateTime(new Date().toISOString())}`;
        const ghReady = isGithubConfigured();

        openModal({
          title: '저장 및 버전 커밋',
          icon: ICONS.save,
          bodyHtml: `
            <div class="space-y-3">
              <div class="p-2.5 rounded-lg text-xs flex items-center justify-between" style="background: var(--bg-subtle); color: var(--text-secondary);">
                <span>대상 작품: <strong>${escapeHtml(work.title)}</strong> (${escapeHtml(br ? br.name : '-')})</span>
                <span class="flex items-center gap-1" style="color: ${work.encrypted ? 'var(--amber)' : 'var(--text-muted)'};">
                  ${work.encrypted ? ICONS.lock : ICONS.unlock}

                </span>
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1" style="color: var(--text-secondary);">저장 메모 / 커밋 메시지</label>

              </div>
              ${!ghReady ? `
                <div class="p-2.5 rounded-lg text-xs flex items-center justify-between gap-2 border" style="border-color: var(--border); color: var(--text-muted);">
                  <span>GitHub 비공개 레포가 아직 연결되지 않았습니다.</span>
                  <button id="btnGoGhSetup" class="btn btn-sm">연동 설정</button>
                </div>
              ` : ''}
            </div>
          `,
          footerHtml: `
            <button class="btn" id="btnSaveLocalOnly">로컬 스냅샷만 저장</button>

          `,
          onMount: () => {
            const msgInput = document.getElementById('saveCommitMsg');

            const goSetup = document.getElementById('btnGoGhSetup');
            if (goSetup) {
              goSetup.onclick = () => openGithubSettingsModal();
            }

            document.getElementById('btnSaveLocalOnly').onclick = async () => {
              const msg = msgInput.value.trim() || defaultMsg;
              closeModal();
              await saveLocalSnapshot(msg);
            };

            const pushBtn = document.getElementById('btnSaveAndPush');
            if (pushBtn) {
              pushBtn.onclick = async () => {
                const msg = msgInput.value.trim() || defaultMsg;
                closeModal();
                State.isSyncing = true;
                renderStatusBar();
                try {
                  const res = await GitHubAPI.pushWork(work, msg);
                  if (res && res.cancelled) {
                    State.isSyncing = false;
                    renderStatusBar();
                    return;
                  }
                  work._baseline = buildBaselineSnapshot(work);
                  await persistWorkImmediate(work);
                  await Storage.addSnapshot(work, '[GitHub] ' + msg, br ? br.name : '');
                  showToast('GitHub 비공개 레포에 커밋되었습니다.', 'success');
                } catch (err) {
                  showToast(err.message || 'GitHub 저장 실패', 'error');
                } finally {
                  State.isSyncing = false;
                  renderTreeOrSearch();
                  renderStatusBar();
                }
              };
            }
          }
        });
      }

          onMount: () => {
            const readForm = async () => {
              State.github = {

                repo: document.getElementById('ghRepo').value.trim(),
                branch: document.getElementById('ghBranch').value.trim() || 'main',
                token: document.getElementById('ghToken').value.trim()
              };
              await Storage.setMeta('github', State.github);
              const pw = document.getElementById('ghMasterPw').value;

              renderTopbar();

            document.getElementById('ghCancel').onclick = closeModal;
            document.getElementById('ghSaveCfg').onclick = async () => {

              closeModal();
              showToast('설정이 저장되었습니다.', 'success');
            };

            document.getElementById('btnGhPull').onclick = async () => {
              await readForm();
              if (!isGithubConfigured()) {
                showToast('아이디, 레포 이름, 토큰을 모두 입력해 주세요.', 'error');
                return;
              }
              State.isSyncing = true;
              renderStatusBar();
              try {
                const repoInfo = await GitHubAPI.verifyRepo();
                const { pulled, decryptSkipped } = await GitHubAPI.pullAllWorks();
                let mergedCount = 0;
                for (const remoteWork of pulled) {
                  const idx = State.works.findIndex((w) => w.id === remoteWork.id);
                  if (idx >= 0) {
                    State.works[idx] = remoteWork;
                  } else {
                    State.works.push(remoteWork);
                  }
                  await Storage.put('works', remoteWork);
                  mergedCount++;
                }
                if (mergedCount > 0) {
                  State.activeWorkId = pulled[0].id;
                  State.activeItemId = null;
                  await Storage.setMeta('activeWorkId', State.activeWorkId);
                }
                renderAll();
                closeModal();
                const privText = repoInfo.private ? '비공개' : '공개';
                showToast(`연결 성공 (${privText} 레포) · ${mergedCount}개 작품 불러옴${decryptSkipped ? ` (복호화 건너뜀 ${decryptSkipped}건)` : ''}`, 'success');
              } catch (err) {
                showToast(err.message || 'GitHub 연결 실패', 'error');
              } finally {
                State.isSyncing = false;
                renderStatusBar();
              }
            };

            document.getElementById('btnGhPushAll').onclick = async () => {

              if (!isGithubConfigured()) {
                showToast('먼저 GitHub 연결 정보를 입력해 주세요.', 'error');
                return;
              }
              State.isSyncing = true;
              renderStatusBar();
              let okCount = 0;
              try {
                for (const w of State.works) {
                  const res = await GitHubAPI.pushWork(w, `Sync ${w.title} - ${formatDateTime(new Date().toISOString())}`);
                  if (res && res.cancelled) continue;
                  w._baseline = buildBaselineSnapshot(w);
                  await Storage.put('works', w);
                  okCount++;

                renderAll();
                closeModal();
                showToast(`총 ${okCount}개 작품을 GitHub에 업로드했습니다.`, 'success');
              } catch (err) {

              showToast('전체 작품 JSON 백업을 내려받았습니다.', 'success');

            document.getElementById('inputImportJson').onchange = async (e) => {
              const file = e.target.files && e.target.files[0];
              if (!file) return;
              try {
                const txt = await file.text();
                const parsed = JSON.parse(txt);
                const list = Array.isArray(parsed.works) ? parsed.works : (Array.isArray(parsed) ? parsed : []);
                if (!list.length) throw new Error('유효한 작품 데이터가 없습니다.');
                for (const w of list) {
                  if (!w.id || !w.branches) continue;
                  w._baseline = buildBaselineSnapshot(w);
                  const idx = State.works.findIndex((x) => x.id === w.id);
                  if (idx >= 0) State.works[idx] = w;
                  else State.works.push(w);
                  await Storage.put('works', w);
                }
                State.activeWorkId = State.works[0].id;
                State.activeItemId = null;
                renderAll();
                closeModal();
                showToast(`${list.length}개 작품을 가져왔습니다.`, 'success');
              } catch (err) {
                showToast(err.message || 'JSON 가져오기 실패', 'error');
              }
            };
          }
        });
      }

      /* =========================================================

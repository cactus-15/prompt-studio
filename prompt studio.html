      async function openHistoryModal() {
        const work = getActiveWork();
        if (!work) return;
        const curBr = getActiveBranch(work);
        const { item: curItem } = getActiveFolderAndItem();

        let activeTab = isGithubConfigured() ? 'github' : 'local';
        let githubCommits = [];
        let localSnaps = await Storage.getSnapshotsByWork(work.id);
        let selectedSnapshotWork = null;
        let selectedMetaLabel = '';
        let selectedCompareKey = curBr && curItem ? `${curBr.id}::${curItem.id}` : '';

        openModal({
          title: `이전 작업내역 및 버전 비교 — ${work.title}`,
          icon: ICONS.history,
          large: true,
          bodyHtml: `
            <div class="flex flex-col h-full gap-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="segmented">
                  <button id="histTabGithub" class="${activeTab === 'github' ? 'active' : ''}" type="button">GitHub 커밋 히스토리</button>
                  <button id="histTabLocal" class="${activeTab === 'local' ? 'active' : ''}" type="button">로컬 스냅샷 (${localSnaps.length})</button>
                </div>
                <div id="histRestoreWrap" class="hidden flex items-center gap-2">
                  <select id="histItemSelect" class="select-field input-sm" style="max-width: 240px;"></select>
                  <button id="btnRestoreVersion" class="btn btn-primary btn-sm">${ICONS.revert}<span>이 버전으로 작품 복구</span></button>
                </div>
              </div>

              <div class="flex-1 min-h-0 grid grid-cols-1 md:grid-cols-12 gap-3 overflow-hidden">
                <div id="histListPane" class="md:col-span-4 border rounded-lg overflow-y-auto p-2" style="border-color: var(--border); background: var(--bg-sidebar);"></div>
                <div id="histDiffPane" class="md:col-span-8 flex flex-col min-h-0 overflow-hidden">
                  <div class="flex-1 flex items-center justify-center border rounded-lg text-xs p-6 text-center" style="border-color: var(--border); color: var(--text-faint);">
                    왼쪽 목록에서 버전을 선택하면 현재 버전과의 변경 내역(Diff)을 비교합니다.
                  </div>
                </div>
              </div>
            </div>
          `,
          onMount: async () => {
            const tabGh = document.getElementById('histTabGithub');
            const tabLoc = document.getElementById('histTabLocal');
            const listPane = document.getElementById('histListPane');
            const diffPane = document.getElementById('histDiffPane');
            const restoreWrap = document.getElementById('histRestoreWrap');
            const itemSelect = document.getElementById('histItemSelect');

            function collectAllItemsMap(wObj) {
              const map = {};
              const list = [];
              for (const br of Object.values(wObj.branches || {})) {
                for (const f of br.folders || []) {
                  for (const it of f.items || []) {
                    const key = `${br.id}::${it.id}`;
                    const label = `[${br.name}] ${f.name} / ${it.name}`;
                    map[key] = { label, content: it.content || '', keywords: it.keywords || '' };
                    list.push({ key, label });
                  }
                }
              }
              return { map, list };
            }

            function renderDiffForSelected() {
              if (!selectedSnapshotWork) return;
              const oldAll = collectAllItemsMap(selectedSnapshotWork);
              const curAll = collectAllItemsMap(work);

              // Union of keys
              const keySet = new Map();
              for (const x of curAll.list) keySet.set(x.key, x.label);
              for (const x of oldAll.list) if (!keySet.has(x.key)) keySet.set(x.key, x.label + ' (현재 삭제됨)');

              const entries = Array.from(keySet.entries());
              if (!keySet.has(selectedCompareKey) && entries.length) {
                selectedCompareKey = entries[0][0];
              }

              itemSelect.innerHTML = entries.map(([k, lbl]) => (
                `<option value="${escapeHtml(k)}" ${k === selectedCompareKey ? 'selected' : ''}>${escapeHtml(lbl)}</option>`
              )).join('');
              restoreWrap.classList.remove('hidden');

              const oldText = (oldAll.map[selectedCompareKey] && oldAll.map[selectedCompareKey].content) || '';
              const curText = (curAll.map[selectedCompareKey] && curAll.map[selectedCompareKey].content) || '';
              const diff = computeLineDiff(oldText, curText);

              let added = 0, removed = 0;
              for (const d of diff) {
                if (d.type === 'add') added++;
                else if (d.type === 'del') removed++;
              }

              diffPane.innerHTML = `
                <div class="flex items-center justify-between text-xs mb-2 px-1" style="color: var(--text-muted);">
                  <span class="truncate font-medium">${escapeHtml(selectedMetaLabel)} → 현재 편집본</span>
                  <span class="flex-shrink-0 font-mono">
                    <span style="color: var(--accent);">+${added}줄</span> / <span style="color: var(--danger);">-${removed}줄</span>
                  </span>
                </div>
                <div class="diff-box flex-1">
                  ${diff.length === 0 || (added === 0 && removed === 0)
                    ? '<div class="p-6 text-center text-xs" style="color: var(--text-faint);">선택한 항목은 과거 버전과 현재 버전이 동일합니다.</div>'
                    : diff.map((d) => `
                        <div class="diff-line ${d.type === 'add' ? 'add' : d.type === 'del' ? 'del' : ''}">
                          <span class="diff-sign">${d.type === 'add' ? '+' : d.type === 'del' ? '-' : ' '}</span>
                          <span>${escapeHtml(d.text || ' ')}</span>
                        </div>
                      `).join('')}
                </div>
              `;
            }

            itemSelect.onchange = () => {
              selectedCompareKey = itemSelect.value;
              renderDiffForSelected();
            };

            document.getElementById('btnRestoreVersion').onclick = async () => {
              if (!selectedSnapshotWork) return;
              const ok = await confirmDialog({
                title: '과거 버전으로 복구',
                message: `선택한 버전(${selectedMetaLabel})으로 "${work.title}" 작품 전체를 복구할까요? 복구 직전의 현재 상태는 로컬 스냅샷으로 자동 백업됩니다.`,
                confirmText: '복구하기',
                danger: false
              });
              if (!ok) return;
              // Backup current first
              await Storage.addSnapshot(work, '복구 직전 자동 백업', curBr ? curBr.name : '');
              const restored = deepClone(selectedSnapshotWork);
              restored.id = work.id;
              restored.updatedAt = new Date().toISOString();
              restored._baseline = buildBaselineSnapshot(restored);
              const idx = State.works.findIndex((w) => w.id === work.id);
              if (idx >= 0) State.works[idx] = restored;
              await Storage.put('works', restored);
              State.activeItemId = null;
              closeModal();
              renderAll();
              showToast('선택한 버전으로 작품을 복구했습니다.', 'success');
            };

            async function renderList() {
              tabGh.classList.toggle('active', activeTab === 'github');
              tabLoc.classList.toggle('active', activeTab === 'local');

              if (activeTab === 'github') {
                if (!isGithubConfigured()) {
                  listPane.innerHTML = '<div class="p-4 text-xs text-center" style="color: var(--text-faint);">GitHub 비공개 레포를 연결하면 커밋 히스토리를 불러올 수 있습니다.</div>';
                  return;
                }
                listPane.innerHTML = '<div class="p-4 text-xs text-center" style="color: var(--text-faint);">GitHub 커밋 목록 불러오는 중...</div>';
                try {
                  githubCommits = await GitHubAPI.getCommits(work.id);
                  if (!githubCommits.length) {
                    listPane.innerHTML = '<div class="p-4 text-xs text-center" style="color: var(--text-faint);">이 작품의 GitHub 커밋 이력이 아직 없습니다.</div>';
                    return;
                  }
                  listPane.innerHTML = githubCommits.map((c) => `
                    <button class="w-full text-left p-2.5 rounded-lg mb-1.5 border hover:border-[var(--accent)] transition" style="border-color: var(--border); background: var(--bg-app);" data-commit-sha="${c.sha}">
                      <div class="text-xs font-semibold truncate mb-1">${escapeHtml(c.commit.message)}</div>
                      <div class="flex items-center justify-between text-[11px]" style="color: var(--text-faint);">
                        <span>${formatDateTime(c.commit.author && c.commit.author.date)}</span>
                        <span class="font-mono">${c.sha.slice(0, 7)}</span>
                      </div>
                    </button>
                  `).join('');

                  listPane.querySelectorAll('[data-commit-sha]').forEach((btn) => {
                    btn.onclick = async () => {
                      const sha = btn.dataset.commitSha;
                      diffPane.innerHTML = '<div class="flex-1 flex items-center justify-center border rounded-lg text-xs" style="border-color: var(--border); color: var(--text-faint);">커밋 데이터를 불러오고 복호화하는 중...</div>';
                      try {
                        const historic = await GitHubAPI.getWorkAtCommit(work.id, sha);
                        if (!historic) return;
                        selectedSnapshotWork = historic;
                        selectedMetaLabel = `GitHub ${sha.slice(0, 7)}`;
                        renderDiffForSelected();
                      } catch (err) {
                        diffPane.innerHTML = `<div class="p-4 text-xs" style="color: var(--danger);">${escapeHtml(err.message)}</div>`;
                      }
                    };
                  });
                } catch (err) {
                  listPane.innerHTML = `<div class="p-4 text-xs" style="color: var(--danger);">${escapeHtml(err.message)}</div>`;
                }
              } else {
                if (!localSnaps.length) {
                  listPane.innerHTML = '<div class="p-4 text-xs text-center" style="color: var(--text-faint);">저장된 로컬 스냅샷이 없습니다. 상단 저장 버튼을 눌러 스냅샷을 만들어 보세요.</div>';
                  return;
                }
                listPane.innerHTML = localSnaps.map((s) => `
                  <button class="w-full text-left p-2.5 rounded-lg mb-1.5 border hover:border-[var(--accent)] transition" style="border-color: var(--border); background: var(--bg-app);" data-snap-id="${s.id}">
                    <div class="text-xs font-semibold truncate mb-1">${escapeHtml(s.message)}</div>
                    <div class="flex items-center justify-between text-[11px]" style="color: var(--text-faint);">
                      <span>${formatDateTime(s.timestamp)}</span>
                      <span>${escapeHtml(s.branchName || '')}</span>
                    </div>
                  </button>
                `).join('');

                listPane.querySelectorAll('[data-snap-id]').forEach((btn) => {
                  btn.onclick = () => {
                    const snap = localSnaps.find((x) => x.id === btn.dataset.snapId);
                    if (!snap) return;
                    selectedSnapshotWork = snap.data;
                    selectedMetaLabel = `스냅샷 (${formatDateTime(snap.timestamp)})`;
                    renderDiffForSelected();
                  };
                });
              }
            }

            tabGh.onclick = () => { activeTab = 'github'; renderList(); };
            tabLoc.onclick = () => { activeTab = 'local'; renderList(); };
            renderList();
          }
        });
      }

      /* =========================================================
         17. Tree CRUD Handlers (Folders & Items)
         ========================================================= */
      function openAddFolderModal() {
        const work = getActiveWork();
        const br = getActiveBranch(work);
        if (!work || !br) return;

        openModal({
          title: '새 폴더 추가',
          icon: ICONS.folder,
          bodyHtml: `
            <div class="space-y-3">
              <div>
                <label class="block text-xs font-semibold mb-1" style="color: var(--text-secondary);">폴더 이름</label>
                <input id="newFldName" type="text" class="input-field w-full" placeholder="예: 캐릭터별 개별 설정, 서브 UI" />
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1" style="color: var(--text-secondary);">기본 항목 유형</label>
                <select id="newFldType" class="select-field w-full">
                  <option value="text">일반 텍스트</option>
                  <option value="lorebook">로어북 (키워드 + 내용, CSV 내보내기 지원)</option>
                  <option value="html">HTML (실시간 렌더링)</option>
                  <option value="jsx">JSX (React 실시간 렌더링)</option>
                </select>
              </div>
            </div>
          `,
          footerHtml: `
            <button class="btn" id="fldCancel">취소</button>
            <button class="btn btn-primary" id="fldCreate">추가</button>
          `,
          onMount: () => {
            const inp = document.getElementById('newFldName');
            inp.focus();
            const submit = async () => {
              const name = inp.value.trim();
              if (!name) {
                showToast('폴더 이름을 입력해 주세요.', 'error');
                return;
              }
              const type = document.getElementById('newFldType').value;
              const newItem = {
                id: uid('itm'),
                name: type === 'lorebook' ? '새 로어북 항목' : '새 항목',
                type,
                keywords: type === 'lorebook' ? '' : '',
                content: ''
              };
              const folder = {
                id: uid('fld'),
                name,
                type,
                expanded: true,
                items: [newItem]
              };
              br.folders.push(folder);
              State.activeFolderId = folder.id;
              State.activeItemId = newItem.id;
              await persistWorkImmediate(work);
              closeModal();
              renderAll();
            };
            inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
            document.getElementById('fldCancel').onclick = closeModal;
            document.getElementById('fldCreate').onclick = submit;
          }
        });
      }

      async function addItemToFolder(folderId) {
        const work = getActiveWork();
        const br = getActiveBranch(work);
        const folder = br && br.folders.find((f) => f.id === folderId);
        if (!folder) return;

        const name = await promptDialog({
          title: `"${folder.name}"에 새 항목 추가`,
          label: '항목 이름',
          placeholder: folder.type === 'lorebook' ? '예: NPC 설정' : '예: 추가 지침',
          confirmText: '추가'
        });
        if (!name) return;

        const item = {
          id: uid('itm'),
          name,
          type: folder.type || 'text',
          keywords: '',
          content: ''
        };
        folder.expanded = true;
        folder.items.push(item);
        State.activeFolderId = folder.id;
        State.activeItemId = item.id;
        if (item.type === 'html' || item.type === 'jsx') {
          State.viewMode = 'split';
        }
        await persistWorkImmediate(work);
        renderAll();
      }

      function openFolderMenu(anchorEl, folderId) {
        const work = getActiveWork();
        const br = getActiveBranch(work);
        const idx = br.folders.findIndex((f) => f.id === folderId);
        const folder = br.folders[idx];
        if (!folder) return;

        const menu = openDropdown(anchorEl, `
          <button class="dropdown-item" data-act="add">${ICONS.plus}<span>항목 추가</span></button>
          <button class="dropdown-item" data-act="rename">${ICONS.edit}<span>폴더 이름 변경</span></button>
          ${folder.type === 'lorebook' ? `<button class="dropdown-item" data-act="csv">${ICONS.table}<span>이 폴더 CSV 내보내기</span></button>` : ''}
          <div class="dropdown-sep"></div>
          <button class="dropdown-item" data-act="up" ${idx === 0 ? 'disabled style="opacity:0.4"' : ''}>${ICONS.arrowUp}<span>위로 이동</span></button>
          <button class="dropdown-item" data-act="down" ${idx === br.folders.length - 1 ? 'disabled style="opacity:0.4"' : ''}>${ICONS.arrowDown}<span>아래로 이동</span></button>
          <div class="dropdown-sep"></div>
          <button class="dropdown-item danger" data-act="del">${ICONS.trash}<span>폴더 삭제</span></button>
        `, true);

        menu.querySelector('[data-act="add"]').onclick = () => { closeDropdown(); addItemToFolder(folderId); };
        menu.querySelector('[data-act="rename"]').onclick = async () => {
          closeDropdown();
          const name = await promptDialog({ title: '폴더 이름 변경', label: '새 폴더 이름', value: folder.name, confirmText: '변경' });
          if (!name) return;
          folder.name = name;
          await persistWorkImmediate(work);
          renderAll();
        };
        const csvBtn = menu.querySelector('[data-act="csv"]');
        if (csvBtn) csvBtn.onclick = () => { closeDropdown(); exportLorebookCsv(folder.id); };

        menu.querySelector('[data-act="up"]').onclick = async () => {
          closeDropdown();
          if (idx <= 0) return;
          [br.folders[idx - 1], br.folders[idx]] = [br.folders[idx], br.folders[idx - 1]];
          await persistWorkImmediate(work);
          renderTreeOrSearch();
        };
        menu.querySelector('[data-act="down"]').onclick = async () => {
          closeDropdown();
          if (idx >= br.folders.length - 1) return;
          [br.folders[idx + 1], br.folders[idx]] = [br.folders[idx], br.folders[idx + 1]];
          await persistWorkImmediate(work);
          renderTreeOrSearch();
        };
        menu.querySelector('[data-act="del"]').onclick = async () => {
          closeDropdown();
          const ok = await confirmDialog({
            title: '폴더 삭제',
            message: `"${folder.name}" 폴더와 내부의 모든 항목(${folder.items.length}개)을 삭제할까요?`,
            confirmText: '삭제',
            danger: true
          });
          if (!ok) return;
          br.folders.splice(idx, 1);
          if (State.activeFolderId === folder.id) {
            State.activeItemId = null;
          }
          await persistWorkImmediate(work);
          renderAll();
        };
      }

      function openItemMenu(anchorEl, folderId, itemId) {
        const work = getActiveWork();
        const br = getActiveBranch(work);
        const folder = br.folders.find((f) => f.id === folderId);
        if (!folder) return;
        const idx = folder.items.findIndex((it) => it.id === itemId);
        const item = folder.items[idx];
        if (!item) return;

        const menu = openDropdown(anchorEl, `
          <button class="dropdown-item" data-act="rename">${ICONS.edit}<span>이름 변경</span></button>
          <button class="dropdown-item" data-act="dup">${ICONS.copy}<span>항목 복제</span></button>
          <div class="dropdown-sep"></div>
          <button class="dropdown-item" data-act="up" ${idx === 0 ? 'disabled style="opacity:0.4"' : ''}>${ICONS.arrowUp}<span>위로 이동</span></button>
          <button class="dropdown-item" data-act="down" ${idx === folder.items.length - 1 ? 'disabled style="opacity:0.4"' : ''}>${ICONS.arrowDown}<span>아래로 이동</span></button>
          <div class="dropdown-sep"></div>
          <button class="dropdown-item danger" data-act="del">${ICONS.trash}<span>항목 삭제</span></button>
        `, true);

        menu.querySelector('[data-act="rename"]').onclick = async () => {
          closeDropdown();
          const name = await promptDialog({ title: '항목 이름 변경', label: '새 항목 이름', value: item.name, confirmText: '변경' });
          if (!name) return;
          item.name = name;
          await persistWorkImmediate(work);
          renderAll();
        };
        menu.querySelector('[data-act="dup"]').onclick = async () => {
          closeDropdown();
          const copy = deepClone(item);
          copy.id = uid('itm');
          copy.name = item.name + ' (복사본)';
          folder.items.splice(idx + 1, 0, copy);
          State.activeItemId = copy.id;
          await persistWorkImmediate(work);
          renderAll();
        };
        menu.querySelector('[data-act="up"]').onclick = async () => {
          closeDropdown();
          if (idx <= 0) return;
          [folder.items[idx - 1], folder.items[idx]] = [folder.items[idx], folder.items[idx - 1]];
          await persistWorkImmediate(work);
          renderTreeOrSearch();
        };
        menu.querySelector('[data-act="down"]').onclick = async () => {
          closeDropdown();
          if (idx >= folder.items.length - 1) return;
          [folder.items[idx + 1], folder.items[idx]] = [folder.items[idx], folder.items[idx + 1]];
          await persistWorkImmediate(work);
          renderTreeOrSearch();
        };
        menu.querySelector('[data-act="del"]').onclick = async () => {
          closeDropdown();
          const ok = await confirmDialog({
            title: '항목 삭제',
            message: `"${item.name}" 항목을 삭제할까요?`,
            confirmText: '삭제',
            danger: true
          });
          if (!ok) return;
          folder.items.splice(idx, 1);
          if (State.activeItemId === item.id) {
            State.activeItemId = null;
          }
          await persistWorkImmediate(work);
          renderAll();
        };
      }

      /* =========================================================
         18. Event Bindings
         ========================================================= */
      function bindEvents() {
        // Close dropdowns on outside click
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.dropdown-menu') && !e.target.closest('#btnBranchMenu') && !e.target.closest('#btnExportMenu') && !e.target.closest('[data-action="folder-menu"]') && !e.target.closest('[data-action="item-menu"]')) {
            closeDropdown();
          }
        });

        // Sidebar Toggle
        document.getElementById('btnToggleSidebar').onclick = async () => {
          if (window.innerWidth <= 860) {
            State.mobileDrawerOpen = !State.mobileDrawerOpen;
          } else {
            State.sidebarCollapsed = !State.sidebarCollapsed;
            await Storage.setMeta('sidebarCollapsed', State.sidebarCollapsed);
          }
          renderSidebarState();
        };

        document.getElementById('sidebarBackdrop').onclick = () => {
          State.mobileDrawerOpen = false;
          renderSidebarState();
        };

        // Topbar controls
        document.getElementById('btnWorkSwitcher').onclick = openWorkSwitcherModal;
        document.getElementById('btnEditWorkMeta').onclick = () => openWorkMetaModal();
        document.getElementById('btnBranchMenu').onclick = (e) => openBranchDropdown(e.currentTarget);
        document.getElementById('btnHistory').onclick = openHistoryModal;
        document.getElementById('btnGithubSettings').onclick = openGithubSettingsModal;
        document.getElementById('btnSavePrimary').onclick = openSaveModal;

        // Per-Work Encryption Toggle
        document.getElementById('btnToggleEncrypt').onclick = async () => {
          const work = getActiveWork();
          if (!work) return;
          if (!work.encrypted) {
            const pw = await ensurePasswordDialog('이 작품의 암호화 저장을 켭니다. GitHub 업로드 시 사용할 마스터 비밀번호를 설정하세요.');
            if (!pw) return;
            work.encrypted = true;
            showToast('암호화 저장이 활성화되었습니다. (GitHub 커밋 시 AES-GCM 암호화)', 'success');
          } else {
            work.encrypted = false;
            showToast('평문 저장 모드로 전환되었습니다.');
          }
          await persistWorkImmediate(work);
          renderTopbar();
          renderStatusBar();
        };

        // Theme Toggle
        document.getElementById('btnTheme').onclick = async () => {
          State.theme = State.theme === 'dark' ? 'light' : 'dark';
          await Storage.setMeta('theme', State.theme);
          renderTheme();
        };

        // Search
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', () => {
          State.searchQuery = searchInput.value;
          renderTreeOrSearch();
        });
        document.getElementById('btnClearSearch').onclick = () => {
          State.searchQuery = '';
          searchInput.value = '';
          renderTreeOrSearch();
        };
        document.getElementById('scopeCurrent').onclick = () => {
          State.searchScope = 'current';
          document.getElementById('scopeCurrent').classList.add('active');
          document.getElementById('scopeAll').classList.remove('active');
          renderTreeOrSearch();
        };
        document.getElementById('scopeAll').onclick = () => {
          State.searchScope = 'all';
          document.getElementById('scopeAll').classList.add('active');
          document.getElementById('scopeCurrent').classList.remove('active');
          renderTreeOrSearch();
        };

        // Sidebar quick buttons
        document.getElementById('btnAddFolder').onclick = openAddFolderModal;
        document.getElementById('btnQuickCsv').onclick = () => exportLorebookCsv();
        document.getElementById('btnQuickTxt').onclick = exportWholeBranchTxt;
        document.getElementById('btnLoreBarCsv').onclick = () => exportLorebookCsv();

        // Empty state add item
        document.getElementById('btnEmptyAddItem').onclick = () => {
          const br = getActiveBranch();
          if (br && br.folders.length) addItemToFolder(br.folders[0].id);
          else openAddFolderModal();
        };

        // Tree delegated clicks
        document.getElementById('treeContainer').addEventListener('click', async (e) => {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;
          const act = btn.dataset.action;

          if (act === 'add-item') {
            e.stopPropagation();
            addItemToFolder(btn.dataset.folderId);
            return;
          }
          if (act === 'folder-menu') {
            e.stopPropagation();
            openFolderMenu(btn, btn.dataset.folderId);
            return;
          }
          if (act === 'item-menu') {
            e.stopPropagation();
            openItemMenu(btn, btn.dataset.folderId, btn.dataset.itemId);
            return;
          }
          if (act === 'toggle-folder') {
            const work = getActiveWork();
            const br = getActiveBranch(work);
            const f = br && br.folders.find((x) => x.id === btn.dataset.folderId);
            if (f) {
              f.expanded = !f.expanded;
              persistWorkDebounced(work);
              renderTreeOrSearch();
            }
            return;
          }
          if (act === 'select-item') {
            const work = getActiveWork();
            const br = getActiveBranch(work);
            State.activeFolderId = btn.dataset.folderId;
            State.activeItemId = btn.dataset.itemId;
            const { item } = getActiveFolderAndItem();
            if (item && (item.type === 'html' || item.type === 'jsx')) {
              State.viewMode = 'split';
            }
            if (window.innerWidth <= 860) {
              State.mobileDrawerOpen = false;
              renderSidebarState();
            }
            renderTreeOrSearch();
            renderEditorPane();
            return;
          }
          if (act === 'jump-search') {
            const wId = btn.dataset.workId;
            const bId = btn.dataset.branchId;
            const fId = btn.dataset.folderId;
            const iId = btn.dataset.itemId;
            State.activeWorkId = wId;
            const w = getActiveWork();
            if (w && w.branches[bId]) {
              w.activeBranchId = bId;
              const f = w.branches[bId].folders.find((x) => x.id === fId);
              if (f) f.expanded = true;
            }
            State.activeFolderId = fId;
            State.activeItemId = iId;
            State.searchQuery = '';
            document.getElementById('searchInput').value = '';
            if (window.innerWidth <= 860) {
              State.mobileDrawerOpen = false;
            }
            await Storage.setMeta('activeWorkId', wId);
            renderAll();
          }
        });

        // Editor item inline rename & type switch
        document.getElementById('activeItemTitle').addEventListener('input', (e) => {
          const work = getActiveWork();
          const { item } = getActiveFolderAndItem();
          if (!item) return;
          item.name = e.target.value;
          persistWorkDebounced(work);
          renderTreeOrSearch();
        });

        document.getElementById('itemTypeSelect').addEventListener('change', (e) => {
          const work = getActiveWork();
          const { item } = getActiveFolderAndItem();
          if (!item) return;
          item.type = e.target.value;
          if (item.type === 'html' || item.type === 'jsx') {
            State.viewMode = 'split';
          }
          persistWorkDebounced(work);
          renderTreeOrSearch();
          renderEditorPane();
        });

        // Lorebook keywords input
        document.getElementById('loreKeywordsInput').addEventListener('input', (e) => {
          const work = getActiveWork();
          const { item } = getActiveFolderAndItem();
          if (!item) return;
          item.keywords = e.target.value;
          const kwCount = item.keywords.split(',').map((s) => s.trim()).filter(Boolean).length;
          document.getElementById('loreKeywordCount').textContent = kwCount + '개';
          persistWorkDebounced(work);
          renderTreeOrSearch();
          renderStatusBar();
        });

        // Main Textarea Editing, Tab Key & Scroll Sync
        const ta = document.getElementById('editorTextarea');
        const gutter = document.getElementById('lineGutter');

        ta.addEventListener('scroll', () => {
          gutter.scrollTop = ta.scrollTop;
        });

        ta.addEventListener('input', () => {
          const work = getActiveWork();
          const { item } = getActiveFolderAndItem();
          if (!item) return;
          item.content = ta.value;
          persistWorkDebounced(work);
          scheduleLineNumbers();
          renderStatusBar();
          if (item.type === 'html' || item.type === 'jsx') {
            scheduleLivePreview();
          }
          // Update right-aligned char count & amber dot in tree smoothly
          renderTreeOrSearch();
        });

        ta.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            e.preventDefault();
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
            ta.selectionStart = ta.selectionEnd = start + 2;
            ta.dispatchEvent(new Event('input'));
          }
        });

        // View mode switcher (에디터 / 분할 / 미리보기)
        document.getElementById('codeViewSwitch').addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-mode]');
          if (!btn) return;
          State.viewMode = btn.dataset.mode;
          applyViewModeLayout(true);
          scheduleLineNumbers();
          if (State.viewMode !== 'editor') renderLivePreview(true);
        });

        // Preview controls
        document.getElementById('btnPreviewFull').onclick = () => {
          State.previewMobile = false;
          document.getElementById('btnPreviewFull').classList.add('active');
          document.getElementById('btnPreviewMobile').classList.remove('active');
          document.getElementById('previewFrameWrap').classList.remove('mobile-frame');
        };
        document.getElementById('btnPreviewMobile').onclick = () => {
          State.previewMobile = true;
          document.getElementById('btnPreviewMobile').classList.add('active');
          document.getElementById('btnPreviewFull').classList.remove('active');
          document.getElementById('previewFrameWrap').classList.add('mobile-frame');
        };
        document.getElementById('btnRefreshPreview').onclick = () => renderLivePreview(true);

        // Copy / Export / Revert buttons
        document.getElementById('btnCopyItem').onclick = async () => {
          const { item } = getActiveFolderAndItem();
          if (!item) return;
          const ok = await copyTextToClipboard(item.content || '');
          showToast(ok ? '현재 항목 내용을 클립보드에 복사했습니다.' : '복사에 실패했습니다.', ok ? 'success' : 'error');
        };

        document.getElementById('btnExportMenu').onclick = (e) => {
          const menu = openDropdown(e.currentTarget, `
            <button class="dropdown-item" data-exp="item-txt">${ICONS.fileText}<span>현재 항목 TXT 내보내기</span></button>
            <button class="dropdown-item" data-exp="work-txt">${ICONS.download}<span>작품 분기 전체 TXT 내보내기</span></button>
            <div class="dropdown-sep"></div>
            <button class="dropdown-item" data-exp="lore-csv">${ICONS.table}<span>로어북 CSV 내보내기 [키워드|내용]</span></button>
          `, true);
          menu.querySelector('[data-exp="item-txt"]').onclick = () => { closeDropdown(); exportCurrentItemTxt(); };
          menu.querySelector('[data-exp="work-txt"]').onclick = () => { closeDropdown(); exportWholeBranchTxt(); };
          menu.querySelector('[data-exp="lore-csv"]').onclick = () => { closeDropdown(); exportLorebookCsv(); };
        };

        document.getElementById('btnRevertItem').onclick = async () => {
          const work = getActiveWork();
          const br = getActiveBranch(work);
          const { item } = getActiveFolderAndItem();
          if (!work || !br || !item) return;
          const base = work._baseline && work._baseline[`${br.id}::${item.id}`];
          if (!base) {
            showToast('되돌릴 이전 저장 지점이 없습니다.');
            return;
          }
          if (!isItemDirty(work, br.id, item)) {
            showToast('변경된 내용이 없습니다.');
            return;
          }
          const ok = await confirmDialog({
            title: '항목 되돌리기',
            message: `"${item.name}" 항목을 마지막 저장 상태로 되돌릴까요?`,
            confirmText: '되돌리기',
            danger: true
          });
          if (!ok) return;
          item.name = base.name;
          item.type = base.type;
          item.keywords = base.keywords;
          item.content = base.content;
          await persistWorkImmediate(work);
          renderTreeOrSearch();
          renderEditorPane();
          showToast('마지막 저장 시점으로 되돌렸습니다.');
        };

        // Draggable Split Divider (Pointer Events for Mouse & Tablet Touch)
        const divider = document.getElementById('splitDivider');
        let dragging = false;
        divider.addEventListener('pointerdown', (e) => {
          dragging = true;
          divider.classList.add('dragging');
          divider.setPointerCapture(e.pointerId);
        });
        divider.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          const container = document.getElementById('editorSplitContainer');
          const rect = container.getBoundingClientRect();
          const ratio = Math.min(0.8, Math.max(0.2, (e.clientX - rect.left) / rect.width));
          document.getElementById('editorPane').style.flex = `0 0 ${(ratio * 100).toFixed(2)}%`;
          document.getElementById('previewPane').style.flex = `1 1 ${((1 - ratio) * 100).toFixed(2)}%`;
          scheduleLineNumbers();
        });
        divider.addEventListener('pointerup', () => {
          dragging = false;
          divider.classList.remove('dragging');
        });

        // Global Shortcuts
        window.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'f') {
            e.preventDefault();
            if (window.innerWidth <= 860) {
              State.mobileDrawerOpen = true;
            } else {
              State.sidebarCollapsed = false;
            }
            renderSidebarState();
            const inp = document.getElementById('searchInput');
            inp.focus();
            inp.select();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            saveLocalSnapshot();
          } else if (e.key === 'Escape') {
            closeDropdown();
            closeModal();
          }
        });

        // Responsive Resize Handling
        window.addEventListener('resize', () => {
          renderSidebarState();
          const { item } = getActiveFolderAndItem();
          if (item && (item.type === 'html' || item.type === 'jsx')) {
            applyViewModeLayout(true);
          }
          scheduleLineNumbers();
        });
      }

      /* =========================================================
         19. Bootstrap
         ========================================================= */
      async function init() {
        initStaticIcons();
        await Storage.init();

        State.theme = await Storage.getMeta('theme', 'light');
        State.sidebarCollapsed = await Storage.getMeta('sidebarCollapsed', false);
        State.rememberPassword = await Storage.getMeta('rememberPassword', true);
        const savedGh = await Storage.getMeta('github', null);
        if (savedGh) State.github = { ...State.github, ...savedGh };

        const works = await Storage.getAll('works');
        if (works && works.length > 0) {
          State.works = works.map((w) => {
            if (!w._baseline) w._baseline = buildBaselineSnapshot(w);
            return w;
          }).sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
        } else {
          const sample = createSampleWork();
          State.works = [sample];
          await Storage.put('works', sample);
          await Storage.addSnapshot(sample, '초기 샘플 스냅샷', '기본 (공통)');
        }

        const savedActiveWorkId = await Storage.getMeta('activeWorkId', null);
        State.activeWorkId = (savedActiveWorkId && State.works.some((w) => w.id === savedActiveWorkId))
          ? savedActiveWorkId
          : State.works[0].id;

        bindEvents();
        renderAll();
      }

      init();
    })();
  </script>
</body>
</html>
